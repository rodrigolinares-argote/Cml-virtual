<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0F1923" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CML Virtual</title>
  <style>
    :root{
      --bg:#0F1923;--surface:#172332;--surface-2:#1E2D3E;--border:#2D4055;
      --text:#F1F5F9;--muted:#94A3B8;--primary:#3B82F6;--primary-2:#2563EB;
      --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;--radius:18px;
      --shadow:0 12px 28px rgba(0,0,0,.26);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    .header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border);background:rgba(15,25,35,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .header h1{font-size:18px;margin:0}
    .header .date{font-size:12px;color:var(--muted);text-align:right}
    main{overflow:auto;padding:16px 16px 28px}
    .tabbar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#101A25;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .tab{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px;font-weight:700}
    .tab span{display:block;font-size:20px;margin-bottom:3px}
    .tab.active{color:var(--text);background:var(--surface-2)}
    .card{background:linear-gradient(180deg,var(--surface),#14202C);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .card h2,.card h3{margin:0 0 8px}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}
    .muted{color:var(--muted)}
    .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;color:white;background:var(--primary)}
    .btn:active{transform:scale(.99)}
    .btn.secondary{background:var(--surface-2);border:1px solid var(--border)}
    .btn.success{background:var(--success);color:#06240f}
    .btn.danger{background:var(--danger)}
    .btn.small{width:auto;padding:9px 12px;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
    .stat b{display:block;font-size:18px;margin-top:4px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
    .step{padding:9px 5px;text-align:center;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:800}
    .step.active{color:#fff;background:#1D4ED8;border-color:#3B82F6}
    .client-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(148,163,184,.12)}
    .client-row:last-child{border-bottom:0}
    .client-name{font-weight:800}
    .money{font-variant-numeric:tabular-nums;font-weight:800}
    .badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}
    .badge.pending{background:rgba(239,68,68,.15);color:#FCA5A5}
    .badge.partial{background:rgba(245,158,11,.15);color:#FCD34D}
    .badge.paid{background:rgba(34,197,94,.15);color:#86EFAC}
    .field{margin:12px 0}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
    .input{width:100%;border:1px solid var(--border);background:#0D1721;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}
    .input:focus{border-color:var(--primary)}
    .empty{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .empty-icon{font-size:48px;margin-bottom:10px}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .search{flex:1}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.56);display:none;align-items:flex-end;z-index:50;overscroll-behavior:contain}
    .sheet-backdrop.show{display:flex}
    .sheet{
      position:relative;
      width:100%;
      height:min(88dvh,88vh);
      max-height:min(88dvh,88vh);
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
      background:#13202C;
      border-radius:24px 24px 0 0;
      border:1px solid var(--border);
      padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    }
    .sheet-handle{width:44px;height:5px;border-radius:99px;background:#42566E;margin:0 auto 16px}
    .sheet-close{
      position:sticky;
      top:0;
      z-index:8;
      display:flex;
      justify-content:flex-end;
      height:0;
      pointer-events:none;
    }
    .sheet-close button{
      pointer-events:auto;
      transform:translateY(-6px);
      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid var(--border);
      background:#203246;
      color:#fff;
      font-size:25px;
      line-height:1;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
    }
    body.sheet-open{overflow:hidden;touch-action:none}
    .toast{position:fixed;left:16px;right:16px;bottom:92px;background:#172332;border:1px solid var(--border);padding:13px 14px;border-radius:14px;display:none;z-index:100;box-shadow:var(--shadow)}
    .toast.show{display:block}
    .splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .logo{width:82px;height:82px;border-radius:22px;background:var(--surface-2);border:2px solid var(--border);display:grid;place-items:center;font-size:36px}
    .progress{width:210px;height:6px;background:var(--surface);border-radius:99px;overflow:hidden}
    .progress>i{display:block;height:100%;width:0;background:var(--primary);animation:load 1s ease forwards}
    @keyframes load{to{width:100%}}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 10px}
    .section-title h2{font-size:16px;margin:0}
    .note{font-size:12px;line-height:1.45;color:var(--muted)}
    .hidden{display:none!important}
  
  .original-daily-load{max-width:480px;margin:0 auto;padding-bottom:24px}
  .original-title{font-size:18px;color:#6fb1ff;margin:0 0 4px;font-weight:700}
  .original-subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .original-section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .original-section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px;padding:10px 14px;border-radius:10px 10px 0 0}
  .original-client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .original-client-row:last-child{border-bottom:none}
  .original-client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .original-client-fields{display:flex;gap:6px}
  .original-field-group{flex:1;min-width:0}
  .original-field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .original-field-group input,.original-field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px;min-height:38px}
  .original-field-group select{font-size:11px;padding:7px 2px}
  .original-balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .original-balance-label{flex:1.4;font-size:13px;color:#ddd}
  .original-balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .original-hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .original-total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}
  .original-result{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .original-copy-btn{background:#1F7A1F!important;margin-top:8px}
  .original-alert{display:none}


  .carga-diaria-original{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0f1115;
    color:#e8e8e8;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .carga-diaria-original *{box-sizing:border-box}
  .carga-diaria-original h1{font-size:18px;color:#6fb1ff;margin:0 0 4px 0}
  .carga-diaria-original .subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .carga-diaria-original .section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .carga-diaria-original .section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px -14px;padding:10px 14px;border-radius:10px 10px 0 0}
  .carga-diaria-original .client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .carga-diaria-original .client-row:last-child{border-bottom:none}
  .carga-diaria-original .client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .carga-diaria-original .client-fields{display:flex;gap:6px}
  .carga-diaria-original .field-group{flex:1;min-width:0}
  .carga-diaria-original .field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .carga-diaria-original .field-group input,
  .carga-diaria-original .field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px}
  .carga-diaria-original .field-group select{font-size:11px;padding:7px 2px}
  .carga-diaria-original .balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .carga-diaria-original .balance-label{flex:1.4;font-size:13px;color:#ddd}
  .carga-diaria-original .balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .carga-diaria-original button{width:100%;padding:14px;border-radius:10px;border:none;background:#2E75B6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .carga-diaria-original button:active{background:#1F4E78}
  .carga-diaria-original #resultado{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .carga-diaria-original .copy-btn{background:#1F7A1F;margin-top:8px}
  .carga-diaria-original .copy-btn:active{background:#155c15}
  .carga-diaria-original .alerta-monto{margin-top:12px;background:#3a1a1a;border:1px solid #c00;border-radius:8px;padding:10px 12px;font-size:12px;color:#ff8080;display:none}
  .carga-diaria-original .alerta-monto strong{color:#ff4444;display:block;margin-bottom:4px}
  .carga-diaria-original input.campo-alerta{border-color:#c00!important;background:#1a0a0a!important}
  .carga-diaria-original .hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .carga-diaria-original .total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}


.client-load-row{border-bottom:1px solid #2A3541;padding:10px 0}
.client-load-row summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font-size:16px}
.client-load-row summary small{display:block;color:#8F9BAB;font-weight:500;margin-top:3px}
.client-load-row[open] summary{margin-bottom:10px}


.close-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.close-flow{margin-top:14px}
.close-flow-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.14)}
.close-flow-row:last-child{border-bottom:0}
.close-flow-row strong{font-variant-numeric:tabular-nums;text-align:right}
.close-flow-row.net{margin-top:4px;padding-top:14px;font-size:17px}
.close-flow-row.net strong{font-size:20px}
.reconciliation-status{border-radius:14px;padding:14px 16px;margin-bottom:14px}
.reconciliation-status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.38)}
.reconciliation-status.error{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.42)}
.reconciliation-status-title{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.reconciliation-status-detail{margin-top:8px}
@media(max-width:390px){
  .close-summary{grid-template-columns:1fr}
}


/* =========================================================
   CML VIRTUAL v1.44 — PULIDO VISUAL PROFESIONAL
   Solo presentación. No modifica lógica ni almacenamiento.
   ========================================================= */
:root{
  --bg:#0B141D;
  --surface:#132130;
  --surface-2:#1A2B3D;
  --surface-3:#203448;
  --border:#2B4157;
  --border-soft:rgba(148,163,184,.13);
  --text:#F5F7FA;
  --muted:#9AA9BA;
  --primary:#3984F6;
  --primary-2:#2569D8;
  --success:#20C567;
  --warning:#F1A928;
  --danger:#EF5350;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 8px 22px rgba(0,0,0,.18);
  --shadow-sheet:0 -18px 42px rgba(0,0,0,.38);
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.42;
  text-rendering:optimizeLegibility;
}

body{
  letter-spacing:-.005em;
}

.header{
  min-height:68px;
  padding:calc(11px + env(safe-area-inset-top)) 18px 11px;
  background:rgba(11,20,29,.96);
  border-bottom:1px solid rgba(107,139,171,.24);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.header h1{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.025em;
}

.header .date{
  font-size:12px;
  line-height:1.25;
}

main{
  padding:18px 16px 34px;
  scroll-padding-bottom:110px;
}

.card{
  background:var(--surface);
  border:1px solid rgba(92,126,159,.42);
  border-radius:var(--radius);
  padding:17px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card + .card{margin-top:2px}
.card h2{font-size:21px;line-height:1.18;letter-spacing:-.025em}
.card h3{font-size:18px;line-height:1.22;letter-spacing:-.015em}

.eyebrow{
  color:#91A5BA;
  font-size:11px;
  letter-spacing:.105em;
  line-height:1.2;
}

.note{
  font-size:13px;
  line-height:1.48;
}

.section-title{
  margin:20px 3px 10px;
  align-items:center;
}

.section-title h2{
  font-size:17px;
  letter-spacing:-.015em;
}

.grid2{
  gap:11px;
}

.stat{
  min-height:104px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:var(--surface-2);
  border:1px solid rgba(96,131,166,.36);
  border-radius:14px;
}

.stat .muted,.stat>span{
  font-size:14px;
  line-height:1.25;
}

.stat b{
  font-size:22px;
  line-height:1.15;
  letter-spacing:-.02em;
  margin-top:7px;
  font-variant-numeric:tabular-nums;
}

.btn{
  min-height:52px;
  border-radius:13px;
  padding:13px 17px;
  font-size:15px;
  letter-spacing:.005em;
  box-shadow:none;
  transition:transform .12s ease,filter .12s ease,background .12s ease;
}

.btn:active{
  transform:scale(.985);
  filter:brightness(.94);
}

.btn.secondary{
  background:var(--surface-2);
  border:1px solid rgba(96,131,166,.48);
}

.btn.small{
  min-height:42px;
  padding:9px 13px;
  font-size:13px;
}

.btn.success{
  color:#052713;
  background:var(--success);
}

.actions{
  gap:9px;
}

.input,
input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea{
  min-height:50px;
  border-radius:13px;
  border-color:rgba(96,131,166,.54);
  background:#0D1924;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}

.input:focus,
input:focus,
select:focus,
textarea:focus{
  border-color:#5595F7;
  box-shadow:0 0 0 3px rgba(59,130,246,.14);
  outline:none;
}

.field{
  margin:15px 0;
}

.field label{
  font-size:13px;
  color:#A7B5C5;
  margin-bottom:7px;
}

.toolbar{
  gap:12px;
}

.client-row{
  padding:16px 0;
  gap:14px;
  border-bottom-color:var(--border-soft);
}

.client-name{
  font-size:16px;
  line-height:1.25;
  letter-spacing:-.01em;
}

.money{
  font-size:18px;
  letter-spacing:-.012em;
}

.badge{
  padding:6px 9px;
  font-size:10px;
  letter-spacing:.025em;
}

.steps{
  gap:8px;
  margin-bottom:16px;
}

.step{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 7px;
  border-radius:13px;
  font-size:11px;
  line-height:1.3;
  background:var(--surface);
  border-color:rgba(96,131,166,.43);
}

.step.active{
  background:linear-gradient(180deg,#2F6FE5,#265CC8);
  border-color:#4D91FF;
  box-shadow:0 7px 18px rgba(37,99,235,.22);
}

.tabbar{
  min-height:82px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(12,22,31,.98);
  border-top:1px solid rgba(104,137,168,.28);
  box-shadow:0 -10px 28px rgba(0,0,0,.2);
  gap:7px;
}

.tab{
  min-height:62px;
  padding:7px 3px;
  border-radius:14px;
  font-size:11px;
  transition:background .14s ease,color .14s ease;
}

.tab span{
  font-size:22px;
  margin-bottom:2px;
}

.tab.active{
  background:var(--surface-2);
  color:#FFF;
  box-shadow:inset 0 0 0 1px rgba(102,139,174,.22);
}

.sheet-backdrop{
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(2px);
}

.sheet{
  height:min(91dvh,91vh);
  max-height:min(91dvh,91vh);
  padding:18px 17px calc(30px + env(safe-area-inset-bottom));
  border-radius:25px 25px 0 0;
  background:#101E2B;
  border-color:rgba(94,130,165,.52);
  box-shadow:var(--shadow-sheet);
}

.sheet-handle{
  width:46px;
  background:#50667D;
  margin-bottom:18px;
}

.sheet-close button{
  width:44px;
  height:44px;
  background:#20364B;
  border-color:rgba(104,141,177,.5);
}

.toast{
  left:14px;
  right:14px;
  bottom:96px;
  padding:14px 16px;
  border-radius:13px;
  background:#182A3A;
}

.divider{
  border-color:var(--border-soft)!important;
}

/* Carga diaria: integra la sección histórica con el diseño actual */
.carga-diaria-original{
  max-width:560px;
  background:transparent;
  color:var(--text);
  font-family:inherit;
}

.carga-diaria-original h1{
  color:#73AEFF;
  font-size:21px;
  letter-spacing:-.02em;
  margin-bottom:3px;
}

.carga-diaria-original .subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.carga-diaria-original .section{
  background:var(--surface);
  border:1px solid rgba(92,126,159,.42);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.carga-diaria-original .section-title{
  margin:-16px -16px 14px;
  padding:12px 16px;
  border-radius:15px 15px 0 0;
  background:#235A89;
  color:#FFF;
  font-size:14px;
  letter-spacing:.015em;
}

.carga-diaria-original .balance-row{
  gap:12px;
  margin-bottom:11px;
}

.carga-diaria-original .balance-label{
  color:#C9D2DD;

<script>
function roundCurrency(value){
  const number=Number(value||0);
  return Number.isFinite(number)?Math.round((number+Number.EPSILON)*100)/100:0;
}
function fmt(n){
  if(n===null||n===undefined||n===''||isNaN(n))return '0';
  return new Intl.NumberFormat('es-AR',{
    minimumFractionDigits:0,
    maximumFractionDigits:2
  }).format(roundCurrency(n));
}

const DB_NAME='cml_virtual_db', DB_VERSION=6;
const CAPITAL_FIJO=200000;
const DEFAULT_CLIENTS=[
  'Leandro Sarmiento','Trilu San Miguel','Polonia15','Yakel','Yakel2',
  'Kiosco Naty','Fab Four','Leandro Saavedra','Marta','Lucía Martín'
].map((name,i)=>({id:'c'+(i+1),name,active:true,order:i+1,balance:0}));

const state={tab:'today',db:null,clients:[],day:null,history:[],loans:[],audit:[],expenses:[],reconciliations:[],imports:[],importDraft:null,accreditationDraft:null,clientFilter:'active',routeFilter:'pending',routeSearch:'',paymentLock:false,lastPaymentAction:null,closingDraft:null,pendingRecovery:null,storageInfo:null,snapshotTimer:null,selfTestResult:null,repairPreview:null,auditSearch:'',auditCategory:'all',auditPeriod:'30',incidentFilter:'all',statementFrom:'',statementTo:'',followUpFilter:'due',reportFrom:'',reportTo:'',settings:{capital:200000,pinAdvance:0,bankDiscountDefault:0,whatsappTemplate:'Buen día el total es {monto}'}};

const money=n=>new Intl.NumberFormat('es-AR',{
  style:'currency',
  currency:'ARS',
  minimumFractionDigits:0,
  maximumFractionDigits:2
}).format(roundCurrency(n));
const dateKey=(d=new Date())=>d.toISOString().slice(0,10);
const niceDate=d=>new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'2-digit',month:'short'}).format(d);

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('clients')) db.createObjectStore('clients',{keyPath:'id'});
      if(!db.objectStoreNames.contains('days')) db.createObjectStore('days',{keyPath:'date'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('loans')) db.createObjectStore('loans',{keyPath:'id'});
      if(!db.objectStoreNames.contains('audit')) db.createObjectStore('audit',{keyPath:'id'});
      if(!db.objectStoreNames.contains('expenses')) db.createObjectStore('expenses',{keyPath:'id'});
      if(!db.objectStoreNames.contains('reconciliations')) db.createObjectStore('reconciliations',{keyPath:'dayDate'});
      if(!db.objectStoreNames.contains('imports')) db.createObjectStore('imports',{keyPath:'id'});
    };
    req.onsuccess=()=>{
      const db=req.result;
      const requiredStores=['clients','days','settings','loans','audit','expenses','reconciliations','imports'];
      const missing=requiredStores.filter(name=>!db.objectStoreNames.contains(name));
      if(missing.length){
        db.close();
        reject(new Error('La base local quedó desactualizada. Cerrá y volvé a abrir esta versión.'));
        return;
      }
      resolve(db);
    };
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error('La actualización de la base está bloqueada por otra pestaña abierta.'));
  });
}
function tx(store,mode='readonly'){return state.db.transaction(store,mode).objectStore(store)}
function clearStore(store){
  return new Promise((resolve,reject)=>{
    const request=tx(store,'readwrite').clear();
    request.onsuccess=()=>resolve();
    request.onerror=()=>reject(request.error);
  });
}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,value){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(value);r.onsuccess=()=>{if(['clients','days','settings','loans','expenses','reconciliations'].includes(store))scheduleEmergencySnapshot('database_change');res(value)};r.onerror=()=>rej(r.error)})}
function del(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>{if(['clients','days','settings','loans','expenses','reconciliations'].includes(store))scheduleEmergencySnapshot('database_delete');res()};r.onerror=()=>rej(r.error)})}


const EMERGENCY_SNAPSHOT_PREFIX='cml_emergency_snapshot_';
const EMERGENCY_SNAPSHOT_LIMIT=3;

function emergencySnapshotKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key?.startsWith(EMERGENCY_SNAPSHOT_PREFIX))keys.push(key);
  }
  return keys.sort((a,b)=>{
    try{
      return Number(JSON.parse(localStorage.getItem(b))?.createdAt||0)-Number(JSON.parse(localStorage.getItem(a))?.createdAt||0);
    }catch{return 0}
  });
}
function readEmergencySnapshots(){
  return emergencySnapshotKeys().map(key=>{
    try{
      const data=JSON.parse(localStorage.getItem(key));
      return {...data,_key:key};
    }catch{
      return null;
    }
  }).filter(Boolean).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
}
function emergencySnapshotSummary(snapshot){
  return {
    createdAt:Number(snapshot?.createdAt||0),
    dayDate:snapshot?.day?.date||null,
    dayStatus:snapshot?.day?.status||null,
    clients:Array.isArray(snapshot?.clients)?snapshot.clients.length:0,
    expenses:Array.isArray(snapshot?.expenses)?snapshot.expenses.length:0,
    reconciliations:Array.isArray(snapshot?.reconciliations)?snapshot.reconciliations.length:0
  };
}
async function buildEmergencySnapshot(reason='automatic'){
  if(!state.db)return null;
  const [clients,days,settings,expenses,reconciliations,loans]=await Promise.all([
    getAll('clients'),getAll('days'),getAll('settings'),
    getAll('expenses'),getAll('reconciliations'),getAll('loans')
  ]);
  const currentDay=days.find(day=>day.date===dateKey())||state.day||null;
  return {
    snapshotVersion:1,
    appVersion:'1.48',
    createdAt:Date.now(),
    reason,
    clients,
    day:currentDay,
    settings,
    expenses,
    reconciliations,
    loans
  };
}
function rotateEmergencySnapshots(){
  emergencySnapshotKeys().slice(EMERGENCY_SNAPSHOT_LIMIT).forEach(key=>{
    try{localStorage.removeItem(key)}catch{}
  });
}
async function createEmergencySnapshot(reason='manual',silent=false){
  try{
    const snapshot=await buildEmergencySnapshot(reason);
    if(!snapshot)return null;
    const key=EMERGENCY_SNAPSHOT_PREFIX+snapshot.createdAt;
    localStorage.setItem(key,JSON.stringify(snapshot));
    rotateEmergencySnapshots();
    state.settings.lastEmergencySnapshotAt=snapshot.createdAt;
    if(state.db){
      const record={key:'lastEmergencySnapshotAt',value:snapshot.createdAt};
      const request=tx('settings','readwrite').put(record);
      await new Promise((resolve,reject)=>{
        request.onsuccess=resolve;
        request.onerror=()=>reject(request.error);
      });
    }
    if(!silent)toast('Copia de emergencia creada');
    return snapshot;
  }catch(error){
    console.error('Emergency snapshot error',error);
    if(!silent)toast('No se pudo crear la copia local');
    return null;
  }

function detectPendingRecovery(){

  if(!snapshotDay)return null;
  const dbUpdated=Math.max(
    Number(dbDay?.closedAt||0),
    Number(dbDay?.routeActivatedAt||0),
    Number(dbDay?.createdAt||0),
    ...Object.values(dbDay?.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(dbDay?.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  const snapshotUpdated=Math.max(
    Number(snapshot.createdAt||0),
    Number(snapshotDay.closedAt||0),
    Number(snapshotDay.routeActivatedAt||0),
    Number(snapshotDay.createdAt||0),
    ...Object.values(snapshotDay.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(snapshotDay.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  if(snapshotDay.date===dateKey()&&(!dbDay||snapshotUpdated>dbUpdated+2000)){

}
async function refreshStorageInfo(){
  const info={supported:false,persisted:null,usage:null,quota:null,percent:null};
  try{
    if(navigator.storage){
      info.supported=true;
      if(navigator.storage.persisted)info.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){
        const estimate=await navigator.storage.estimate();
        info.usage=Number(estimate.usage||0);
        info.quota=Number(estimate.quota||0);
        info.percent=info.quota?Math.round((info.usage/info.quota)*100):0;
      }
    }
  }catch(error){console.warn(error)}
  state.storageInfo=info;
  return info;
}

function validateEmergencySnapshot(snapshot){

  const ids=new Set();
  (snapshot?.clients||[]).forEach(client=>{
    if(!client?.id)errors.push('Cliente sin ID');
    else if(ids.has(client.id))errors.push(`ID duplicado: ${client.id}`);
    else ids.add(client.id);
    if(!client?.name?.trim())errors.push('Cliente sin nombre');
  });
  if(snapshot?.day&&!snapshot.day.date)errors.push('Jornada sin fecha');

function normalizeText(value=''){
  return String(value).trim().replace(/\s+/g,' ');
}
function normalizeClientKey(value=''){
  return normalizeText(value).toLocaleLowerCase('es-AR')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function parseDelimitedText(text){
  const raw=String(text||'').replace(/\r/g,'').trim();
  if(!raw)return [];
  const lines=raw.split('\n').filter(line=>line.trim());
  if(!lines.length)return [];
  const delimiter=lines.some(line=>line.includes('\t'))?'\t':lines.some(line=>line.includes(';'))?';':',';
  return lines.map(line=>{
    if(delimiter==='\t')return line.split('\t').map(normalizeText);
    const cells=[];let current='',quoted=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(quoted&&line[i+1]==='"'){current+='"';i++}
        else quoted=!quoted;
      }else if(ch===delimiter&&!quoted){
        cells.push(normalizeText(current));current='';
      }else current+=ch;
    }
    cells.push(normalizeText(current));
    return cells;
  });
}
function detectImportColumns(rows){

}

function buildImportDraft(rows,source='pegado'){

function parsePinwebAmount(value){
  const raw=String(value??'').trim();
  if(!raw)return 0;
  let cleaned=raw.replace(/\s/g,'').replace(/\$/g,'');
  const hasComma=cleaned.includes(',');
  const hasDot=cleaned.includes('.');
  if(hasComma&&hasDot){
    if(cleaned.lastIndexOf(',')>cleaned.lastIndexOf('.')){
      cleaned=cleaned.replace(/\./g,'').replace(',','.');
    }else{
      cleaned=cleaned.replace(/,/g,'');
    }
  }else if(hasComma){
    const decimals=cleaned.length-cleaned.lastIndexOf(',')-1;
    cleaned=decimals===2?cleaned.replace(/\./g,'').replace(',','.') : cleaned.replace(/,/g,'');
  }else if(hasDot){
    const decimals=cleaned.length-cleaned.lastIndexOf('.')-1;
    if(decimals!==2)cleaned=cleaned.replace(/\./g,'');
  }
  cleaned=cleaned.replace(/[^\d.-]/g,'');
  const number=Number(cleaned);
  return Number.isFinite(number)?Math.round(number):NaN;
}
function clientImportKeys(client){
  return [
    client?.name,
    client?.pinwebUser,
    ...(Array.isArray(client?.importAliases)?client.importAliases:[])
  ].map(value=>normalizeClientKey(value||'')).filter(Boolean);
}
function findClientForAccreditationImport(importedName){
  const key=normalizeClientKey(importedName);

function buildAccreditationDraft(rows,source='excel_pegado'){
  const columns=detectAccreditationColumns(rows);
  const data=columns.hasHeader?rows.slice(1):rows;
  const seen=new Set(),items=[],errors=[],unknown=[];
  data.forEach((row,index)=>{
    const line=index+(columns.hasHeader?2:1);
    const importedName=normalizeText(row[columns.name]||'');
    const rawAmount=row[columns.amount]||'';
    if(!importedName&&!normalizeText(rawAmount))return;
    if(!importedName){errors.push(`Fila ${line}: falta el nombre del cliente.`);return}
    const key=normalizeClientKey(importedName);
    if(seen.has(key)){errors.push(`Fila ${line}: cliente duplicado en el archivo (${importedName}).`);return}
    seen.add(key);
    const amount=parsePinwebAmount(rawAmount);
    if(!Number.isFinite(amount)||amount<0){errors.push(`Fila ${line}: monto inválido para ${importedName}.`);return}
    const client=findClientForAccreditationImport(importedName);
    if(!client){
      unknown.push({line,name:importedName,amount});
      return;
    }
    items.push({line,clientId:client.id,clientName:client.name,importedName,amount});
  });
  return {source,items,errors,unknown,columns,createdAt:Date.now()};
}

function clientRouteStatus(client,day=state.day){
  const remaining=clientDue(client,day);
  const routePaid=routePaymentsFor(client.id,day)
    .reduce((sum,payment)=>sum+Number(payment.amount||0),0);
  const visit=visitRecord(client.id,day);
  if(routePaid>0&&remaining<=0)return {key:'paid',label:'COMPLETADO',badge:'paid'};
  if(routePaid>0&&remaining>0)return {key:'partial',label:'PARCIAL',badge:'partial'};
  if(visit?.status==='no_payment')return {key:'visited',label:'VISITADO',badge:'partial'};
  if(visit?.status==='rescheduled')return {key:'rescheduled',label:'REPROGRAMADO',badge:'partial'};
  return {key:'pending',label:'POR GESTIONAR',badge:'pending'};
}

function moveRouteClient(clientId,direction){
  if(!state.day||state.day.status==='closed')return toast('La jornada está cerrada');
  const order=[...(state.day.routeOrder?.length?state.day.routeOrder:state.day.clientIds||[])];
  const index=order.indexOf(clientId);
  if(index<0)return;
  const next=index+direction;
  if(next<0||next>=order.length)return;
  [order[index],order[next]]=[order[next],order[index]];
  state.day.routeOrder=order;
  saveDay().then(()=>{
    auditLog('route_order_changed','Orden de ruta modificado',{clientId,direction});

function routeClients(day=state.day){
  const routeIds=new Set(day?.routeOrder||[]);
  let clients=operationalClients(day).filter(client=>routeIds.has(client.id));
  const query=routeSearchValue();
  if(query){
    clients=clients.filter(client=>[
      client.name,client.address,client.routeNote,client.phone
    ].some(value=>normalizeClientKey(value||'').includes(query)));
  }
  if(state.routeFilter==='all')return clients;
  return clients.filter(client=>{
    const status=clientRouteStatus(client,day).key;
    if(state.routeFilter==='pending')return !hasRoutePayment(client.id,day);
    if(state.routeFilter==='visited')return status==='visited'||status==='rescheduled';
    if(state.routeFilter==='paid')return hasRoutePayment(client.id,day);
    return true;
  });

function routeVisitStats(day=state.day){

  let paid=0,partial=0,visited=0,pending=0;
  clients.forEach(client=>{
    const key=clientRouteStatus(client,day).key;
    if(key==='paid')paid++;
    else if(key==='partial')partial++;
    else if(key==='visited'||key==='rescheduled')visited++;
    else pending++;
  });
  return {total:clients.length,paid,partial,visited,pending,managed:paid+partial+visited};
}

        visit,
        remaining,

        key:`${day.date}|${clientId}`

function buildRepairPreview(){
  const changes=[];
  const clients=state.clients.map(cloneData);
  const days=state.history.map(cloneData);
  const expenses=state.expenses.map(cloneData);
  const reconciliations=state.reconciliations.map(cloneData);
  const clientIds=new Set(clients.map(client=>client.id));

  days.forEach(day=>{
    let changed=false;
    if(day.openingCash===undefined||!Number.isFinite(Number(day.openingCash))||Number(day.openingCash)<0){
      day.openingCash=Number(state.settings.capital||0);
      changes.push({type:'day_opening_cash',record:day.date,detail:`Capital inicial establecido en ${money(day.openingCash)}`});changed=true;
    }
    if(typeof day.openingCashConfirmed!=='boolean'){
      day.openingCashConfirmed=day.status!=='preparation';
      changes.push({type:'day_opening_confirmation',record:day.date,detail:'Confirmación del capital normalizada'});changed=true;
    }
    if(!Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)>0){
      day.reopenHistory=[];
      changes.push({type:'reopen_history_initialized',record:day.date,detail:'Historial de reaperturas inicializado'});changed=true;
    }
    if(Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)!==day.reopenHistory.length){
      day.reopenCount=day.reopenHistory.length;
      changes.push({type:'reopen_count_repaired',record:day.date,detail:'Contador de reaperturas sincronizado'});changed=true;
    }
    if(!Array.isArray(day.clientIds)){day.clientIds=[];changes.push({type:'day_client_ids',record:day.date,detail:'Lista de clientes inicializada'});changed=true}
    const validIds=[...new Set(day.clientIds.filter(id=>clientIds.has(id)))];
    if(JSON.stringify(validIds)!==JSON.stringify(day.clientIds)){day.clientIds=validIds;changes.push({type:'day_client_ids_cleaned',record:day.date,detail:'Referencias inexistentes o duplicadas eliminadas'});changed=true}
    const originalOrder=Array.isArray(day.routeOrder)?day.routeOrder:[];
    const repairedOrder=[...new Set(originalOrder.filter(id=>day.clientIds.includes(id)))];
    day.clientIds.forEach(id=>{if(!repairedOrder.includes(id))repairedOrder.push(id)});
    if(JSON.stringify(repairedOrder)!==JSON.stringify(originalOrder)){day.routeOrder=repairedOrder;changes.push({type:'route_order_repaired',record:day.date,detail:'Orden de ruta reconstruido'});changed=true}
    day.accreditations=day.accreditations&&typeof day.accreditations==='object'?day.accreditations:{};
    day.payments=day.payments&&typeof day.payments==='object'?day.payments:{};
    day.visits=day.visits&&typeof day.visits==='object'?day.visits:{};
    Object.entries(day.payments).forEach(([clientId,payments])=>{
      if(!Array.isArray(payments)){day.payments[clientId]=[];changes.push({type:'payments_reset',record:`${day.date}/${clientId}`,detail:'Colección de pagos inválida reemplazada'});changed=true;return}
      payments.forEach((payment,index)=>{
        if(!payment.id){payment.id=`repair_${day.date}_${clientId}_${index}_${Date.now()}`;changes.push({type:'payment_id',record:`${day.date}/${clientId}`,detail:'ID de pago generado'});changed=true}
        payment.amount=Number(payment.amount||0);
        if(!['cash','transfer'].includes(payment.method)){payment.method='cash';changes.push({type:'payment_method',record:`${day.date}/${clientId}`,detail:'Medio inválido normalizado a efectivo'});changed=true}
        if(!Number(payment.createdAt)){payment.createdAt=Number(day.createdAt||Date.now());changes.push({type:'payment_date',record:`${day.date}/${clientId}`,detail:'Fecha del pago reconstruida'});changed=true}
      });
    });
    if(changed)day.repairedAt=Date.now();
  });

  expenses.forEach(expense=>{
    let changed=false;
    if(!['cash','transfer'].includes(expense.method)){expense.method='cash';changes.push({type:'expense_method',record:expense.id,detail:'Gasto normalizado como efectivo'});changed=true}
    if(!Number(expense.createdAt)){expense.createdAt=Date.now();changes.push({type:'expense_date',record:expense.id,detail:'Fecha de creación agregada'});changed=true}
    if(changed)expense.repairedAt=Date.now();
  });

  reconciliations.forEach(rec=>{
    let changed=false;
    const day=days.find(item=>item.date===rec.dayDate);
    if(day){
      const totals=calcDay(day);
      if(rec.openingCash===undefined){rec.openingCash=totals.openingCash;changes.push({type:'reconciliation_opening_cash',record:rec.dayDate,detail:'Capital inicial agregado'});changed=true}
      if(rec.expectedCash===undefined||!Number.isFinite(Number(rec.expectedCash))){rec.expectedCash=totals.expectedCash;changes.push({type:'reconciliation_expected_cash',record:rec.dayDate,detail:'Caja esperada recalculada'});changed=true}
      if(rec.expectedTransfer===undefined||!Number.isFinite(Number(rec.expectedTransfer))){rec.expectedTransfer=totals.expectedTransfer;changes.push({type:'reconciliation_expected_transfer',record:rec.dayDate,detail:'Transferencia esperada recalculada'});changed=true}
      rec.cashDifference=Number(rec.countedCash||0)-Number(rec.expectedCash||0);
      rec.transferDifference=Number(rec.verifiedTransfer||0)-Number(rec.expectedTransfer||0);
    }
    if(changed)rec.repairedAt=Date.now();
  });
  return {createdAt:Date.now(),changes,datasets:{clients,days,expenses,reconciliations}};
}
async function applyRepairPreview(){
  const preview=state.repairPreview;
  if(!preview||!preview.changes.length)return toast('No hay reparaciones pendientes');
  if(!confirm(`Se aplicarán ${preview.changes.length} correcciones. Antes se creará una copia de emergencia. ¿Continuar?`))return;
  await createEmergencySnapshot('before_data_repair',true);
  try{
    for(const client of preview.datasets.clients)await put('clients',client);
    for(const day of preview.datasets.days)await put('days',day);
    for(const expense of preview.datasets.expenses)await put('expenses',expense);
    for(const reconciliation of preview.datasets.reconciliations)await put('reconciliations',reconciliation);
    await auditLog('data_repair_applied','Reparación segura aplicada',{changes:preview.changes.length,types:[...new Set(preview.changes.map(change=>change.type))]});
    state.repairPreview=null;
    location.reload();
  }catch(error){console.error(error);toast('No se pudo completar la reparación')}
}

function integrityReport(){
  const issues=[];
  const warnings=[];
  const info=[];
  const clientIds=new Set(state.clients.map(c=>c.id));
  const normalizedNames=new Map();

  state.clients.forEach(client=>{
    const key=normalizeClientKey(client.name);
    if(!client.id)issues.push({type:'client_missing_id',label:`Cliente sin identificador: ${client.name||'Sin nombre'}`});
    if(!client.name?.trim())issues.push({type:'client_missing_name',label:`Cliente ${client.id||'sin ID'} sin nombre`});
    if(Number(client.balance||0)<0)issues.push({type:'client_negative_balance',label:`Saldo negativo en ${client.name}`});
    if(!Number.isFinite(Number(client.order)))warnings.push({type:'client_invalid_order',label:`Orden inválido en ${client.name}`});
    if(key){
      if(normalizedNames.has(key))issues.push({type:'duplicate_client_name',label:`Nombre duplicado: ${client.name}`});
      else normalizedNames.set(key,client.id);
    }
  });

  const dayDates=new Set();
  state.history.forEach(day=>{
    if(!day.date)issues.push({type:'day_missing_date',label:'Jornada sin fecha'});
    if(dayDates.has(day.date))issues.push({type:'duplicate_day',label:`Jornada duplicada: ${day.date}`});
    dayDates.add(day.date);
    if(!['preparation','active','closed'].includes(day.status))issues.push({type:'invalid_day_status',label:`Estado inválido en jornada ${day.date||'sin fecha'}`});
    if(day.openingCash!==undefined&&(Number(day.openingCash)<0||!Number.isFinite(Number(day.openingCash))))issues.push({type:'invalid_opening_cash',label:`Capital inicial inválido en jornada ${day.date}`});
    if(day.openingCash===undefined)info.push({type:'legacy_opening_cash',label:`Jornada anterior usa capital configurado: ${day.date}`});
    if(day.status==='closed'&&!day.closedAt)issues.push({type:'closed_day_missing_timestamp',label:`Jornada cerrada sin fecha de cierre: ${day.date}`});
    if(day.status==='closed'&&!day.preCloseBalances)warnings.push({type:'legacy_close_without_balance_snapshot',label:`Cierre anterior sin copia de saldos: ${day.date}`});
    if(day.status!=='closed'&&day.reconciliation)warnings.push({type:'active_day_with_reconciliation',label:`Jornada activa conserva conciliación: ${day.date}`});
    if(Number(day.reopenCount||0)!==(Array.isArray(day.reopenHistory)?day.reopenHistory.length:0))warnings.push({type:'reopen_history_mismatch',label:`Historial de reaperturas inconsistente: ${day.date}`});
    if(Number(day.reopenCount||0)>3)issues.push({type:'reopen_limit_exceeded',label:`Límite de reaperturas excedido: ${day.date}`});
    if(day.status!=='closed'&&day.date<dateKey())warnings.push({type:'old_open_day',label:`Jornada anterior sin cerrar: ${day.date}`});
    (day.clientIds||[]).forEach(id=>{
      if(!clientIds.has(id))issues.push({type:'orphan_day_client',label:`Jornada ${day.date}: cliente inexistente ${id}`});
    });
    (day.routeOrder||[]).forEach(id=>{
      if(!(day.clientIds||[]).includes(id))warnings.push({type:'route_order_outside_day',label:`Orden de ruta inconsistente en ${day.date}: ${id}`});
    });
    Object.entries(day.accreditations||{}).forEach(([id,value])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_accreditation',label:`Acreditación huérfana en ${day.date}: ${id}`});
      if(Number(value)<0||!Number.isFinite(Number(value)))issues.push({type:'invalid_accreditation',label:`Acreditación inválida en ${day.date}`});
    });
    Object.entries(day.payments||{}).forEach(([id,payments])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_payment_client',label:`Pago asociado a cliente inexistente en ${day.date}: ${id}`});
      if(!Array.isArray(payments))issues.push({type:'invalid_payment_collection',label:`Pagos inválidos en ${day.date}: ${id}`});
      else {
        const seenPayments=new Set();
        payments.forEach(payment=>{
        if(!payment.id)issues.push({type:'payment_missing_id',label:`Pago sin identificador en ${day.date}: ${id}`});
        if(Number(payment.amount)<=0||!Number.isFinite(Number(payment.amount)))issues.push({type:'invalid_payment',label:`Pago inválido en ${day.date}: ${id}`});
        if(!['cash','transfer'].includes(payment.method))warnings.push({type:'unknown_payment_method',label:`Medio de pago no reconocido en ${day.date}: ${payment.method||'vacío'}`});
        if(day.closedAt&&Number(payment.createdAt||0)>Number(day.closedAt))warnings.push({type:'payment_after_close',label:`Pago posterior al cierre en ${day.date}: ${id}`});
        const duplicateKey=`${Number(payment.amount||0)}|${payment.method}|${Math.floor(Number(payment.createdAt||0)/8000)}`;
        if(seenPayments.has(duplicateKey))warnings.push({type:'possible_duplicate_payment',label:`Posible pago duplicado en ${day.date}: ${id}`});
        seenPayments.add(duplicateKey);
      });
      }
    });
  });

  state.expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!Number.isFinite(Number(expense.amount)))issues.push({type:'invalid_expense',label:`Gasto inválido: ${expense.detail||expense.id}`});
    if(expense.method&&!['cash','transfer'].includes(expense.method))issues.push({type:'invalid_expense_method',label:`Forma de pago inválida en gasto: ${expense.id}`});
    if(!expense.method)info.push({type:'legacy_expense_method',label:`Gasto anterior tratado como efectivo: ${expense.id}`});
    if(expense.dayDate&&!dayDates.has(expense.dayDate))warnings.push({type:'orphan_expense_day',label:`Gasto sin jornada relacionada: ${expense.dayDate}`});
  });

  [...state.history,state.day].filter(Boolean).forEach(day=>{
    if(day.status!=='closed'&&day.status!=='active'&&day.status!=='preparation')return;
    if(day.status!=='preparation'&&!dailyDataReady(day)){
      issues.push({type:'active_day_without_daily_load',label:`Jornada sin carga diaria confirmada: ${day.date}`});
    }
  });
  state.history.filter(day=>day.status==='closed').forEach(day=>{
    if(!day.preCloseBalances||typeof day.preCloseBalances!=='object'){
      warnings.push({type:'missing_preclose_balances',label:`Jornada cerrada sin saldos iniciales históricos: ${day.date}`});
    }
    Object.entries(day.preCloseBalances||{}).forEach(([clientId,value])=>{
      if(!Number.isFinite(Number(value))||Number(value)<0){
        issues.push({type:'invalid_preclose_balance',label:`Saldo inicial histórico inválido: ${day.date} · ${clientId}`});
      }
    });
  });
  state.audit.forEach(entry=>{
    if(!entry.id)issues.push({type:'audit_missing_id',label:'Evento de auditoría sin identificador'});
    if(!entry.action)issues.push({type:'audit_missing_action',label:`Evento de auditoría sin acción: ${entry.id||'sin ID'}`});
    if(!Number(entry.createdAt))warnings.push({type:'audit_missing_date',label:`Evento de auditoría sin fecha: ${entry.id||entry.action||'desconocido'}`});
  });
  state.reconciliations.forEach(rec=>{
    if(rec.dayDate&&!dayDates.has(rec.dayDate))warnings.push({type:'orphan_reconciliation',label:`Conciliación sin jornada: ${rec.dayDate}`});
    if(Number(rec.countedCash)<0||Number(rec.verifiedTransfer)<0)issues.push({type:'invalid_reconciliation_amount',label:`Conciliación con valores negativos: ${rec.dayDate}`});
    if(Number(rec.cashDifference)!==Number(rec.countedCash)-Number(rec.expectedCash))warnings.push({type:'reconciliation_cash_mismatch',label:`Diferencia de efectivo inconsistente: ${rec.dayDate}`});
    if(Number(rec.transferDifference)!==Number(rec.verifiedTransfer)-Number(rec.expectedTransfer))warnings.push({type:'reconciliation_transfer_mismatch',label:`Diferencia de transferencias inconsistente: ${rec.dayDate}`});
  });

  state.loans.forEach(loan=>{
    if(Number(loan.remaining)<0)issues.push({type:'negative_loan_remaining',label:`Préstamo con saldo negativo: ${loan.person||loan.id}`});
    if(Number(loan.amount||0)<0)issues.push({type:'negative_loan_amount',label:`Préstamo con monto negativo: ${loan.person||loan.id}`});
  });

  const lastBackupAt=Number(state.settings.lastBackupAt||0);
  const backupAge=daysSince(lastBackupAt);
  if(!lastBackupAt)warnings.push({type:'never_backed_up',label:'Todavía no se registró ningún backup'});
  else if(backupAge>=7)warnings.push({type:'stale_backup',label:`Último backup hace ${backupAge} días`});
  else info.push({type:'backup_ok',label:`Último backup hace ${backupAge} día(s)`});
  const localSnapshots=readEmergencySnapshots();
  if(!localSnapshots.length)warnings.push({type:'no_emergency_snapshot',label:'No hay copias locales de emergencia'});
  else info.push({type:'emergency_snapshots',label:`${localSnapshots.length} copia(s) local(es) de emergencia`});
  if(state.storageInfo?.persisted===false)warnings.push({type:'storage_not_persistent',label:'El navegador no confirmó almacenamiento persistente'});
  if(state.storageInfo?.persisted===true)info.push({type:'storage_persistent',label:'Almacenamiento persistente confirmado'});

  const closedDays=state.history.filter(d=>d.status==='closed').length;
  info.push({type:'counts',label:`${state.clients.length} clientes · ${state.history.length} jornadas · ${closedDays} cerradas`});

  return {
    issues,
    warnings,
    info,
    score:Math.max(0,100-(issues.length*18)-(warnings.length*2)),
    checkedAt:Date.now()
  };
}

function validateBackupStructure(data){
  const errors=[];
  if(!data||typeof data!=='object')errors.push('El archivo no contiene un objeto válido.');
  if(!Array.isArray(data?.clients))errors.push('Falta la lista de clientes.');
  if(!Array.isArray(data?.days))errors.push('Falta la lista de jornadas.');
  const ids=new Set();
  (data?.clients||[]).forEach((client,index)=>{
    if(!client?.id)errors.push(`Cliente ${index+1} sin identificador.`);
    else if(ids.has(client.id))errors.push(`Identificador de cliente duplicado: ${client.id}.`);
    else ids.add(client.id);
    if(!client?.name?.trim())errors.push(`Cliente ${index+1} sin nombre.`);
    if(Number(client?.balance||0)<0)errors.push(`Saldo negativo en ${client?.name||'cliente '+(index+1)}.`);
  });
  const dates=new Set();
  (data?.days||[]).forEach((day,index)=>{
    if(!day?.date)errors.push(`Jornada ${index+1} sin fecha.`);
    else if(dates.has(day.date))errors.push(`Jornada duplicada: ${day.date}.`);
    else dates.add(day.date);
    if(day?.status&&!['preparation','active','closed'].includes(day.status))errors.push(`Estado inválido en jornada ${day.date||index+1}.`);
  });
  return errors;
}

function reportData(){
  const days=daysInReportRange();
  const byClient=new Map();
  let accredited=0,collected=0,cash=0,transfer=0,expenses=0,loanPayments=0,pending=0,managed=0,visitsWithoutPayment=0;
  days.forEach(day=>{
    const totals=calcDay(day);
    accredited+=totals.accredited;
    collected+=totals.paid;
    cash+=totals.cash;
    transfer+=totals.transfer;
    expenses+=totals.expenses;
    loanPayments+=totals.loanPayments;
    pending+=totals.pending;
    const stats=routeVisitStats(day);
    managed+=stats.managed;
    visitsWithoutPayment+=stats.visited;
    operationalClients(day).forEach(client=>{
      const payments=day.payments?.[client.id]||[];
      const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
      const acc=Number(day.accreditations?.[client.id]||0);
      const current=byClient.get(client.id)||{
        clientId:client.id,name:client.name,collected:0,accredited:0,
        visits:0,payments:0,cash:0,transfer:0
      };
      current.collected+=paid;
      current.accredited+=acc;
      current.visits+=1;
      current.payments+=payments.length;
      current.cash+=payments.filter(p=>p.method==='cash').reduce((s,p)=>s+Number(p.amount||0),0);
      current.transfer+=payments.filter(p=>p.method==='transfer').reduce((s,p)=>s+Number(p.amount||0),0);
      byClient.set(client.id,current);
    });
  });
  const clients=[...byClient.values()].sort((a,b)=>b.collected-a.collected||a.name.localeCompare(b.name,'es'));
  const average=days.length?Math.round(collected/days.length):0;
  const effectiveness=(collected+pending)>0?Math.round((collected/(collected+pending))*100):0;
  return {
    days,clients,accredited,collected,cash,transfer,expenses,loanPayments,
    net:collected-expenses-loanPayments,
    pending,average,effectiveness,managed,visitsWithoutPayment
  };
}

function parseMoneyInput(value){
  let text=String(value??'').trim().replace(/\s/g,'').replace(/\$/g,'');
  if(!text)return 0;

  const negative=text.startsWith('-');
  text=text.replace(/-/g,'').replace(/[^\d.,]/g,'');

  const lastComma=text.lastIndexOf(',');
  const lastDot=text.lastIndexOf('.');
  let normalized=text;

  if(lastComma>=0&&lastDot>=0){
    const decimalSeparator=lastComma>lastDot?',':'.';
    const thousandsSeparator=decimalSeparator===','?'.':',';
    normalized=text.split(thousandsSeparator).join('');
    normalized=normalized.replace(decimalSeparator,'.');
  }else if(lastComma>=0){
    const decimals=text.length-lastComma-1;
    normalized=decimals>0&&decimals<=2
      ?text.replace(/\./g,'').replace(',','.')
      :text.replace(/,/g,'');
  }else if(lastDot>=0){
    const decimals=text.length-lastDot-1;
    const dotCount=(text.match(/\./g)||[]).length;
    normalized=dotCount===1&&decimals>0&&decimals<=2
      ?text
      :text.replace(/\./g,'');
  }

  const number=Number((negative?'-':'')+normalized);
  return Number.isFinite(number)?roundCurrency(number):0;
}

async function clearLegacyTestDebt(){
  if(state.settings.testDebtCleanupV124)return false;

  const totalDebt=state.clients.reduce((sum,client)=>sum+Number(client.balance||0),0);
  const latestClosed=state.history.find(day=>day.status==='closed')||null;
  const latestPending=Number(latestClosed?.summary?.pending||0);

  // Caso exacto detectado en las pruebas: quedó $120.000 en clientes,
  // aunque el último cierre informa pendiente $0.
  if(totalDebt===120000&&latestClosed&&latestPending===0){
    for(const client of state.clients){
      if(Number(client.balance||0)===0)continue;
      client.balance=0;
      client.updatedAt=Date.now();
      await put('clients',client);
    }
    state.settings.testDebtCleanupV124=true;
    await put('settings',{key:'testDebtCleanupV124',value:true});
    await auditLog('test_debt_cleared','Saldo residual de pruebas eliminado',{
      previousTotalDebt:totalDebt,
      latestClosedDate:latestClosed.date,
      latestPending
    });
    await createEmergencySnapshot('test_debt_cleanup_v124',true);
    return true;
  }

  state.settings.testDebtCleanupV124=true;
  await put('settings',{key:'testDebtCleanupV124',value:true});
  return false;
}

    auditLog('render_error','Error de renderizado',{tab:state.tab,message:error?.message||String(error)}).catch(console.error);

function recoverNavigation(){
  state.tab='today';
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='today'));

}


function localDateFromKey(value){
  const [year,month,day]=String(value||dateKey()).split('-').map(Number);
  return new Date(year,month-1,day,12,0,0);
}
function weekdayScheduleKey(dayDate=state.day?.date||dateKey()){
  return ['sun','mon','tue','wed','thu','fri','sat'][localDateFromKey(dayDate).getDay()];
}
function weekdayScheduleLabel(key=weekdayScheduleKey()){
  return {sun:'domingo',mon:'lunes',tue:'martes',wed:'miércoles',thu:'jueves',fri:'viernes',sat:'sábado'}[key]||key;
}
function configuredRouteForDate(dayDate=state.day?.date||dateKey()){
  const key=weekdayScheduleKey(dayDate);
  const configured=state.settings.routeSchedules?.[key];
  if(!Array.isArray(configured))return [];
  const validIds=new Set(state.clients.filter(client=>client.active!==false).map(client=>client.id));
  return configured.filter(id=>validIds.has(id));
}
function shouldShowFridayPinReminder(dayDate=state.day?.date||dateKey()){
  return weekdayScheduleKey(dayDate)==='fri'&&state.settings.pinFridayReminderDismissedDate!==dayDate;
}
async function dismissFridayPinReminder(){
  const dayDate=state.day?.date||dateKey();
  state.settings.pinFridayReminderDismissedDate=dayDate;
  await put('settings',{key:'pinFridayReminderDismissedDate',value:dayDate});
  await auditLog('pin_friday_reminder_dismissed','Recordatorio de PINWEB descartado',{dayDate});
  render();
}
function routeScheduleBanner(day=state.day){
  if(!day)return '';
  const key=weekdayScheduleKey(day.date);
  const label=weekdayScheduleLabel(key);
  const ids=configuredRouteForDate(day.date);
  if(!ids.length){
    return `<div class="card">
      <div class="toolbar">
        <div>
          <div class="eyebrow">RUTA SUGERIDA · ${label.toUpperCase()}</div>
          <div class="client-name">Todavía no configurada</div>
        </div>

      </div>
      <p class="note">Podés guardar qué clientes visitás habitualmente los ${label}. La sugerencia nunca bloquea ni impide registrar otros pagos.</p>
      <button class="btn secondary" onclick="configureRouteSchedule('${key}')">CONFIGURAR RUTA DE ${label.toUpperCase()}</button>
    </div>`;
  }
  const names=ids.map(id=>state.clients.find(client=>client.id===id)?.name).filter(Boolean);
  return `<div class="card">
    <div class="toolbar">
      <div>
        <div class="eyebrow">RUTA SUGERIDA · ${label.toUpperCase()}</div>
        <div class="client-name">${names.length} cliente(s) configurados</div>

      <button class="btn secondary" onclick="configureRouteSchedule('${key}')">EDITAR</button>
    </div>
  </div>`;
}
function fridayPinReminderBanner(day=state.day){
  if(!day||!shouldShowFridayPinReminder(day.date))return '';
  return `<div class="card">
    <div class="toolbar">
      <div>
        <div class="eyebrow">RECORDATORIO DE VIERNES</div>

      <button class="btn secondary" onclick="dismissFridayPinReminder()">DESCARTAR HOY</button>

function configureRouteSchedule(key=weekdayScheduleKey()){
  const label=weekdayScheduleLabel(key);
  const selected=new Set(state.settings.routeSchedules?.[key]||[]);
  const clients=state.clients.filter(client=>client.active!==false)
    .sort((a,b)=>Number(a.order||999)-Number(b.order||999)||a.name.localeCompare(b.name,'es'));
  openSheet(`<div class="sheet-handle"></div>
    <div class="eyebrow">CRONOGRAMA HABITUAL</div>
    <h2>Ruta de ${label}</h2>
    <p class="note">Marcá los clientes que normalmente visitás. Es una sugerencia editable, no una restricción.</p>
    <div class="card">
      ${clients.map(client=>`<label class="client-row">
        <span>
          <b>${escapeHtml(client.name)}</b>
          ${client.pinwebUser?`<div class="note">Usuario PINWEB: ${escapeHtml(client.pinwebUser)}</div>`:''}
        </span>
        <input type="checkbox" class="route-schedule-client" value="${client.id}" ${selected.has(client.id)?'checked':''}>
      </label>`).join('')}
    </div>
    <button class="btn" onclick="saveRouteSchedule('${key}')">GUARDAR RUTA DE ${label.toUpperCase()}</button>
    <button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">CANCELAR</button>`);
}
async function saveRouteSchedule(key){
  const ids=[...document.querySelectorAll('.route-schedule-client:checked')].map(input=>input.value);
  state.settings.routeSchedules={...(state.settings.routeSchedules||{}),[key]:ids};
  await put('settings',{key:'routeSchedules',value:state.settings.routeSchedules});
  await auditLog('route_schedule_saved','Cronograma habitual actualizado',{
    weekday:key,clients:ids.length
  });
  closeSheet();
  render();
  toast('Ruta habitual guardada');
}
async function applyConfiguredRoute(key=weekdayScheduleKey()){
  if(!state.day||state.day.status==='closed')return toast('No hay una jornada editable');
  const ids=(state.settings.routeSchedules?.[key]||[])
    .filter(id=>state.day.clientIds?.includes(id)&&state.clients.some(client=>client.id===id&&client.active!==false));
  if(!ids.length)return toast('La ruta sugerida no tiene clientes configurados');
  state.day.routeOrder=[...ids];
  state.day.routeScheduleApplied={
    weekday:key,
    appliedAt:Date.now(),
    clientIds:[...ids]
  };
  await saveDay();
  await auditLog('route_schedule_applied','Ruta sugerida aplicada',{
    weekday:key,clients:ids.length,dayDate:state.day.date
  });
  render();
  toast(`Ruta de ${weekdayScheduleLabel(key)} aplicada`);
}

function renderToday(){
  const v=document.getElementById('view');
  const latestClosed=state.history.find(day=>day.status==='closed')||null;
  const recoveryBeforeClose=Boolean(
    state.pendingRecovery&&latestClosed?.closedAt&&
    Number(state.pendingRecovery.createdAt||0)<Number(latestClosed.closedAt||0)
  );
  const recoveryBanner=state.pendingRecovery?`<div class="card">
    <div class="toolbar">
      <div>
        <div class="eyebrow">${recoveryBeforeClose?'COPIA ANTERIOR AL CIERRE':'RECUPERACIÓN DISPONIBLE'}</div>
        <h2 style="margin:4px 0 0">${recoveryBeforeClose?'La copia disponible es anterior al último cierre':'Hay una copia local para revisar'}</h2>
      </div>
      <span class="badge ${recoveryBeforeClose?'pending':'partial'}">${recoveryBeforeClose?'ANTERIOR':'REVISAR'}</span>
    </div>
    <p class="note">${formatDateTime(state.pendingRecovery.createdAt)} · Jornada ${escapeHtml(state.pendingRecovery.day?.date||'sin fecha')}</p>
    ${recoveryBeforeClose?`<p class="danger-text"><b>Restaurarla puede volver la aplicación a un estado previo al cierre.</b></p>`:''}
    <div class="actions">
      <button class="btn small ${recoveryBeforeClose?'secondary':''}" onclick="showRecoveryCenter()">REVISAR COPIA</button>
      <button class="btn small secondary" onclick="discardPendingRecovery()">DESCARTAR AVISO</button>
    </div>
  </div>`:'';
  if(!state.day){
    const fs=followUpStats();
    v.innerHTML=`${recoveryBanner}${fs.overdue||fs.today?`<div class="card"><div class="toolbar"><div><div class="eyebrow">SEGUIMIENTOS</div><h2 style="margin:4px 0 0">${fs.overdue+fs.today} requieren atención</h2></div><span class="badge pending">${fs.overdue} vencidos</span></div><p class="note">${fs.today} programados para hoy.</p><button class="btn secondary" onclick="showFollowUps()">VER SEGUIMIENTOS</button></div>`:''}<div class="empty"><div>
      <div class="empty-icon">CML</div>
      <h2>Sin actividad hoy</h2>
      <p class="muted">Empezá cargando las acreditaciones del día para comenzar.</p>
      <button class="btn" onclick="startDay()">COMENZAR EL DÍA</button>
    </div></div>`;
    return;
  }
  const d=state.day;
  const stepIndex={preparation:0,active:1,closed:2}[d.status];
  const steps=['PREPARACIÓN','RUTA ACTIVA','CIERRE'];
  let html=`${recoveryBanner}<div class="steps">${steps.map((s,i)=>`<div class="step ${i===stepIndex?'active':''}">${i+1}<br>${s}</div>`).join('')}</div>`;
  if(d.status==='preparation') html+=renderPreparation(d);
  if(d.status==='active') html+=renderRoute(d);
  if(d.status==='closed') html+=renderClosed(d);
  v.innerHTML=html;
}

async function saveVisitAction(clientId){
  ensureDayCollections(state.day);
  if(state.day.status!=='active')return toast('La ruta no está activa');
  const status=document.getElementById('visitStatus').value;
  const reason=document.getElementById('visitReason').value;
  const followUpDate=document.getElementById('visitFollowUp').value;
  const note=document.getElementById('visitNote').value.trim();
  if(!reason)return toast('Seleccioná un motivo');
  const previous=state.day.visits[clientId]||null;
  const record={status,reason,followUpDate,note,updatedAt:Date.now(),followUpResolvedAt:null,followUpResolution:''};
  state.day.visits[clientId]=record;
  await saveDay();
  await auditLog('route_visit_saved','Gestión de visita registrada',{clientId,previous,next:record});
  closeSheet();
  render();
  toast('Gestión guardada');
}
async function clearVisitAction(clientId){
  ensureDayCollections(state.day);
  if(!state.day.visits[clientId])return;
  if(!confirm('¿Volver a marcar este cliente como no visitado?'))return;
  const previous=state.day.visits[clientId];
  delete state.day.visits[clientId];
  await saveDay();
  await auditLog('route_visit_cleared','Gestión de visita eliminada',{clientId,previous});
  closeSheet();
  render();
  toast('Cliente marcado como no visitado');
}

async function saveRescheduledFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const visit=day?.visits?.[clientId];
  const newDate=document.getElementById('followUpNewDate').value;
  const note=document.getElementById('followUpRescheduleNote').value.trim();
  if(!day||!visit)return toast('No se encontró el seguimiento');
  if(!newDate)return toast('Seleccioná una fecha');
  const previousDate=visit.followUpDate;
  visit.followUpDate=newDate;
  visit.note=note;
  visit.updatedAt=Date.now();
  visit.followUpResolvedAt=null;
  visit.followUpResolution='';
  await put('days',day);
  state.history.sort((a,b)=>b.date.localeCompare(a.date));
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_rescheduled','Seguimiento reprogramado',{clientId,dayDate,previousDate,newDate});
  showFollowUps();
  toast('Seguimiento reprogramado');

async function resolveFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const client=state.clients.find(c=>c.id===clientId);
  const visit=day?.visits?.[clientId];
  if(!day||!visit||!client)return toast('No se encontró el seguimiento');
  const resolution=prompt(`¿Cómo se resolvió el seguimiento de ${client.name}?`,'Contactado / resuelto');
  if(resolution===null)return;
  if(!resolution.trim())return toast('Ingresá una resolución');
  visit.followUpResolvedAt=Date.now();
  visit.followUpResolution=resolution.trim();
  visit.updatedAt=Date.now();
  await put('days',day);
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_resolved','Seguimiento resuelto',{clientId,dayDate,resolution:resolution.trim()});
  showFollowUps();
  toast('Seguimiento resuelto');
}

const CASH_DENOMINATIONS=[20000,10000,2000,1000,500,200,100,50,20,10];
function cashBreakdownFromDom(){

    const qty=Math.max(0,parseInt(document.getElementById(`cash_${value}`)?.value||'0',10)||0);

function operationalIncidents(day=state.day){
  if(!day)return [];
  const incidents=[];
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const importReady=accreditationImportReady(day);

  if(!importReady){
    incidents.push({
      id:'missing_import',severity:'critical',category:'preparation',
      title:'Falta confirmar la carga diaria',
      detail:'La jornada no tiene una carga manual o importación confirmada.',
      action:'showDailyLoad()',actionLabel:'CARGAR DATOS'
    });
  }
  if(!day.openingCashConfirmed){
    incidents.push({
      id:'opening_cash_unconfirmed',severity:'warning',category:'preparation',
      title:'Capital inicial sin confirmar',
      detail:`Capital actual: ${money(dayOpeningCash(day))}.`,
      action:"state.tab='today';closeSheet();render()",actionLabel:'REVISAR'
    });
  }
  if(day.status==='active'&&day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint!==dailyLoadFingerprint(day)){
    incidents.push({
      id:'route_snapshot_changed',severity:'critical',category:'closing',
      title:'La base financiera cambió después de generar la ruta',
      detail:'Los saldos, acreditaciones o pagos previos ya no coinciden con la revisión confirmada.',
      action:'showOperationalIncidents()',actionLabel:'REVISAR'
    });
  }

  clients.forEach(client=>{
    if(!client.phone?.trim()){
      incidents.push({
        id:`phone_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin teléfono`,
        detail:'No se podrá abrir WhatsApp ni enviar un comprobante directo.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
    if(!client.address?.trim()){
      incidents.push({
        id:`address_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin dirección`,
        detail:'No se podrá abrir la ubicación desde la ruta.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
  });

  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    const client=state.clients.find(item=>item.id===clientId);
    if(!Array.isArray(payments)){
      incidents.push({
        id:`payments_collection_${clientId}`,severity:'critical',category:'data',clientId,
        title:`Pagos inválidos en ${client?.name||clientId}`,
        detail:'La colección de pagos no tiene un formato válido.',
        action:'showControlCenter()',actionLabel:'CONTROL TÉCNICO'
      });
      return;
    }
    payments.forEach((payment,index)=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        incidents.push({
          id:`payment_${clientId}_${payment.id||index}`,severity:'critical',category:'data',clientId,
          title:`Pago inconsistente en ${client?.name||clientId}`,
          detail:`Monto: ${money(payment.amount)} · Forma: ${payment.method||'sin definir'}.`,
          action:`openPayment('${clientId}')`,actionLabel:'CORREGIR'
        });
      }
    });
  });

  if(totals.cash<0||totals.transfer<0||totals.paid<0||totals.expectedCash<0||totals.expectedTransfer<0){
    incidents.push({
      id:'negative_totals',severity:'critical',category:'data',
      title:'Totales operativos inválidos',
      detail:'Se detectaron valores negativos incompatibles con el cierre.',
      action:'showControlCenter()',actionLabel:'DIAGNOSTICAR'
    });
  }

  const reconciliation=getReconciliation(day.date);
  if(reconciliation){
    const cashDifference=Number(reconciliation.cashDifference||0);
    const transferDifference=Number(reconciliation.transferDifference||0);
    if(cashDifference||transferDifference){
      incidents.push({
        id:'reconciliation_difference',severity:'warning',category:'closing',
        title:'Conciliación con diferencia',
        detail:`Efectivo: ${money(cashDifference)} · Transferencias: ${money(transferDifference)}.`,
        action:'openClosePreview()',actionLabel:'REVISAR'
      });
    }
  }

  const expenses=state.expenses.filter(expense=>expense.dayDate===day.date);
  expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!['cash','transfer'].includes(expense.method||'cash')){
      incidents.push({
        id:`expense_${expense.id}`,severity:'critical',category:'data',
        title:'Gasto operativo inconsistente',
        detail:`${expense.detail||expense.category||'Sin detalle'} · ${money(expense.amount)}.`,
        action:'showExpenses()',actionLabel:'CORREGIR'
      });
    }
  });

  return incidents;
}

function exportOperationalIncidents(){
  if(!state.day)return toast('No hay una jornada activa');

    'CML VIRTUAL - INCIDENCIAS OPERATIVAS',

    `Filtro: ${state.incidentFilter}`,
    `Cantidad: ${rows.length}`,

  ];
  if(!rows.length)lines.push('Sin incidencias para el filtro seleccionado.');

    lines.push(`${index+1}. [${incidentSeverityLabel(item.severity)}] ${item.title}`);

function closeChecklist(day=state.day){
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const unmanaged=clients.filter(c=>clientRouteStatus(c,day).key==='pending');
  const invalidPayments=[];
  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    (payments||[]).forEach(payment=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        invalidPayments.push({clientId,payment});
      }
    });
  });
  const importReady=accreditationImportReady(day);
  const currentFingerprint=dailyLoadFingerprint(day);
  const routeSnapshotValid=Boolean(day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint===currentFingerprint);
  const incidents=operationalIncidents(day);
  const criticalIncidents=incidents.filter(item=>item.severity==='critical');
  const warningIncidents=incidents.filter(item=>item.severity==='warning');
  return {
    importReady,
    routeSnapshotValid,
    unmanaged,
    invalidPayments,
    incidents,
    criticalIncidents,
    warningIncidents,
    negativeTotals:totals.cash<0||totals.transfer<0||totals.paid<0,
    totals,
    openingCashValid:Number.isFinite(totals.openingCash)&&totals.openingCash>=0,
    criticalCount:criticalIncidents.length,
    warningCount:warningIncidents.length
  };
}

function reconciliationValues(){
  const totals=calcDay(state.day);
  const cash=cashBreakdownFromDom();
  const countedCash=parseMoneyInput(document.getElementById('countedCash')?.value);
  const verifiedTransfer=parseMoneyInput(document.getElementById('verifiedTransfer')?.value);
  return {
    totals,
    countedCash,
    cashBreakdown:cash.breakdown,
    verifiedTransfer,
    cashDifference:countedCash-totals.expectedCash,
    transferDifference:verifiedTransfer-totals.transfer
  };
}

async function confirmReconciledClose(){
  const r=reconciliationValues();
  const unmanaged=operationalClients(state.day).filter(c=>clientRouteStatus(c,state.day).key==='pending');
  const reason=document.getElementById('reconciliationReason').value.trim();
  const hasDifference=r.cashDifference!==0||r.transferDifference!==0;
  if(r.countedCash<0||r.verifiedTransfer<0)return toast('Los importes conciliados no pueden ser negativos');
  if(hasDifference&&!reason)return toast('Justificá la diferencia antes de cerrar');
  const reconciliation={
    dayDate:state.day.date,
    openingCash:r.totals.openingCash,
    cashCollected:r.totals.cash,
    cashExpenses:r.totals.cashExpenses,
    expectedCash:r.totals.expectedCash,
    countedCash:r.countedCash,
    cashBreakdown:r.cashBreakdown,
    cashDifference:r.cashDifference,
    transferCollected:r.totals.transfer,
    transferExpenses:r.totals.transferExpenses,
    loanTransferPayments:r.totals.loanTransferPayments,
    transferPayments:r.totals.transferExpenses+r.totals.loanTransferPayments,
    expectedTransfer:r.totals.expectedTransfer,
    expectedTransferReceived:r.totals.transfer,
    verifiedTransfer:r.verifiedTransfer,
    transferDifference:r.transferDifference,
    reason,
    unmanagedClients:unmanaged.map(client=>({clientId:client.id,name:client.name,due:clientDue(client,state.day)})),
    unmanagedReason:'',
    unmanagedAcknowledged:true,
    createdAt:Date.now()
  };
  await put('reconciliations',reconciliation);
  state.reconciliations=state.reconciliations.filter(x=>x.dayDate!==reconciliation.dayDate);
  state.reconciliations.unshift(reconciliation);
  await auditLog('reconciliation_saved','Conciliación guardada',{
    dayDate:state.day.date,
    cashDifference:r.cashDifference,
    transferDifference:r.transferDifference,
    cashBreakdown:r.cashBreakdown,
    unmanagedCount:unmanaged.length,
    unmanagedReason:'',
    unmanagedAcknowledged:true,
    transferReceived:r.totals.transfer,
    transferPayments:r.totals.transferExpenses+r.totals.loanTransferPayments,
    transferNet:r.totals.expectedTransfer
  });
  clearClosingDraft();
  await closeDay(true);
}

function canReopenDay(day){
  if(!day||day.status!=='closed')return {allowed:false,reason:'La jornada no está cerrada'};
  if(day.date!==dateKey())return {allowed:false,reason:'Solo puede reabrirse la jornada cerrada de hoy'};
  if(state.history.some(item=>item.date>day.date))return {allowed:false,reason:'Existe una jornada posterior'};
  if(Number(day.reopenCount||0)>=3)return {allowed:false,reason:'Se alcanzó el límite de reaperturas'};
  return {allowed:true,reason:''};
}
function reconstructPreCloseBalances(day){
  const result={};
  operationalClients(day).forEach(client=>{
    if(day.preCloseBalances&&Number.isFinite(Number(day.preCloseBalances[client.id]))){
      result[client.id]=Number(day.preCloseBalances[client.id]);
    }else{
      const accreditation=Number(day.accreditations?.[client.id]||0);
      const visitCredit=Number(day.visitCredits?.[client.id]||0);
      const paid=(day.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      result[client.id]=Math.max(0,Number(client.balance||0)-accreditation-visitCredit+paid);
    }
  });
  return result;
}
function openReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);
  if(!permission.allowed)return toast(permission.reason);
  const legacy=!day.preCloseBalances;
  openSheet(`<div class="sheet-handle"></div>
    <div class="toolbar"><div><h2>Reabrir jornada</h2><div class="note">${escapeHtml(day.date)}</div></div><span class="badge pending">ACCIÓN SENSIBLE</span></div>

      <p class="note">Para cerrarla nuevamente será obligatorio realizar una nueva conciliación.</p>
      ${legacy?`<p class="danger-text"><b>La jornada fue cerrada con una versión anterior. Los saldos previos serán reconstruidos matemáticamente y se creará una copia de emergencia.</b></p>`:''}
    </div>
    <div class="field"><label>Motivo de reapertura</label><textarea id="reopenReason" class="input" placeholder="Ej.: se registró un pago con monto incorrecto"></textarea></div>
    <div class="field"><label>Confirmación</label><input id="reopenConfirm" class="input" placeholder="Escribí REABRIR"></div>

    <button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">CANCELAR</button>`);
