async function confirmReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);
  if(!permission.allowed)return toast(permission.reason);
  const reason=document.getElementById('reopenReason')?.value.trim()||'';
  const confirmation=document.getElementById('reopenConfirm')?.value.trim().toUpperCase()||'';
  if(reason.length<10)return toast('Ingresá un motivo claro de al menos 10 caracteres');
  if(confirmation!=='REABRIR')return toast('Escribí REABRIR para confirmar');
  if(!confirm('¿Confirmar la reapertura? Se anulará la conciliación actual.'))return;

  await createEmergencySnapshot('before_day_reopen',true);
  const previousBalances=reconstructPreCloseBalances(day);
  const previousClosure={
    closedAt:day.closedAt||null,
    summary:cloneData(day.summary||null),
    reconciliation:cloneData(day.reconciliation||getReconciliation(day.date)||null),
    reopenedAt:Date.now(),
    reason
  };

  try{
    for(const client of operationalClients(day)){
      if(previousBalances[client.id]===undefined)continue;
      client.balance=Number(previousBalances[client.id]);
      client.updatedAt=Date.now();
      await put('clients',client);
    }
    if(getReconciliation(day.date)){
      await del('reconciliations',day.date);
      state.reconciliations=state.reconciliations.filter(item=>item.dayDate!==day.date);
    }

    day.closureHistory=Array.isArray(day.closureHistory)?day.closureHistory:[];
    day.closureHistory.push(previousClosure);
    day.reopenHistory=Array.isArray(day.reopenHistory)?day.reopenHistory:[];
    day.reopenHistory.push({reopenedAt:Date.now(),reason,legacyBalanceReconstruction:!day.preCloseBalances});
    day.reopenCount=Number(day.reopenCount||0)+1;
    day.lastReopenedAt=Date.now();
    day.lastReopenReason=reason;
    day.status='active';
    day.reconciliationVoidedAt=Date.now();
    day.reconciliationVoidReason=reason;
    delete day.closedAt;
    delete day.summary;
    delete day.reconciliation;
    delete day.closingDraft;
    state.closingDraft=null;
    state.day=day;

    await put('days',day);
    await auditLog('day_reopened','Jornada reabierta',{
      dayDate:day.date,reason,reopenCount:day.reopenCount,
      legacyBalanceReconstruction:!day.preCloseBalances
    });
    await createEmergencySnapshot('day_reopened',true);
    closeSheet();
    render();
    toast('Jornada reabierta. Debe conciliarse nuevamente');
  }catch(error){
    console.error(error);
    toast('No se pudo reabrir la jornada');
  }
}

function addCalendarDays(dateString,days=1){
  const [year,month,day]=String(dateString||dateKey()).split('-').map(Number);
  const date=new Date(year,month-1,day+days,12,0,0);
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')
  ].join('-');
}
function nextOperationalDate(closedDate){
  const following=addCalendarDays(closedDate||dateKey(),1);
  return following<dateKey()?dateKey():following;
}
async function createDayForDate(dayDate,{source='manual'}={}){
  const existing=(await getAll('days')).find(day=>day.date===dayDate);
  if(existing){
    state.day=existing;
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
    state.tab='today';
    render();
    toast(existing.status==='closed'?'Esa jornada ya está cerrada':'Jornada existente abierta');
    return existing;
  }

  const activeClients=state.clients.filter(client=>client.active!==false);
  state.day={
    date:dayDate,
    status:'preparation',
    createdAt:Date.now(),
    openingCash:Number(state.settings.capital||0),
    openingCashConfirmed:false,
    clientIds:activeClients.map(client=>client.id),
    routeOrder:[],
    openingBalances:Object.fromEntries(
      activeClients.map(client=>[client.id,Math.max(0,Number(client.balance||0))])
    ),
    accreditations:Object.fromEntries(activeClients.map(client=>[client.id,0])),
    payments:Object.fromEntries(activeClients.map(client=>[client.id,[]])),
    visits:{},
    note:'',
    dailyLoad:null,
    accreditationImport:null,
    createdFrom:source
  };
  await saveDay();
  await auditLog('day_started','Día operativo iniciado',{dayDate,source});
  await createEmergencySnapshot('new_day_started',true);
  state.tab='today';
  render();
  toast(`Nueva jornada abierta: ${dayDate}`);
  return state.day;
}
async function startDay(){
  return createDayForDate(dateKey(),{source:'manual'});
}
async function startNextDay(closedDate=state.day?.date){
  if(!closedDate)return toast('No se encontró la jornada cerrada');
  const nextDate=nextOperationalDate(closedDate);
  return createDayForDate(nextDate,{source:'previous_day_close'});
}

function dailyLoadSummary(day=state.day){
  const clients=operationalClients(day);
  let previousBalanceTotal=0,accreditationTotal=0,paymentTotal=0,cashPayments=0,transferPayments=0,clientToCollect=0;
  let hasClientData=false;
  clients.forEach(client=>{
    const previousBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const payments=day?.payments?.[client.id]||[];
    const paid=payments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    if(previousBalance!==0||accreditation!==0||paid!==0)hasClientData=true;
    previousBalanceTotal+=previousBalance;
    accreditationTotal+=accreditation;
    paymentTotal+=paid;
    clientToCollect+=(previousBalance+accreditation-paid);
    payments.forEach(payment=>{
      if(payment.method==='cash')cashPayments+=Number(payment.amount||0);
      if(payment.method==='transfer')transferPayments+=Number(payment.amount||0);
    });
  });
  const capital=Number(day?.dailyLoad?.capital??dayOpeningCash(day)??200000);
  const pinAdvance=Number(day?.dailyLoad?.pinAdvance||0);
  const bagBalance=Number(day?.dailyLoad?.bagBalance||0);
  const loans=Number(day?.dailyLoad?.loans||0);
  const todayBalances=Number(day?.dailyLoad?.todayBalances||0);
  const todaySales=Number(day?.dailyLoad?.todaySales||0);
  const cash=Number(day?.dailyLoad?.cash||0);
  const manualToCollect=Number(day?.dailyLoad?.manualToCollect||0);
  const bankDiscount=Math.max(0,Number(day?.dailyLoad?.bankDiscount||0));
  const toCollect=hasClientData?clientToCollect:manualToCollect;
  const bagTotal=bagBalance+todayBalances-todaySales+cash+toCollect-capital-pinAdvance-loans;
  const netProfit=bagTotal-bankDiscount;
  const debtors=clients.filter(client=>clientDue(client,day)>0).length;
  return {
    capital,pinAdvance,bagBalance,loans,todayBalances,todaySales,cash,manualToCollect,bankDiscount,
    previousBalanceTotal,accreditationTotal,paymentTotal,cashPayments,transferPayments,
    clientToCollect,toCollect,bagTotal,netProfit,hasClientData,debtors,clients:clients.length
  };
}

function actualizarTotalCargaOriginal(){
  try{
    let totalACobrarClientes=0;
    let hayClientes=false;
    clientesCargaOriginal.forEach((c,index)=>{
      const sid=sanitizeCargaId(c.codigo);
      const client=clienteSistemaPorIndice(index);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=roundCurrency(parseFloat(document.getElementById(`acred_${sid}`)?.value)||0);
      const pago=roundCurrency(parseFloat(document.getElementById(`pago_${sid}`)?.value)||0);
      if(saldoAnterior!==0||acred!==0||pago!==0)hayClientes=true;
      totalACobrarClientes+=(saldoAnterior+acred-pago);
    });
    const totalACobrar=document.getElementById('totalACobrar');
    if(totalACobrar)totalACobrar.textContent=`Total a cobrar: $${fmt(totalACobrarClientes)}`;

    const capital=roundCurrency(parseFloat(document.getElementById('capital')?.value)||0);
    const adelantoPin=roundCurrency(parseFloat(document.getElementById('adelantoPin')?.value)||0);
    const saldoBolsaTotal=roundCurrency(parseFloat(document.getElementById('saldoBolsaTotal')?.value)||0);
    const prestamos=roundCurrency(parseFloat(document.getElementById('prestamos')?.value)||0);
    const saldosHoyTotal=roundCurrency(parseFloat(document.getElementById('saldosHoyTotal')?.value)||0);
    const ventasHoyTotal=roundCurrency(parseFloat(document.getElementById('ventasHoyTotal')?.value)||0);
    const efectivoTotal=roundCurrency(parseFloat(document.getElementById('efectivoTotal')?.value)||0);
    const aCobrarManual=document.getElementById('aCobrarManual')?.value;
    const descuentoBancario=Math.max(0,roundCurrency(parseFloat(document.getElementById('descuentoBancario')?.value)||0));
    const aCobrar=hayClientes?totalACobrarClientes:(parseFloat(aCobrarManual)||0);
    const gananciaBruta=roundCurrency(saldoBolsaTotal+saldosHoyTotal-ventasHoyTotal+efectivoTotal+aCobrar-capital-adelantoPin-prestamos);
    const gananciaNeta=roundCurrency(gananciaBruta-descuentoBancario);
    const gananciaBrutaEl=document.getElementById('gananciaBruta');
    const descuentoEl=document.getElementById('descuentoBancarioVista');
    const totalBolsa=document.getElementById('totalBolsa');
    if(gananciaBrutaEl)gananciaBrutaEl.textContent=`$${fmt(gananciaBruta)}`;
    if(descuentoEl)descuentoEl.textContent=`-$${fmt(descuentoBancario)}`;
    if(totalBolsa)totalBolsa.textContent=`$${fmt(gananciaNeta)}`;
  }catch(err){
    console.log('Error en actualizarTotal:',err.message);
  }
}
function validarMontosCargaOriginal(){
  clientesCargaOriginal.forEach(c=>{
    const sid=sanitizeCargaId(c.codigo);
    document.getElementById(`acred_${sid}`)?.classList.remove('campo-alerta');
  });
  const alertas=[];
  clientesCargaOriginal.forEach(c=>{
    if(!c.acredFijo||c.acredFijo===0)return;
    const sid=sanitizeCargaId(c.codigo);
    const el=document.getElementById(`acred_${sid}`);
    if(!el)return;
    const ingresado=parseFloat(el.value)||0;
    if(ingresado===0)return;
    if(ingresado>c.acredFijo*2){
      el.classList.add('campo-alerta');
      alertas.push(`${c.nombre}: ingresaste $${fmt(ingresado)} pero el acumulado previo es $${fmt(c.acredFijo)}`);
    }
  });
  const div=document.getElementById('alertaMontos');
  if(alertas.length>0){
    div.innerHTML='<strong>⚠️ Verificá estos montos antes de copiar:</strong>'+alertas.map(a=>`• ${a}`).join('<br>');
    div.style.display='block';
  }else{
    div.style.display='none';
  }
  return alertas.length;
}
async function guardarCargaOriginalEnSistema(totalACobrar,total){
  const nextAccreditations={};
  const nextPayments={};

  clientesCargaOriginal.forEach((c,index)=>{
    const sid=sanitizeCargaId(c.codigo);
    const systemClient=clienteSistemaPorIndice(index);
    const clientId=systemClient?.id||String(c.codigo);
    const acred=roundCurrency(parseFloat(document.getElementById(`acred_${sid}`)?.value)||0);
    const pago=roundCurrency(parseFloat(document.getElementById(`pago_${sid}`)?.value)||0);
    const forma=document.getElementById(`forma_${sid}`)?.value||'';

    nextAccreditations[clientId]=acred;
    nextPayments[clientId]=pago!==0?[{
      id:preparationPaymentFor(state.day,clientId)?.id||crypto.randomUUID?.()||'pay_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      amount:pago,
      method:forma==='Efectivo'?'cash':forma==='Transferencia'?'transfer':'',
      source:'daily_load',
      createdAt:preparationPaymentFor(state.day,clientId)?.createdAt||Date.now(),
      updatedAt:Date.now()
    }]:[];
  });

  const capital=roundCurrency(parseFloat(document.getElementById('capital')?.value)||0);
  const adelantoPin=roundCurrency(parseFloat(document.getElementById('adelantoPin')?.value)||0);
  const saldoBolsaTotal=roundCurrency(parseFloat(document.getElementById('saldoBolsaTotal')?.value)||0);
  const prestamos=roundCurrency(parseFloat(document.getElementById('prestamos')?.value)||0);
  const saldosHoyTotal=roundCurrency(parseFloat(document.getElementById('saldosHoyTotal')?.value)||0);
  const ventasHoyTotal=roundCurrency(parseFloat(document.getElementById('ventasHoyTotal')?.value)||0);
  const efectivoTotal=roundCurrency(parseFloat(document.getElementById('efectivoTotal')?.value)||0);
  const aCobrarManual=roundCurrency(parseFloat(document.getElementById('aCobrarManual')?.value)||0);
  const bankDiscount=Math.max(0,roundCurrency(parseFloat(document.getElementById('descuentoBancario')?.value)||0));
  const netProfit=roundCurrency(total-bankDiscount);

  state.day.openingCash=capital;
  state.day.openingCashConfirmed=true;
  state.day.accreditations=nextAccreditations;
  state.day.payments=nextPayments;
  state.day.dailyLoad={
    source:'manual',
    confirmedAt:Date.now(),
    capital,
    pinAdvance:adelantoPin,
    bagBalance:saldoBolsaTotal,
    loans:prestamos,
    todayBalances:saldosHoyTotal,
    todaySales:ventasHoyTotal,
    cash:efectivoTotal,
    manualToCollect:aCobrarManual,
    bankDiscount,
    totals:{toCollect:totalACobrar,bagTotal:total,netProfit},
    clients:clientesCargaOriginal.length
  };
  state.day.accreditationImport=null;
  state.day.routeOrder=clientesCargaOriginal.map((c,index)=>{
    const systemClient=clienteSistemaPorIndice(index);
    return systemClient?.id||String(c.codigo);
  });
  delete state.day.preRouteValidation;
  delete state.day.routeSnapshot;
  await saveDay();
}
async function generarResumenCargaOriginal(){
  try{
    validarMontosCargaOriginal();

    const capital=document.getElementById('capital').value;
    const adelantoPin=document.getElementById('adelantoPin').value;
    const saldoBolsaTotal=document.getElementById('saldoBolsaTotal').value;
    const prestamos=document.getElementById('prestamos').value;
    const saldosHoyTotal=document.getElementById('saldosHoyTotal').value;
    const ventasHoyTotal=document.getElementById('ventasHoyTotal').value;
    const efectivoTotal=document.getElementById('efectivoTotal').value;
    const aCobrarManual=document.getElementById('aCobrarManual').value;
    const descuentoBancario=Math.max(0,parseFloat(document.getElementById('descuentoBancario').value)||0);

    let totalACobrar=0;
    let hayDatos=false;
    let textoClientes='';

    clientesCargaOriginal.forEach((c,index)=>{
      const sid=sanitizeCargaId(c.codigo);
      const client=clienteSistemaPorIndice(index);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=parseFloat(document.getElementById(`acred_${sid}`).value)||0;
      const pago=parseFloat(document.getElementById(`pago_${sid}`).value)||0;
      const forma=document.getElementById(`forma_${sid}`).value;
      if(saldoAnterior!==0||acred!==0||pago!==0){
        hayDatos=true;
        const pendiente=saldoAnterior+acred-pago;
        totalACobrar+=pendiente;
        textoClientes+=`${c.nombre}: saldo anterior ${fmt(saldoAnterior)}, acreditación ${fmt(acred)}, pagó ${fmt(pago)} ${forma||''} -> pendiente ${fmt(pendiente)}
`;
      }
    });

    if(!hayDatos){
      textoClientes='(sin datos cargados)\n';
      totalACobrar=parseFloat(aCobrarManual)||0;
    }

    let texto='CLIENTES (acreditaciones / pagó / forma):\n';
    texto+=textoClientes;
    texto+=`\nTotal a cobrar (pendiente): ${fmt(totalACobrar)}\n`;
    texto+='\nBALANCE BOLSA TOTAL\n';
    texto+=`Capital: ${fmt(capital)}\n`;
    texto+=`Adelanto PIN: ${fmt(adelantoPin)}\n`;
    texto+=`Saldo en bolsa: ${fmt(saldoBolsaTotal)}\n`;
    texto+=`Préstamos: ${fmt(prestamos)}\n`;
    texto+=`Saldos de hoy: ${fmt(saldosHoyTotal)}\n`;
    texto+=`Ventas de hoy: ${fmt(ventasHoyTotal)}\n`;
    texto+=`Efectivo: ${fmt(efectivoTotal)}\n`;
    texto+=`A cobrar: ${fmt(totalACobrar)}\n`;

    const total=roundCurrency((parseFloat(saldoBolsaTotal)||0)+(parseFloat(saldosHoyTotal)||0)-(parseFloat(ventasHoyTotal)||0)+(parseFloat(efectivoTotal)||0)+totalACobrar-(parseFloat(capital)||0)-(parseFloat(adelantoPin)||0)-(parseFloat(prestamos)||0));
    const gananciaNeta=roundCurrency(total-descuentoBancario);
    texto+=`Ganancia bruta: ${fmt(total)}\n`;
    texto+=`Descuento bancario: ${fmt(descuentoBancario)}\n`;
    texto+=`Ganancia neta: ${fmt(gananciaNeta)}\n`;

    const resultadoDiv=document.getElementById('resultado');
    resultadoDiv.textContent=texto;
    resultadoDiv.style.color='#c8e6ff';
    resultadoDiv.style.display='block';
    document.getElementById('copyBtn').style.display='block';
    resultadoDiv.scrollIntoView({behavior:'smooth',block:'center'});

    await guardarCargaOriginalEnSistema(totalACobrar,total);
    await auditLog('daily_load_confirmed','Resumen generado desde carga_diaria.html',{
      dayDate:state.day.date,totalACobrar,gananciaBruta:total,descuentoBancario,gananciaNeta
    });

    const allRouteClients=operationalClients(state.day);
    const debtors=allRouteClients.filter(client=>clientDue(client,state.day)>0);
    state.day.routeOrder=allRouteClients.map(client=>client.id);
    state.day.status='active';
    state.day.routeActivatedAt=Date.now();
    state.day.whatsappGeneratedAt=Date.now();
    state.day.routeSnapshot={
      createdAt:Date.now(),
      totalToCollect:debtors.reduce((sum,client)=>sum+clientDue(client,state.day),0),
      clients:allRouteClients.map(client=>({
        clientId:client.id,
        name:client.name,
        accreditation:Number(state.day.accreditations?.[client.id]||0),
        paidBeforeRoute:(state.day.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0),
        remaining:clientDue(client,state.day)
      }))
    };
    await saveDay();
    await createEmergencySnapshot('route_generated_from_daily_load',true);
    await auditLog('route_activated','Mensajes y hoja de ruta generados automáticamente',{
      clients:allRouteClients.length,
      debtors:debtors.length,
      toCollect:state.day.routeSnapshot.totalToCollect
    });

    render();
    setTimeout(showGeneratedWhatsApp,0);
    toast('Resumen, WhatsApp y hoja de ruta generados');
  }catch(err){
    const resultadoDiv=document.getElementById('resultado');
    resultadoDiv.textContent='Ocurrió un error: '+err.message;
    resultadoDiv.style.display='block';
    resultadoDiv.style.color='#ff6b6b';
  }
}

function dailyLoadValidation(day=state.day){
  const rows=[],errors=[];
  let previous=0,accredited=0,paid=0,cash=0,transfer=0,toCollect=0;
  operationalClients(day).forEach(client=>{
    const openingBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const preparationPayments=(day?.payments?.[client.id]||[]).filter(payment=>payment.source==='daily_load');
    const preparationPaid=preparationPayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    const remaining=openingBalance+accreditation-preparationPaid;
    if(!Number.isFinite(accreditation)||accreditation<0)errors.push(`${client.name}: acreditación inválida`);
    if(!Number.isFinite(preparationPaid)||preparationPaid<0)errors.push(`${client.name}: pago inválido`);
    if(preparationPayments.length>1)errors.push(`${client.name}: más de un pago cargado`);
    preparationPayments.forEach(payment=>{
      if(payment.method==='cash')cash+=Number(payment.amount||0);
      else if(payment.method==='transfer')transfer+=Number(payment.amount||0);
      else errors.push(`${client.name}: forma de pago inválida`);
    });
    previous+=openingBalance; accredited+=accreditation; paid+=preparationPaid; toCollect+=remaining;
    rows.push({
      clientId:client.id,name:client.name,openingBalance,accreditation,
      paid:preparationPaid,method:preparationPayments[0]?.method||'',remaining
    });
  });
  const debtors=rows.filter(row=>row.remaining>0);
  return {rows,errors,warnings:[],debtors,totals:{previous,accredited,paid,cash,transfer,toCollect},valid:errors.length===0};
}
function dailyLoadFingerprint(day=state.day){
  const validation=dailyLoadValidation(day);
  const source=[
    day?.date||'',dayOpeningCash(day),Number(day?.dailyLoad?.pinAdvance||0),Number(day?.dailyLoad?.bagBalance||0),Number(day?.dailyLoad?.bankDiscount||0),
    ...validation.rows.map(row=>[row.clientId,row.openingBalance,row.accreditation,row.paid,row.method,row.remaining].join(':'))
  ].join('|');
  let hash=2166136261;
  for(let index=0;index<source.length;index++){hash^=source.charCodeAt(index);hash=Math.imul(hash,16777619);}
  return (hash>>>0).toString(16).padStart(8,'0');
}

async function activateRoute(validated=false){

    return toast('La carga cambió. Volvé a revisarla antes de generar la ruta');

  const total=Object.values(state.day.accreditations||{}).reduce((sum,value)=>sum+Number(value||0),0);
  const toCollect=debtors.reduce((sum,client)=>sum+clientDue(client,state.day),0);

  state.day.routeActivatedAt=Date.now();

    createdAt:Date.now(),fingerprint:currentFingerprint,totalToCollect:toCollect,

    clients:debtors.length,accredited:total,toCollect,

function paidCount(d){return operationalClients(d).filter(c=>(d.payments[c.id]||[]).reduce((s,p)=>s+Number(p.amount||0),0)>0).length}
function calcDay(d){
  ensureDayCollections(d);
  let accredited=0,visitAmounts=0,paid=0,cash=0,transfer=0,currentPending=0;
  const snapshotByClient=new Map(
    (d.routeSnapshot?.clients||[]).map(item=>[item.clientId,Number(item.remaining||0)])
  );
  let plannedInitial=Number(d.routeSnapshot?.totalToCollect||0);
  let plannedRemaining=0;

  operationalClients(d).forEach(client=>{
    const accreditation=Number(d.accreditations?.[client.id]||0);
    const visitAmount=Number(d.visitCredits?.[client.id]||0);
    accredited+=accreditation;
    visitAmounts+=visitAmount;

    const routePayments=routePaymentsFor(client.id,d);
    const routePaid=routePayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    routePayments.forEach(payment=>{
      const amount=Number(payment.amount||0);
      paid+=amount;
      payment.method==='cash'?cash+=amount:transfer+=amount;
    });

    currentPending+=clientDue(client,d);

    const initialForClient=snapshotByClient.has(client.id)
      ?snapshotByClient.get(client.id)
      :Math.max(0,accreditation-(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((sum,payment)=>sum+Number(payment.amount||0),0));
    plannedRemaining+=Math.max(0,initialForClient-routePaid);
  });

  if(!d.routeSnapshot?.totalToCollect){
    plannedInitial=operationalClients(d).reduce((sum,client)=>{
      const accreditation=Number(d.accreditations?.[client.id]||0);
      const paidBefore=(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((subtotal,payment)=>subtotal+Number(payment.amount||0),0);
      return sum+Math.max(0,accreditation-paidBefore);
    },0);
  }

  plannedRemaining=Math.min(plannedInitial,plannedRemaining);
  const plannedCollected=Math.max(0,plannedInitial-plannedRemaining);
  const expense=expenseTotals(d.date);
  const loanPayments=state.loans.reduce((totals,loan)=>{
    (loan.payments||[]).forEach(payment=>{
      if(payment.dayDate!==d.date)return;
      const amount=Number(payment.amount||0);
      totals.total+=amount;
      payment.method==='transfer'?totals.transfer+=amount:totals.cash+=amount;
    });
    return totals;
  },{total:0,cash:0,transfer:0});

  const openingCash=dayOpeningCash(d);
  const expectedCash=openingCash+cash-expense.cash-loanPayments.cash;
  const expectedTransfer=transfer-expense.transfer-loanPayments.transfer;
  const totalFunds=cash+transfer;

  return {
    accredited,visitAmounts,paid,cash,transfer,totalFunds,
    toCollect:plannedInitial,plannedInitial,plannedCollected,plannedRemaining,
    pending:currentPending,currentPending,
    expenses:expense.total,cashExpenses:expense.cash,transferExpenses:expense.transfer,
    loanPayments:loanPayments.total,loanCashPayments:loanPayments.cash,loanTransferPayments:loanPayments.transfer,
    openingCash,expectedCash,expectedTransfer,net:paid-expense.total-loanPayments.total
  };
}

function recalculateClientVisitState(clientId,day=state.day){
  if(!day)return;
  ensureDayCollections(day);
  const client=state.clients.find(c=>c.id===clientId);
  if(!client)return;
  const payments=day.payments?.[clientId]||[];
  const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
  const total=Number(day.accreditations?.[clientId]||0)+Number(day.visitCredits?.[clientId]||0);
  const previous=day.visits?.[clientId];

  if(total===0&&paid>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago recibido durante la visita',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago recibido durante la visita'
    };
    return;
  }
  if(paid>=total&&total>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago registrado',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago registrado'
    };
    return;
  }
  if(paid>0){
    day.visits[clientId]={
      status:'partial',
      reason:'Pago parcial registrado',
      followUpDate:previous?.followUpDate||'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:null,
      followUpResolution:''
    };
    return;
  }
  if(previous?.status==='paid'||previous?.status==='partial'){
    delete day.visits[clientId];
  }
}

    const client=state.clients.find(c=>c.id===clientId);

function recentPaymentClients(day=state.day){
  if(!day)return [];
  return Object.entries(day.payments||{}).map(([clientId,payments])=>{
    const client=state.clients.find(c=>c.id===clientId);

    const lastPayment=[...validPayments].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))[0];
    const remaining=clientDue(client,day);
    return {clientId,client,payments:validPayments,totalPaid,lastPayment,remaining};

async function registerPayment(clientId,amount,method,source='manual'){
  if(state.paymentLock)throw new Error('El pago anterior todavía se está guardando');
  state.paymentLock=true;
  try{
    const client=state.clients.find(c=>c.id===clientId);
    if(!client||!state.day||state.day.status!=='active')throw new Error('Jornada o cliente inválido');
    const remaining=clientDue(client);
    if(amount<=0)throw new Error('Monto inválido');
    if(!['cash','transfer'].includes(method))throw new Error('Forma de pago inválida');

    const now=Date.now();
    const existing=(state.day.payments?.[clientId]||[]).find(payment=>
      Number(payment.amount)===Number(amount)&&
      payment.method===method&&
      now-Number(payment.createdAt||0)<8000
    );
    if(existing)throw new Error('Posible cobro duplicado: esperá unos segundos');

    state.day.payments[clientId]=state.day.payments[clientId]||[];
    const payment={id:crypto.randomUUID?.()||String(now),amount,method,createdAt:now,source};
    state.day.payments[clientId].push(payment);
    recalculateClientVisitState(clientId,state.day);
    await saveDay();
    state.lastPaymentAction={type:'created',clientId,paymentId:payment.id,createdAt:now};
    const totalPaidForClient=(state.day.payments?.[clientId]||[])
      .reduce((sum,item)=>sum+Number(item.amount||0),0);
    const totalObligationForClient=
      dayOpeningBalance(client,state.day)+
      Number(state.day.accreditations?.[clientId]||0)+
      Number(state.day.visitCredits?.[clientId]||0);
    const remainingAfterPayment=clientDue(client,state.day);
    const overpayment=Math.max(0,totalPaidForClient-totalObligationForClient);
    state.day.lastBalanceUpdate={
      updatedAt:Date.now(),
      clientId,
      paymentId:payment.id,
      amount,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:operationalClients(state.day).reduce((sum,item)=>sum+clientDue(item,state.day),0)
    };
    await saveDay();
    await auditLog('payment_created','Pago registrado y balance actualizado',{
      clientId,amount,method,source,paymentId:payment.id,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:state.day.lastBalanceUpdate.totalPending
    });
    return payment;
  }finally{
    state.paymentLock=false;
  }
}

async function undoLastPayment(){
  const action=state.lastPaymentAction;
  if(!action)return toast('No hay una operación reciente para deshacer');
  if(Date.now()-Number(action.createdAt||0)>300000){
    state.lastPaymentAction=null;
    return toast('El plazo para deshacer venció');
  }
  if(!state.day||state.day.status!=='active')return toast('La ruta no está activa');
  const found=findDayPayment(action.clientId,action.paymentId);
  if(action.type==='created'){
    if(!found.payment)return toast('El pago ya no existe');
    const removed={...found.payment};
    found.payments.splice(found.index,1);
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_undo','Se deshizo un pago recién registrado',{
      clientId:action.clientId,paymentId:action.paymentId,amount:removed.amount,method:removed.method
    });
  }else if(action.type==='edited'){
    if(!found.payment||!action.previous)return toast('No se puede restaurar el pago');
    const current={...found.payment};
    Object.assign(found.payment,action.previous,{restoredAt:Date.now()});
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_edit_undo','Se deshizo la edición de un pago',{
      clientId:action.clientId,paymentId:action.paymentId,
      previous:{amount:current.amount,method:current.method},
      restored:{amount:action.previous.amount,method:action.previous.method}
    });
  }else{
    return toast('La operación no admite deshacer');
  }
  state.lastPaymentAction=null;
  closeSheet();
  render();
  toast('Operación deshecha');
}
async function deletePayment(clientId,paymentId){

async function closeDay(reconciled=false){
  if(!reconciled)return openClosePreview();
  if(state.day.status==='closed')return toast('El día ya está cerrado');
  const checklist=closeChecklist(state.day);
  if(checklist.criticalCount)return toast('El cierre está bloqueado por inconsistencias');
  const reconciliation=getReconciliation(state.day.date);
  if(!reconciliation)return toast('Primero realizá la conciliación');
  if(!confirm('¿Confirmar el cierre definitivo del día?'))return;
  const t=calcDay(state.day);
  state.day.preCloseBalances={};
  operationalClients(state.day).forEach(client=>{
    state.day.preCloseBalances[client.id]=dayOpeningBalance(client,state.day);
  });
  state.day.status='closed';
  state.day.closedAt=Date.now();
  state.day.summary=t;
  state.day.reconciliation={...reconciliation};
  state.day.adjustments=state.day.adjustments||[];
  for(const c of operationalClients(state.day)){
    const due=
      dayOpeningBalance(c,state.day)+
      Number(state.day.accreditations[c.id]||0)+
      Number(state.day.visitCredits?.[c.id]||0);
    const paid=(state.day.payments[c.id]||[]).reduce((s,p)=>s+Number(p.amount||0),0);
    c.balance=Math.max(0,due-paid);
    c.updatedAt=Date.now();
    await put('clients',c);
  }
  await saveDay();
  const closedDate=state.day.date;
  await auditLog('day_closed','Día cerrado',{summary:t,reconciliation,preCloseBalances:state.day.preCloseBalances,reopenCount:Number(state.day.reopenCount||0)});
  await createEmergencySnapshot('day_closed',true);
  closeSheet();
  await startNextDay(closedDate);
}

function exportDaySummary(dayDate){
  const d=state.history.find(x=>x.date===dayDate)||state.day;
  if(!d)return toast('No se encontró el día');
  const totals=calcDay(d);
  const r=d.reconciliation||getReconciliation(dayDate);
  const lines=[
    'CML VIRTUAL - RESUMEN DIARIO',
    `Fecha: ${dayDate}`,
    '',
    `Acreditado: ${money(totals.accredited)}`,
    `Cobrado: ${money(totals.paid)}`,
    `Efectivo: ${money(totals.cash)}`,
    `Transferencias: ${money(totals.transfer)}`,
    `Gastos: ${money(totals.expenses)}`,
    `Neto: ${money(totals.net)}`,
    `Pendiente: ${money(totals.pending)}`,
    '',
    `Origen de carga: ${d.dailyLoad?.source==='import'?'Importación':'Manual'}`,
    `Carga confirmada: ${d.dailyLoad?.confirmedAt?formatDateTime(d.dailyLoad.confirmedAt):'No'}`,
    `PINWEB importado: ${d.accreditationImport?'Sí':'No'}`,
    `Coincidencias PINWEB: ${d.accreditationImport?.matched||0}`,
    `Total importado PINWEB: ${money(d.accreditationImport?.total||0)}`,
    `Revisión previa a ruta: ${d.preRouteValidation?.confirmedAt?formatDateTime(d.preRouteValidation.confirmedAt):'No'}`,
    `Huella de control: ${d.routeSnapshot?.fingerprint||d.preRouteValidation?.fingerprint||'Sin huella'}`,
    `Orden de ruta: ${operationalClients(d).map(c=>c.name).join(' > ')}`,
    `Cantidad de reaperturas: ${Number(d.reopenCount||0)}`,
    ''
  ];
  if(Array.isArray(d.reopenHistory)&&d.reopenHistory.length){
    lines.push('REAPERTURAS');
    d.reopenHistory.forEach((item,index)=>lines.push(`${index+1}. ${formatDateTime(item.reopenedAt)} | ${item.reason}`));
    lines.push('');
  }
  if(r){
    lines.push('CONCILIACIÓN');
    lines.push(`Cierre con clientes sin gestionar: ${r.unmanagedClients?.length||0}`);
    if(r.unmanagedReason)lines.push(`Motivo: ${r.unmanagedReason}`);
    lines.push(`Efectivo contado: ${money(r.countedCash)}`);
    if(r.cashBreakdown){
      lines.push('Desglose de efectivo:');
      Object.entries(r.cashBreakdown).filter(([,qty])=>Number(qty)>0).sort((a,b)=>Number(b[0])-Number(a[0])).forEach(([value,qty])=>{
        lines.push(`  ${qty} x ${money(Number(value))} = ${money(Number(value)*Number(qty))}`);
      });
    }
    lines.push(`Transferencias verificadas: ${money(r.verifiedTransfer)}`);
    lines.push(`Diferencia total: ${money(r.cashDifference+r.transferDifference)}`);
    if(r.reason)lines.push(`Justificación: ${r.reason}`);
    lines.push('');
  }
  lines.push('CLIENTES');
  operationalClients(d).forEach(c=>{
    const accreditation=Number(d.accreditations?.[c.id]||0);
    const paid=(d.payments?.[c.id]||[]).reduce((sum,p)=>sum+Number(p.amount||0),0);
    const status=clientRouteStatus(c,d);
    const visit=visitRecord(c.id,d);
    const openingBalance=dayOpeningBalance(c,d);
    lines.push(`${c.name} | Saldo inicial: ${money(openingBalance)} | Acreditación: ${money(accreditation)} | Pagado: ${money(paid)} | Pendiente: ${money(clientDue(c,d))} | Estado: ${status.label}${visit?.reason?' | Motivo: '+visit.reason:''}${visit?.followUpDate?' | Seguimiento: '+visit.followUpDate:''}${visit?.followUpResolvedAt?' | Resolución: '+(visit.followUpResolution||'Resuelto'):''}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_Resumen_${dayDate}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('day_summary_exported','Resumen diario exportado',{dayDate});
  toast('Resumen exportado');
}

function clientStatementRange(){

function clientStatementRows(clientId){

  if(!client)return [];
  const {from,to}=clientStatementRange();
  const days=[...state.history];
  if(state.day&&!days.some(day=>day.date===state.day.date))days.push(state.day);
  return days
    .filter(day=>day.date>=from&&day.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(day=>{
      const accreditation=Number(day.accreditations?.[clientId]||0);
      const payments=Array.isArray(day.payments?.[clientId])?day.payments[clientId]:[];
      const cash=payments.filter(payment=>payment.method==='cash').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const transfer=payments.filter(payment=>payment.method==='transfer').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const paid=cash+transfer;
      const opening=Number(day.preCloseBalances?.[clientId]);
      const hasOpening=Number.isFinite(opening);
      const closing=hasOpening?Math.max(0,opening+accreditation-paid):null;
      const visit=day.visits?.[clientId]||null;
      const relevant=hasOpening||accreditation||paid||visit;
      return {
        date:day.date,
        status:day.status,
        opening:hasOpening?opening:null,
        accreditation,
        cash,
        transfer,
        paid,
        closing,
        visit,
        relevant
      };
    })
    .filter(row=>row.relevant);
}
function clientStatementSummary(rows){
  const accredited=rows.reduce((sum,row)=>sum+row.accreditation,0);
  const cash=rows.reduce((sum,row)=>sum+row.cash,0);
  const transfer=rows.reduce((sum,row)=>sum+row.transfer,0);
  const paid=cash+transfer;
  const managed=rows.filter(row=>row.visit?.status&&row.visit.status!=='pending').length;
  const firstOpening=rows.find(row=>row.opening!==null)?.opening??null;
  const lastClosing=[...rows].reverse().find(row=>row.closing!==null)?.closing??null;
  return {accredited,cash,transfer,paid,managed,firstOpening,lastClosing};
}
function clientStatementVisitLabel(visit){
  if(!visit)return 'Sin gestión';
  return {
    paid:'Pagado',
    partial:'Pago parcial',
    visited:'Visitado',
    rescheduled:'Reprogramado',
    pending:'Pendiente'
  }[visit.status]||visit.status||'Sin gestión';
}

function setQuickClientStatementRange(clientId,type){
  const today=new Date();
  let from,to=dateKey(today);
  if(type==='month'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth(),1));
  }else if(type==='previous'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth()-1,1));
    to=dateKey(new Date(today.getFullYear(),today.getMonth(),0));
  }else if(type==='90'){
    const start=new Date(today);
    start.setDate(start.getDate()-89);
    from=dateKey(start);
  }else{
    from='2000-01-01';
  }
  state.statementFrom=from;
  state.statementTo=to;
  showClientStatement(clientId);
}

function exportReportCsv(){
  const data=reportData();
  const {from,to}=reportRange();
  if(!data.days.length)return toast('No hay datos para exportar');
  const rows=[
    ['REPORTE CML VIRTUAL'],
    ['Desde',from],
    ['Hasta',to],
    [],
    ['RESUMEN'],
    ['Días cerrados',data.days.length],
    ['Acreditado',data.accredited],
    ['Cobrado',data.collected],
    ['Efectivo',data.cash],
    ['Transferencias',data.transfer],
    ['Gastos',data.expenses],
    ['Neto',data.net],
    ['Pendiente',data.pending],
    ['Efectividad',data.effectiveness+'%'],
    [],
    ['DETALLE DIARIO'],
    ['Fecha','Acreditado','Cobrado','Efectivo','Transferencias','Gastos','Neto','Pendiente']
  ];
  data.days.forEach(day=>{
    const t=calcDay(day);
    rows.push([day.date,t.accredited,t.paid,t.cash,t.transfer,t.expenses,t.net,t.pending]);
  });
  rows.push([],['RANKING DE CLIENTES'],['Cliente','Cobrado','Acreditado','Pagos','Jornadas','Efectivo','Transferencias']);
  data.clients.forEach(client=>rows.push([client.name,client.collected,client.accredited,client.payments,client.visits,client.cash,client.transfer]));
  const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_reporte_${from}_${to}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('report_exported','Reporte CSV exportado',{from,to,days:data.days.length});
  toast('Reporte CSV exportado');
}

async function payLoan(id){
  const loan=state.loans.find(item=>item.id===id);
  if(!loan)return toast('No se encontró el préstamo');
  const amount=parseMoneyInput(document.getElementById('loanPayment')?.value);
  const method=document.getElementById('loanPaymentMethod')?.value||'cash';
  if(amount<=0)return toast('Ingresá un monto válido');
  if(amount>Number(loan.remaining||0))return toast(`El máximo pendiente es ${money(loan.remaining)}`);
  if(!['cash','transfer'].includes(method))return toast('Forma de pago inválida');

  const payment={
    id:crypto.randomUUID?.()||String(Date.now()),
    amount:roundCurrency(amount),
    method,
    createdAt:Date.now(),
    dayDate:state.day?.date||''
  };
  loan.remaining=roundCurrency(Number(loan.remaining||0)-payment.amount);
  loan.payments=loan.payments||[];
  loan.payments.push(payment);
  if(loan.remaining<=0){
    loan.remaining=0;
    loan.status='paid';
    loan.paidAt=Date.now();
  }
  await put('loans',loan);
  await auditLog('loan_payment',`Pago de préstamo a ${loan.lender}`,{
    loanId:id,amount:payment.amount,method,dayDate:payment.dayDate,remaining:loan.remaining
  });
  closeSheet();
  render();
  toast(loan.status==='paid'?'Préstamo pagado':'Pago parcial registrado');
}

async function moveClient(id,dir){
  const active=state.clients.filter(c=>c.active!==false).sort((a,b)=>(a.order||999)-(b.order||999));
  const i=active.findIndex(c=>c.id===id),j=i+dir;
  if(i<0||j<0||j>=active.length)return;
  [active[i],active[j]]=[active[j],active[i]];
  for(let k=0;k<active.length;k++){active[k].order=k+1;active[k].updatedAt=Date.now();await put('clients',active[k])}
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  await auditLog('route_reordered','Orden de ruta modificado',{clientId:id,direction:dir});
  showRouteOrder();
}

    <button class="btn secondary" style="margin-top:10px" onclick="showImportCenter()">VOLVER</button>`);
}
async function applyClientImport(){
  const draft=state.importDraft;
  if(!draft||!draft.items.length)return toast('No hay datos válidos');
  if(state.day&&state.day.status!=='closed')return toast('Cerrá el día activo antes de modificar saldos');
  const policy=document.getElementById('importPolicy').value;
  if(!confirm(`¿Aplicar ${draft.items.length} registros?`))return;
  let created=0,updated=0,unchanged=0;
  for(const item of draft.items){
    const existing=importMatch(item);
    if(!existing){
      const client={id:crypto.randomUUID?.()||'cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:item.name,balance:item.balance,order:item.order,active:item.active,phone:item.phone||'',address:item.address||'',routeNote:item.routeNote||'',notes:'',createdAt:Date.now(),updatedAt:Date.now()};
      state.clients.push(client);await put('clients',client);created++;continue;
    }
    if(policy==='create'){unchanged++;continue}
    const before=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(policy==='balance')existing.balance=item.balance;
    else{existing.name=item.name;existing.balance=item.balance;existing.order=item.order;existing.active=item.active;if(item.phone)existing.phone=item.phone;if(item.address)existing.address=item.address;if(item.routeNote)existing.routeNote=item.routeNote}
    existing.updatedAt=Date.now();
    const after=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(before!==after){await put('clients',existing);updated++}else unchanged++;
  }
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  const record={id:'im_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),source:draft.source,total:draft.items.length,created,updated,unchanged,errors:draft.errors,policy,createdAt:Date.now()};
  state.imports.unshift(record);await put('imports',record);
  await auditLog('clients_imported','Importación de clientes aplicada',{...record});
  state.importDraft=null;closeSheet();render();toast(`Importación lista: ${created} creados, ${updated} actualizados`);
}

function auditCategoryFor(action=''){
  if(action.startsWith('payment_'))return 'payments';
  if(action.startsWith('route_')||action.startsWith('followup_'))return 'route';
  if(action.startsWith('day_')||action.startsWith('reconciliation_')||action.startsWith('opening_cash_'))return 'closing';
  if(action.includes('import')||action.startsWith('accreditation'))return 'imports';
  if(action.startsWith('client_')||action.startsWith('loan_')||action.startsWith('expense_'))return 'records';
  if(action.includes('backup')||action.includes('restore')||action.includes('snapshot')||action.includes('storage'))return 'security';
  if(action.includes('integrity')||action.includes('repair')||action.includes('self_test')||action.includes('diagnostic')||action==='render_error')return 'system';
  if(action.startsWith('report_')||action.includes('exported'))return 'exports';
  return 'other';
}

function filteredAuditRows(){
  const search=normalizeClientKey(state.auditSearch||'');
  const category=state.auditCategory||'all';
  const period=state.auditPeriod||'30';
  const now=Date.now();
  const cutoff=period==='all'?0:now-Number(period)*86400000;
  return state.audit.filter(entry=>{
    if(cutoff&&Number(entry.createdAt||0)<cutoff)return false;
    if(category!=='all'&&auditCategoryFor(entry.action)!==category)return false;
    if(!search)return true;
    const client=auditClientName(entry);
    const haystack=normalizeClientKey([
      entry.action,
      entry.detail,
      client,
      auditDayDate(entry),
      JSON.stringify(entry.meta||{})
    ].join(' '));
    return haystack.includes(search);
  });
}
function auditStats(rows){
  const today=dateKey();
  const todayCount=rows.filter(entry=>dateKey(new Date(Number(entry.createdAt||0)))===today).length;
  const errors=rows.filter(entry=>entry.action==='render_error'||auditCategoryFor(entry.action)==='system'&&String(entry.detail||'').toLowerCase().includes('error')).length;
  const clients=new Set(rows.map(auditClientName).filter(Boolean)).size;
  return {total:rows.length,today:todayCount,errors,clients};
}

    `Generado: ${new Date().toLocaleString('es-AR')}`,
    `Categoría: ${auditCategoryLabel(state.auditCategory)}`,
    `Período: ${state.auditPeriod==='all'?'Todo el historial':state.auditPeriod+' días'}`,
    `Eventos: ${rows.length}`,
    ''
  ];
  rows.forEach((entry,index)=>{
    lines.push(`${index+1}. ${formatDateTime(entry.createdAt)} | ${auditActionLabel(entry.action)}`);
    lines.push(`   ${entry.detail||'Sin descripción'}`);
    if(auditClientName(entry))lines.push(`   Cliente: ${auditClientName(entry)}`);
    if(auditDayDate(entry))lines.push(`   Jornada: ${auditDayDate(entry)}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_auditoria_${dateKey()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('audit_exported','Auditoría TXT exportada',{records:rows.length,category:state.auditCategory,period:state.auditPeriod});
  toast('Auditoría TXT exportada');
}
function showAudit(){
  const rows=filteredAuditRows();
  const stats=auditStats(rows);
  const limited=rows.slice(0,300);
  openSheet(`<div class="sheet-handle"></div>
    <div class="toolbar"><div><h2>Auditoría</h2><div class="note">Trazabilidad de operaciones importantes</div></div><span class="badge">${rows.length}</span></div>
    <div class="grid2" style="margin-top:12px">
      <div class="stat"><span class="muted">Eventos filtrados</span><b>${stats.total}</b></div>
      <div class="stat"><span class="muted">Eventos de hoy</span><b>${stats.today}</b></div>
      <div class="stat"><span class="muted">Clientes involucrados</span><b>${stats.clients}</b></div>
      <div class="stat"><span class="muted">Errores detectados</span><b>${stats.errors}</b></div>
    </div>
    <div class="field"><label>Buscar</label><input id="auditSearch" class="input" value="${escapeHtml(state.auditSearch)}" placeholder="Acción, cliente, jornada o detalle" oninput="state.auditSearch=this.value"></div>
    <div class="grid2">
      <div class="field"><label>Categoría</label><select id="auditCategory" class="input">
        ${['all','payments','route','closing','imports','records','security','system','exports','other'].map(category=>`<option value="${category}" ${state.auditCategory===category?'selected':''}>${auditCategoryLabel(category)}</option>`).join('')}
      </select></div>
      <div class="field"><label>Período</label><select id="auditPeriod" class="input">
        <option value="7" ${state.auditPeriod==='7'?'selected':''}>Últimos 7 días</option>
        <option value="30" ${state.auditPeriod==='30'?'selected':''}>Últimos 30 días</option>
        <option value="90" ${state.auditPeriod==='90'?'selected':''}>Últimos 90 días</option>
        <option value="all" ${state.auditPeriod==='all'?'selected':''}>Todo el historial</option>
      </select></div>
    </div>
    <div class="actions"><button class="btn" onclick="setAuditFilters()">APLICAR FILTROS</button><button class="btn secondary" onclick="clearAuditFilters()">LIMPIAR</button></div>
    <div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="exportAuditCsv()">EXPORTAR CSV</button><button class="btn secondary" onclick="exportAuditTxt()">EXPORTAR TXT</button></div>
    <h3 style="margin-top:18px">Eventos</h3>
    ${limited.length?limited.map(entry=>`<div class="client-row" onclick="showAuditDetail('${entry.id}')">
      <div><div class="client-name">${escapeHtml(auditActionLabel(entry.action))}</div>
      <div class="note">${formatDateTime(entry.createdAt)} · ${escapeHtml(auditCategoryLabel(auditCategoryFor(entry.action)))}${auditClientName(entry)?' · '+escapeHtml(auditClientName(entry)):''}</div>
      <div class="note">${escapeHtml(entry.detail||'Sin descripción')}</div></div><div>›</div>
    </div>`).join(''):'<div class="card"><p class="muted">No hay eventos que coincidan con los filtros.</p></div>'}
    ${rows.length>300?`<p class="note">Se muestran los primeros 300 de ${rows.length} eventos. Usá los filtros o exportá el resultado completo.</p>`:''}`);
}
function showSettings(){openSheet(`<div class="sheet-handle"></div><h2>Configuración</h2><div class="field"><label>Capital fijo</label><input id="settingCapital" class="input" inputmode="numeric" value="${state.settings.capital}"></div><div class="field"><label>Adelanto PIN</label><input id="settingPin" class="input" inputmode="numeric" value="${state.settings.pinAdvance}"></div><div class="field"><label>Descuento bancario habitual</label><input id="settingBankDiscount" class="input" inputmode="decimal" value="${state.settings.bankDiscountDefault||0}"><div class="note" style="margin-top:6px">Se precarga en cada jornada y puede modificarse.</div></div><div class="field"><label>Plantilla de WhatsApp</label><textarea id="settingWhatsapp" class="input" style="min-height:110px">${escapeHtml(state.settings.whatsappTemplate)}</textarea><div class="note" style="margin-top:6px">Variables: {cliente}, {monto}, {fecha}</div></div><div class="card"><div class="eyebrow">CRONOGRAMA HABITUAL</div><p class="note">Configurá rutas sugeridas por día. No son obligatorias.</p><div class="actions"><button class="btn small secondary" onclick="closeSheet();setTimeout(()=>configureRouteSchedule('mon'),50)">LUNES</button><button class="btn small secondary" onclick="closeSheet();setTimeout(()=>configureRouteSchedule('wed'),50)">MIÉRCOLES</button><button class="btn small secondary" onclick="closeSheet();setTimeout(()=>configureRouteSchedule('fri'),50)">VIERNES</button></div></div><button class="btn" onclick="saveSettings()">GUARDAR CONFIGURACIÓN</button>`)}
async function saveSettings(){state.settings.capital=Number(document.getElementById('settingCapital').value.replace(/\D/g,''))||0;state.settings.pinAdvance=Number(document.getElementById('settingPin').value.replace(/\D/g,''))||0;state.settings.bankDiscountDefault=Math.max(0,parseMoneyInput(document.getElementById('settingBankDiscount').value));state.settings.whatsappTemplate=document.getElementById('settingWhatsapp').value.trim()||'Buen día el total es {monto}';for(const [key,value] of Object.entries(state.settings))await put('settings',{key,value});await auditLog('settings_updated','Configuración actualizada');closeSheet();render();toast('Configuración guardada')}
async function exportBackup(){
  try{
    const [clients,days,settings,loans,audit,expenses,reconciliations,imports]=await Promise.all([
      getAll('clients'),getAll('days'),getAll('settings'),getAll('loans'),
      getAll('audit'),getAll('expenses'),getAll('reconciliations'),getAll('imports')
    ]);
    const exportedAt=new Date().toISOString();
    const payload={version:58,exportedAt,clients,days,settings,loans,audit,expenses,reconciliations,imports};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='CML_Virtual_backup_'+dateKey()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    state.settings.lastBackupAt=Date.now();
    await put('settings',{key:'lastBackupAt',value:state.settings.lastBackupAt});
    await auditLog('backup_exported','Backup JSON generado',{version:58,records:clients.length+days.length+loans.length+expenses.length});
    toast('Backup generado');
    if(state.tab==='more')render();
  }catch(error){
    console.error(error);
    toast('No se pudo generar el backup');
  }
}
function openRestore(){
  openSheet(`<div class="sheet-handle"></div><h2>Restaurar backup</h2>
    <p class="note">El archivo se validará antes de modificar la base. Los registros con el mismo identificador serán reemplazados.</p>
    <input id="restoreFile" type="file" accept=".json,application/json" class="input" onchange="previewRestoreBackup()">
    <div id="restorePreview" class="card" style="margin-top:12px"><p class="muted">Seleccioná un archivo para analizarlo.</p></div>
    <button id="restoreButton" class="btn danger" style="margin-top:12px" onclick="restoreBackup()" disabled>RESTAURAR DATOS</button>`);
}
async function previewRestoreBackup(){
  const file=document.getElementById('restoreFile')?.files?.[0];
  const preview=document.getElementById('restorePreview');
  const button=document.getElementById('restoreButton');
  if(!file||!preview||!button)return;
  try{
    const data=JSON.parse(await file.text());
    const errors=validateBackupStructure(data);
    window.__cmlRestorePreview=data;
    if(errors.length){
      preview.innerHTML=`<div class="eyebrow">ARCHIVO INVÁLIDO</div>${errors.slice(0,12).map(error=>`<p class="danger-text">${escapeHtml(error)}</p>`).join('')}${errors.length>12?`<p class="note">Y ${errors.length-12} error(es) adicionales.</p>`:''}`;
      button.disabled=true;
      return;
    }
    preview.innerHTML=`<div class="eyebrow">ARCHIVO VÁLIDO</div>
      <div class="toolbar"><span>Versión</span><b>${escapeHtml(data.version??'No indicada')}</b></div>
      <div class="toolbar"><span>Exportado</span><b>${escapeHtml(data.exportedAt?new Date(data.exportedAt).toLocaleString('es-AR'):'Sin fecha')}</b></div>
      <div class="toolbar"><span>Clientes</span><b>${data.clients.length}</b></div>
      <div class="toolbar"><span>Jornadas</span><b>${data.days.length}</b></div>
      <div class="toolbar"><span>Préstamos</span><b>${(data.loans||[]).length}</b></div>
      <div class="toolbar"><span>Gastos</span><b>${(data.expenses||[]).length}</b></div>
      <p class="positive-text"><b>La estructura del backup es consistente.</b></p>`;
    button.disabled=false;
  }catch(error){
    window.__cmlRestorePreview=null;
    preview.innerHTML='<p class="danger-text">El archivo no contiene JSON válido.</p>';
    button.disabled=true;
  }
}
async function restoreBackup(){
  const file=document.getElementById('restoreFile')?.files?.[0];
  if(!file)return toast('Seleccioná un archivo');
  try{
    const data=window.__cmlRestorePreview||JSON.parse(await file.text());
    const errors=validateBackupStructure(data);
    if(errors.length)return toast('El backup contiene errores');
    if(!confirm(`¿Restaurar ${data.clients.length} clientes y ${data.days.length} jornadas?`))return;
    await createEmergencySnapshot('before_external_restore',true);
    for(const c of data.clients)await put('clients',c);
    for(const d of data.days)await put('days',d);
    for(const s of data.settings||[])await put('settings',s);
    for(const l of data.loans||[])await put('loans',l);
    for(const a of data.audit||[])await put('audit',a);
    for(const e of data.expenses||[])await put('expenses',e);
    for(const r of data.reconciliations||[])await put('reconciliations',r);
    for(const i of data.imports||[])await put('imports',i);
    await put('settings',{key:'lastRestoreAt',value:Date.now()});
    await auditLog('backup_restored','Backup restaurado',{version:data.version||null,clients:data.clients.length,days:data.days.length});
    location.reload();
  }catch(error){
    console.error(error);
    toast('No se pudo restaurar el backup');
  }
}

let sheetHistoryActive=false;

function openSheet(html){
  const sheet=document.getElementById('sheet');
  const backdrop=document.getElementById('sheetBackdrop');
  if(!sheet||!backdrop)return;

  sheet.innerHTML=`<div class="sheet-close"><button type="button" aria-label="Cerrar menú" onclick="closeSheet()">×</button></div>${html}`;
  backdrop.classList.add('show');
  document.body.classList.add('sheet-open');
  sheet.scrollTop=0;

  if(!sheetHistoryActive){
    history.pushState({cmlSheet:true},'',location.href);
    sheetHistoryActive=true;
  }
}

function closeSheet(options={}){
  const backdrop=document.getElementById('sheetBackdrop');
  if(!backdrop||!backdrop.classList.contains('show'))return;

  backdrop.classList.remove('show');
  document.body.classList.remove('sheet-open');

  if(sheetHistoryActive&&!options.fromPopState){
    sheetHistoryActive=false;
    history.back();
  }else{
    sheetHistoryActive=false;
  }
}

window.addEventListener('popstate',()=>{
  const backdrop=document.getElementById('sheetBackdrop');
  if(backdrop?.classList.contains('show')){
    closeSheet({fromPopState:true});
  }
});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

init().catch(err=>{
  console.error(err);
  alert('No se pudo actualizar la base local de CML Virtual. Cerrá todas las pestañas donde esté abierta la app y abrí nuevamente este archivo. Tus datos anteriores no se borraron.');
});
