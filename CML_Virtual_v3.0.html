<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#06090D" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CML Virtual</title>
  <style>
    :root{
      --bg:#0F1923;--surface:#172332;--surface-2:#1E2D3E;--border:#2D4055;
      --text:#F1F5F9;--muted:#94A3B8;--primary:#3B82F6;--primary-2:#2563EB;
      --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;--radius:18px;
      --shadow:0 12px 28px rgba(0,0,0,.26);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    .header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border);background:rgba(15,25,35,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .header h1{font-size:18px;margin:0}
    .header .date{font-size:12px;color:var(--muted);text-align:right}
    main{overflow:auto;padding:16px 16px 28px}
    .tabbar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#101A25;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .tab{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px;font-weight:700}
    .tab span{display:block;font-size:20px;margin-bottom:3px}
    .tab.active{color:var(--text);background:var(--surface-2)}
    .card{background:linear-gradient(180deg,var(--surface),#14202C);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .card h2,.card h3{margin:0 0 8px}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}
    .muted{color:var(--muted)}
    .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;color:white;background:var(--primary)}
    .btn:active{transform:scale(.99)}
    .btn.secondary{background:var(--surface-2);border:1px solid var(--border)}
    .btn.success{background:var(--success);color:#06240f}
    .btn.danger{background:var(--danger)}
    .btn.small{width:auto;padding:9px 12px;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
    .stat b{display:block;font-size:18px;margin-top:4px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
    .step{padding:9px 5px;text-align:center;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:800}
    .step.active{color:#fff;background:#1D4ED8;border-color:#3B82F6}
    .client-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(148,163,184,.12)}
    .client-row:last-child{border-bottom:0}
    .client-name{font-weight:800}
    .money{font-variant-numeric:tabular-nums;font-weight:800}
    .badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}
    .badge.pending{background:rgba(239,68,68,.15);color:#FCA5A5}
    .badge.partial{background:rgba(245,158,11,.15);color:#FCD34D}
    .badge.paid{background:rgba(34,197,94,.15);color:#86EFAC}
    .field{margin:12px 0}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
    .input{width:100%;border:1px solid var(--border);background:#0D1721;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}
    .input:focus{border-color:var(--primary)}
    .empty{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .empty-icon{font-size:48px;margin-bottom:10px}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .search{flex:1}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.56);display:none;align-items:flex-end;z-index:50;overscroll-behavior:contain}
    .sheet-backdrop.show{display:flex}
    .sheet{
      position:relative;
      width:100%;
      height:min(88dvh,88vh);
      max-height:min(88dvh,88vh);
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
      background:#13202C;
      border-radius:24px 24px 0 0;
      border:1px solid var(--border);
      padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    }
    .sheet-handle{width:44px;height:5px;border-radius:99px;background:#42566E;margin:0 auto 16px}
    .sheet-close{
      position:sticky;
      top:0;
      z-index:8;
      display:flex;
      justify-content:flex-end;
      height:0;
      pointer-events:none;
    }
    .sheet-close button{
      pointer-events:auto;
      transform:translateY(-6px);
      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid var(--border);
      background:#203246;
      color:#fff;
      font-size:25px;
      line-height:1;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
    }
    body.sheet-open{overflow:hidden;touch-action:none}
    .toast{position:fixed;left:16px;right:16px;bottom:92px;background:#172332;border:1px solid var(--border);padding:13px 14px;border-radius:14px;display:none;z-index:100;box-shadow:var(--shadow)}
    .toast.show{display:block}
    .splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .logo{width:82px;height:82px;border-radius:22px;background:var(--surface-2);border:2px solid var(--border);display:grid;place-items:center;font-size:36px}
    .progress{width:210px;height:6px;background:var(--surface);border-radius:99px;overflow:hidden}
    .progress>i{display:block;height:100%;width:0;background:var(--primary);animation:load 1s ease forwards}
    @keyframes load{to{width:100%}}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 10px}
    .section-title h2{font-size:16px;margin:0}
    .note{font-size:12px;line-height:1.45;color:var(--muted)}
    .hidden{display:none!important}
  
  .original-daily-load{max-width:480px;margin:0 auto;padding-bottom:24px}
  .original-title{font-size:18px;color:#6fb1ff;margin:0 0 4px;font-weight:700}
  .original-subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .original-section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .original-section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px;padding:10px 14px;border-radius:10px 10px 0 0}
  .original-client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .original-client-row:last-child{border-bottom:none}
  .original-client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .original-client-fields{display:flex;gap:6px}
  .original-field-group{flex:1;min-width:0}
  .original-field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .original-field-group input,.original-field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px;min-height:38px}
  .original-field-group select{font-size:11px;padding:7px 2px}
  .original-balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .original-balance-label{flex:1.4;font-size:13px;color:#ddd}
  .original-balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .original-hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .original-total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}
  .original-result{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .original-copy-btn{background:#1F7A1F!important;margin-top:8px}
  .original-alert{display:none}


  .carga-diaria-original{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0f1115;
    color:#e8e8e8;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .carga-diaria-original *{box-sizing:border-box}
  .carga-diaria-original h1{font-size:18px;color:#6fb1ff;margin:0 0 4px 0}
  .carga-diaria-original .subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .carga-diaria-original .section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .carga-diaria-original .section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px -14px;padding:10px 14px;border-radius:10px 10px 0 0}
  .carga-diaria-original .client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .carga-diaria-original .client-row:last-child{border-bottom:none}
  .carga-diaria-original .client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .carga-diaria-original .client-fields{display:flex;gap:6px}
  .carga-diaria-original .field-group{flex:1;min-width:0}
  .carga-diaria-original .field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .carga-diaria-original .field-group input,
  .carga-diaria-original .field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px}
  .carga-diaria-original .field-group select{font-size:11px;padding:7px 2px}
  .carga-diaria-original .balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .carga-diaria-original .balance-label{flex:1.4;font-size:13px;color:#ddd}
  .carga-diaria-original .balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .carga-diaria-original button{width:100%;padding:14px;border-radius:10px;border:none;background:#2E75B6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .carga-diaria-original button:active{background:#1F4E78}
  .carga-diaria-original #resultado{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .carga-diaria-original .copy-btn{background:#1F7A1F;margin-top:8px}
  .carga-diaria-original .copy-btn:active{background:#155c15}
  .carga-diaria-original .alerta-monto{margin-top:12px;background:#3a1a1a;border:1px solid #c00;border-radius:8px;padding:10px 12px;font-size:12px;color:#ff8080;display:none}
  .carga-diaria-original .alerta-monto strong{color:#ff4444;display:block;margin-bottom:4px}
  .carga-diaria-original input.campo-alerta{border-color:#c00!important;background:#1a0a0a!important}
  .carga-diaria-original .hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .carga-diaria-original .total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}


.client-load-row{border-bottom:1px solid #2A3541;padding:10px 0}
.client-load-row summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font-size:16px}
.client-load-row summary small{display:block;color:#8F9BAB;font-weight:500;margin-top:3px}
.client-load-row[open] summary{margin-bottom:10px}


.close-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.close-flow{margin-top:14px}
.close-flow-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.14)}
.close-flow-row:last-child{border-bottom:0}
.close-flow-row strong{font-variant-numeric:tabular-nums;text-align:right}
.close-flow-row.net{margin-top:4px;padding-top:14px;font-size:17px}
.close-flow-row.net strong{font-size:20px}
.reconciliation-status{border-radius:14px;padding:14px 16px;margin-bottom:14px}
.reconciliation-status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.38)}
.reconciliation-status.error{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.42)}
.reconciliation-status-title{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.reconciliation-status-detail{margin-top:8px}
@media(max-width:390px){
  .close-summary{grid-template-columns:1fr}
}


/* =========================================================
   CML VIRTUAL v1.44 — PULIDO VISUAL PROFESIONAL
   Solo presentación. No modifica lógica ni almacenamiento.
   ========================================================= */
:root{
  --bg:#0B141D;
  --surface:#132130;
  --surface-2:#1A2B3D;
  --surface-3:#203448;
  --border:#2B4157;
  --border-soft:rgba(148,163,184,.13);
  --text:#F5F7FA;
  --muted:#9AA9BA;
  --primary:#3984F6;
  --primary-2:#2569D8;
  --success:#20C567;
  --warning:#F1A928;
  --danger:#EF5350;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 8px 22px rgba(0,0,0,.18);
  --shadow-sheet:0 -18px 42px rgba(0,0,0,.38);
}

html,body{
  background:var(--bg);
  color:var(--text);
  font-size:16px;
  line-height:1.42;
  text-rendering:optimizeLegibility;
}

body{
  letter-spacing:-.005em;
}

.header{
  min-height:68px;
  padding:calc(11px + env(safe-area-inset-top)) 18px 11px;
  background:rgba(11,20,29,.96);
  border-bottom:1px solid rgba(107,139,171,.24);
  box-shadow:0 6px 18px rgba(0,0,0,.12);
}

.header h1{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.025em;
}

.header .date{
  font-size:12px;
  line-height:1.25;
}

main{
  padding:18px 16px 34px;
  scroll-padding-bottom:110px;
}

.card{
  background:var(--surface);
  border:1px solid rgba(92,126,159,.42);
  border-radius:var(--radius);
  padding:17px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.card + .card{margin-top:2px}
.card h2{font-size:21px;line-height:1.18;letter-spacing:-.025em}
.card h3{font-size:18px;line-height:1.22;letter-spacing:-.015em}

.eyebrow{
  color:#91A5BA;
  font-size:11px;
  letter-spacing:.105em;
  line-height:1.2;
}

.note{
  font-size:13px;
  line-height:1.48;
}

.section-title{
  margin:20px 3px 10px;
  align-items:center;
}

.section-title h2{
  font-size:17px;
  letter-spacing:-.015em;
}

.grid2{
  gap:11px;
}

.stat{
  min-height:104px;
  padding:15px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:var(--surface-2);
  border:1px solid rgba(96,131,166,.36);
  border-radius:14px;
}

.stat .muted,.stat>span{
  font-size:14px;
  line-height:1.25;
}

.stat b{
  font-size:22px;
  line-height:1.15;
  letter-spacing:-.02em;
  margin-top:7px;
  font-variant-numeric:tabular-nums;
}

.btn{
  min-height:52px;
  border-radius:13px;
  padding:13px 17px;
  font-size:15px;
  letter-spacing:.005em;
  box-shadow:none;
  transition:transform .12s ease,filter .12s ease,background .12s ease;
}

.btn:active{
  transform:scale(.985);
  filter:brightness(.94);
}

.btn.secondary{
  background:var(--surface-2);
  border:1px solid rgba(96,131,166,.48);
}

.btn.small{
  min-height:42px;
  padding:9px 13px;
  font-size:13px;
}

.btn.success{
  color:#052713;
  background:var(--success);
}

.actions{
  gap:9px;
}

.input,
input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea{
  min-height:50px;
  border-radius:13px;
  border-color:rgba(96,131,166,.54);
  background:#0D1924;
  color:var(--text);
  font-variant-numeric:tabular-nums;
}

.input:focus,
input:focus,
select:focus,
textarea:focus{
  border-color:#5595F7;
  box-shadow:0 0 0 3px rgba(59,130,246,.14);
  outline:none;
}

.field{
  margin:15px 0;
}

.field label{
  font-size:13px;
  color:#A7B5C5;
  margin-bottom:7px;
}

.toolbar{
  gap:12px;
}

.client-row{
  padding:16px 0;
  gap:14px;
  border-bottom-color:var(--border-soft);
}

.client-name{
  font-size:16px;
  line-height:1.25;
  letter-spacing:-.01em;
}

.money{
  font-size:18px;
  letter-spacing:-.012em;
}

.badge{
  padding:6px 9px;
  font-size:10px;
  letter-spacing:.025em;
}

.steps{
  gap:8px;
  margin-bottom:16px;
}

.step{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 7px;
  border-radius:13px;
  font-size:11px;
  line-height:1.3;
  background:var(--surface);
  border-color:rgba(96,131,166,.43);
}

.step.active{
  background:linear-gradient(180deg,#2F6FE5,#265CC8);
  border-color:#4D91FF;
  box-shadow:0 7px 18px rgba(37,99,235,.22);
}

.tabbar{
  min-height:82px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(12,22,31,.98);
  border-top:1px solid rgba(104,137,168,.28);
  box-shadow:0 -10px 28px rgba(0,0,0,.2);
  gap:7px;
}

.tab{
  min-height:62px;
  padding:7px 3px;
  border-radius:14px;
  font-size:11px;
  transition:background .14s ease,color .14s ease;
}

.tab span{
  font-size:22px;
  margin-bottom:2px;
}

.tab.active{
  background:var(--surface-2);
  color:#FFF;
  box-shadow:inset 0 0 0 1px rgba(102,139,174,.22);
}

.sheet-backdrop{
  background:rgba(0,0,0,.66);
  backdrop-filter:blur(2px);
}

.sheet{
  height:min(91dvh,91vh);
  max-height:min(91dvh,91vh);
  padding:18px 17px calc(30px + env(safe-area-inset-bottom));
  border-radius:25px 25px 0 0;
  background:#101E2B;
  border-color:rgba(94,130,165,.52);
  box-shadow:var(--shadow-sheet);
}

.sheet-handle{
  width:46px;
  background:#50667D;
  margin-bottom:18px;
}

.sheet-close button{
  width:44px;
  height:44px;
  background:#20364B;
  border-color:rgba(104,141,177,.5);
}

.toast{
  left:14px;
  right:14px;
  bottom:96px;
  padding:14px 16px;
  border-radius:13px;
  background:#182A3A;
}

.divider{
  border-color:var(--border-soft)!important;
}

/* Carga diaria: integra la sección histórica con el diseño actual */
.carga-diaria-original{
  max-width:560px;
  background:transparent;
  color:var(--text);
  font-family:inherit;
}

.carga-diaria-original h1{
  color:#73AEFF;
  font-size:21px;
  letter-spacing:-.02em;
  margin-bottom:3px;
}

.carga-diaria-original .subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
}

.carga-diaria-original .section{
  background:var(--surface);
  border:1px solid rgba(92,126,159,.42);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.carga-diaria-original .section-title{
  margin:-16px -16px 14px;
  padding:12px 16px;
  border-radius:15px 15px 0 0;
  background:#235A89;
  color:#FFF;
  font-size:14px;
  letter-spacing:.015em;
}

.carga-diaria-original .balance-row{
  gap:12px;
  margin-bottom:11px;
}

.carga-diaria-original .balance-label{

:root{
  --surface-glass:rgba(19,33,48,.92);
  --primary-soft:rgba(57,132,246,.13);

}

html,body{

}

.header{
  background:linear-gradient(180deg,rgba(13,25,36,.98),rgba(10,20,29,.96));
  border-bottom-color:rgba(114,151,188,.2);
}

.brand-mark{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(135,185,255,.38);
}
.brand-mark::after{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  pointer-events:none;
}

main{
  animation:cmlViewIn .2s ease-out;
}

@keyframes cmlViewIn{
  from{opacity:.3;transform:translateY(4px)}
  to{opacity:1;transform:none}
}

.card{
  background:
    linear-gradient(145deg,rgba(30,49,68,.38),transparent 48%),
    var(--surface-glass);
  border-color:rgba(92,126,159,.38);
  box-shadow:
    0 10px 26px rgba(0,0,0,.17),
    inset 0 1px 0 rgba(255,255,255,.018);
}

.card:has(.btn:active){
  border-color:rgba(86,145,222,.46);
}

.section-title{
  position:relative;
  padding-left:12px;
}
.section-title::before{
  content:"";
  position:absolute;
  left:0;
  top:3px;
  bottom:3px;
  width:3px;
  border-radius:99px;
  background:linear-gradient(180deg,#55A0FF,#2C6ED8);
}
.section-title h2{
  color:#EFF6FF;
  font-size:15px;
  letter-spacing:.035em;
}

.btn{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(119,173,255,.2);
  background:linear-gradient(180deg,#438CF7,#3177E7);
  box-shadow:0 7px 17px rgba(31,91,181,.17);
}
.btn::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 45%);
  pointer-events:none;
}
.btn.secondary{
  background:linear-gradient(180deg,#203448,#192B3C);
  border-color:rgba(104,143,181,.42);

.btn.success{

  border-color:rgba(105,238,157,.25);

}
.btn:disabled{
  opacity:.48;
  filter:saturate(.6);
  box-shadow:none;
}

.input,
input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea{
  box-shadow:inset 0 1px 3px rgba(0,0,0,.16);
}

.badge{
  border:1px solid currentColor;
  border-color:color-mix(in srgb,currentColor 22%,transparent);

.badge.pending{background:rgba(239,83,80,.11)}

.stat{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(58,93,127,.18),transparent 55%),
    var(--surface-2);
}
.stat::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(160,198,237,.16),transparent);

  overflow:hidden;
  padding:19px;

}

  content:"";

.compact-metrics{

}

  overflow:hidden;
}

.profit-panel{

    radial-gradient(circle at 100% 0,rgba(57,132,246,.13),transparent 42%),

}

  position:absolute;
  left:28%;

  height:2px;
  border-radius:99px;

    #101E2B;

  }

    linear-gradient(180deg,#040810,#06101A 52%,#040A11);
  color:var(--text);
}

body{
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:-.008em;
}

.header{
  min-height:72px;
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;
  background:rgba(5,10,17,.94);
  border-bottom:1px solid rgba(151,174,198,.10);
  box-shadow:none;
  backdrop-filter:blur(18px);
}

.brand{gap:11px}
.brand-mark{
  width:43px;
  height:43px;
  border-radius:14px;
  background:linear-gradient(145deg,#37E0B5,#16A982);
  color:#03110D;
  font-size:10px;
  font-weight:950;
  letter-spacing:.09em;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 30px rgba(45,212,167,.18);
}
.brand-subtitle{
  color:#718096;
  font-size:10px;
  letter-spacing:.055em;
}
.header h1{font-size:19px}
.header .date{color:#A7B4C2}

main{
  padding:18px 15px 34px;
}

.card{
  background:
    linear-gradient(145deg,rgba(28,47,66,.22),transparent 55%),
    rgba(13,22,34,.96);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.18);
}

.eyebrow{
  color:#7D8CA0;
  font-size:10px;
  letter-spacing:.12em;
}

.section-title{
  margin:24px 2px 10px;
  padding:0;
}
.section-title::before{display:none}
.section-title h2{
  color:#DCE5EE;
  font-size:12px;
  letter-spacing:.105em;
}

.btn{
  min-height:50px;
  border-radius:15px;
  border:1px solid rgba(45,212,167,.24);
  background:linear-gradient(180deg,#35DDB1,#1FC399);
  color:#041511;
  font-weight:900;
  box-shadow:0 10px 24px rgba(20,185,142,.16);
}
.btn::after{display:none}
.btn.secondary{
  background:#121F2D;
  color:#E8EDF3;
  border:1px solid rgba(151,174,198,.15);
  box-shadow:none;
}
.btn.success{
  background:linear-gradient(180deg,#35DDB1,#1FC399);
  color:#041511;
}
.btn.danger{
  background:#D95555;
  color:#240707;
}
.btn.small{
  min-height:42px;
  font-size:12px;
}

.input,
input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea{
  min-height:50px;
  border-radius:14px;
  background:#08111B;
  border:1px solid rgba(151,174,198,.16);
  color:#F8FAFC;
  box-shadow:none;
}
.input:focus,
input:focus,
select:focus,
textarea:focus{
  border-color:#2DD4A7;
  box-shadow:0 0 0 3px rgba(45,212,167,.10);
}

.steps{
  padding:5px;
  gap:4px;
  background:#08111B;
  border:1px solid rgba(151,174,198,.09);
  border-radius:17px;
}
.step{
  min-height:59px;
  background:transparent;
  border:0;
  border-radius:13px;
  color:#617083;
}
.step.active{
  background:#132333;
  border:1px solid rgba(45,212,167,.18);
  color:#E9FFF8;
  box-shadow:none;
}

.badge{
  border:0;
  padding:6px 9px;
  font-size:9px;
  letter-spacing:.065em;
}
.badge.paid{background:rgba(45,212,167,.13);color:#67E9C8}
.badge.partial{background:rgba(243,180,65,.14);color:#F5C96E}
.badge.pending{background:rgba(240,100,100,.14);color:#F49A9A}
.badge.info{background:rgba(77,163,255,.13);color:#82BFFF}

.tabbar{
  min-height:82px;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(6,14,23,.97);
  border-top:1px solid rgba(151,174,198,.11);
  box-shadow:0 -16px 40px rgba(0,0,0,.3);
  backdrop-filter:blur(18px);
}
.tab{
  min-height:62px;
  border-radius:15px;
  color:#68778A;
}
.tab.active{
  background:#112130;
  color:#39DCB4;
  box-shadow:inset 0 0 0 1px rgba(45,212,167,.13);
}
.tab.active::after{
  left:31%;
  right:31%;
  bottom:3px;
  height:2px;
  background:#2DD4A7;
  box-shadow:0 0 10px rgba(45,212,167,.45);
}
.tab-icon svg{width:22px;height:22px}

/* Inicio / ruta activa */
.home-hero{
  position:relative;
  overflow:hidden;
  padding:22px 20px 19px;
  margin-bottom:13px;
  border-radius:23px;
  background:
    radial-gradient(circle at 94% 3%,rgba(45,212,167,.18),transparent 38%),
    linear-gradient(150deg,#0C2630,#0A1825 58%,#09131E);
  border:1px solid rgba(45,212,167,.34);
  box-shadow:0 18px 42px rgba(0,0,0,.24);
}
.home-hero::after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-110px;
  top:-120px;
  border-radius:50%;
  border:30px solid rgba(45,212,167,.05);
}
.home-hero-label{
  color:#5CE4C2;
  font-size:11px;
  font-weight:900;
  letter-spacing:.11em;
}
.home-hero-amount{
  margin-top:7px;
  font-size:38px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;
}
.home-hero-sub{
  margin-top:8px;
  color:#A2AFBE;
  font-size:13px;
}
.home-progress{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:18px;
}
.home-progress-track{
  flex:1;
  height:10px;
  overflow:hidden;
  border-radius:99px;
  background:#08151F;
}
.home-progress-fill{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#28D8A9,#2ABF94);
}
.home-progress-value{
  min-width:42px;
  color:#81E9CF;
  font-size:16px;
  font-weight:900;
}
.hero-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:1px;
  margin-top:20px;
  border-top:1px solid rgba(151,174,198,.12);
}
.hero-metric{
  min-width:0;
  padding:14px 10px 2px;
  border-right:1px solid rgba(151,174,198,.11);
}
.hero-metric:last-child{border-right:0}
.hero-metric span{
  display:block;
  color:#7F8EA0;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hero-metric b{
  display:block;
  margin-top:4px;
  font-size:15px;
  line-height:1.2;
  font-variant-numeric:tabular-nums;
}

.quick-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-bottom:14px;
}
.quick-action{
  min-height:92px;
  padding:13px 9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:18px;
  background:#0E1A27;
  border:1px solid rgba(151,174,198,.12);
  color:#EAF0F6;
  text-align:center;
  font-size:11px;
  font-weight:800;
}
.quick-action:active{transform:scale(.985)}
.quick-action-icon{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(45,212,167,.13);
  color:#4EE0BC;
}
.quick-action-icon svg{
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.route-dashboard{
  padding:17px;
}
.route-dashboard-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px;
}
.route-dashboard-title{
  display:flex;
  align-items:center;
  gap:9px;
  color:#DCE5EE;
  font-size:12px;
  font-weight:900;
  letter-spacing:.09em;
}
.route-dashboard-title svg{
  width:19px;height:19px;fill:none;stroke:#49DDB8;stroke-width:2;
}
.next-client-panel{
  padding:16px;
  border-radius:17px;
  background:#091522;
  border:1px solid rgba(151,174,198,.10);
}
.next-client-label{
  color:#43D9B3;
  font-size:11px;
  font-weight:850;
}
.next-client-name{
  margin-top:5px;
  font-size:21px;
  font-weight:900;
  letter-spacing:-.02em;
}
.next-client-meta{
  margin-top:7px;
  color:#8998A9;
  font-size:12px;
  line-height:1.45;
}
.next-client-actions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  margin-top:14px;
}
.route-ring-row{
  display:grid;
  grid-template-columns:104px 1fr;
  gap:18px;
  align-items:center;
  margin-top:16px;
}
.route-ring{
  --progress:0deg;
  width:100px;
  height:100px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:conic-gradient(#2DD4A7 var(--progress),#12202E 0);
}
.route-ring::before{
  content:"";
  width:72px;
  height:72px;
  border-radius:50%;
  background:#0B1722;
}
.route-ring-text{
  position:absolute;
  text-align:center;
}
.route-ring-wrap{position:relative;width:100px;height:100px}
.route-ring-text b{
  display:block;
  font-size:23px;
}
.route-ring-text span{
  color:#7F8EA0;
  font-size:10px;
}
.route-progress-copy .percent{
  font-size:29px;
  font-weight:950;
}
.route-progress-copy .caption{
  margin-top:2px;
  color:#8B99AA;
  font-size:12px;
}

.alert-card{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding:14px;
  border-radius:16px;
  background:#0D1824;
  border:1px solid rgba(151,174,198,.10);
}
.alert-card + .alert-card{margin-top:9px}
.alert-dot{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:12px;
  font-weight:950;
}
.alert-dot.danger{background:rgba(240,100,100,.16);color:#F27878}
.alert-dot.warning{background:rgba(243,180,65,.16);color:#F3B441}

.activity-list .client-row{
  padding:13px 0;
}
.activity-amount{
  text-align:right;
  font-size:15px;
  font-weight:900;
}
.activity-method{
  margin-top:3px;
  color:#7E8D9F;
  font-size:11px;
}

.client-route-card{
  padding:15px;
  border-radius:18px;
  background:#0D1824;
  border:1px solid rgba(151,174,198,.10);
}
.client-route-card + .client-route-card{margin-top:9px}
.client-route-main{
  display:grid;
  grid-template-columns:1fr auto;
  gap:13px;
  align-items:start;
}
.client-route-name{
  font-size:16px;
  font-weight:900;
}
.client-route-meta{
  margin-top:5px;
  color:#8493A5;
  font-size:12px;
  line-height:1.45;
}
.client-route-amount{
  text-align:right;
  font-size:17px;
  font-weight:900;
}
.client-route-actions{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:12px;
}
.client-route-actions .btn{min-height:40px;padding:8px;font-size:11px}

/* Balance moderno */
.balance-hero{
  padding:22px 19px;
  border-radius:23px;
  background:
    radial-gradient(circle at 100% 0,rgba(45,212,167,.16),transparent 40%),
    linear-gradient(150deg,#0D2830,#0A1723 62%);
  border:1px solid rgba(45,212,167,.31);
  box-shadow:var(--shadow);
}
.balance-hero-label{
  color:#56DFC0;
  font-size:11px;
  font-weight:900;
  letter-spacing:.11em;
}
.balance-hero-net{
  margin-top:8px;
  font-size:39px;
  font-weight:950;
  letter-spacing:-.045em;
}
.balance-breakdown{
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid rgba(151,174,198,.12);
}
.balance-breakdown-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:6px 0;
}
.balance-breakdown-row span{color:#8D9BAD;font-size:12px}
.balance-breakdown-row b{font-size:14px}
.balance-details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:13px;
}
.balance-detail{
  min-height:91px;
  padding:14px;
  border-radius:17px;
  background:#0D1824;
  border:1px solid rgba(151,174,198,.10);
}
.balance-detail span{
  color:#7F8EA0;
  font-size:11px;
}
.balance-detail b{
  display:block;
  margin-top:7px;
  font-size:18px;
}

/* Más / herramientas */
.more-intro{
  padding:2px 2px 10px;
}
.more-intro h2{font-size:24px}
.more-intro p{color:#7F8EA0}
.menu-item{
  grid-template-columns:43px 1fr 18px;
  min-height:69px;
}
.menu-icon{
  width:41px;height:41px;
  border-radius:13px;
  background:#122131;
  color:#44D9B5;
  border:1px solid rgba(45,212,167,.10);
}
.menu-icon svg{
  width:21px;height:21px;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.menu-chevron{color:#536276}

/* Carga diaria: adaptar sin cambiar formulario */
.carga-diaria-original h1{color:#EAF8F4}
.carga-diaria-original .section{
  background:#0D1622;
  border-color:rgba(151,174,198,.11);
}
.carga-diaria-original .section-title{
  background:#132333;
  color:#EAF0F6;
}
.carga-diaria-original .total-preview{
  background:#091521;
  color:#62E3C3;
}
.profit-panel{
  background:#091521;
  border-color:rgba(45,212,167,.22);
}
.profit-row.net b{color:#62E3C3}

/* Quitar reglas viejas de orden */
.route-primary,.route-summary,.route-next,.route-progress,.route-alerts,.route-activity{
  display:block;
}
.balance-detail-grid .stat:nth-child(n+5){display:flex}

@media(max-width:390px){
  .home-hero-amount,.balance-hero-net{font-size:34px}
  .hero-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hero-metric{padding-left:6px;padding-right:6px}
  .hero-metric b{font-size:13px}
  .quick-action{min-height:86px}
}

/* Registro de cobro */

.payment-history-actions button{

}
.profile-label{
  color:#72B8FF;

.profile-name{

}
.profile-balance{

.profile-balance-value{

.profile-summary-item{

.profile-summary-item b{

.close-hero-label{

.close-hero-value{

}
.close-hero-copy{

}
.close-metrics{

}
.close-metric{

.close-block-title{

/* =========================================================
   CML VIRTUAL v2.3 — HERRAMIENTAS Y MÓDULOS SECUNDARIOS
   ========================================================= */
.module-hero{padding:19px;margin-bottom:13px;border-radius:21px;background:radial-gradient(circle at 100% 0,rgba(77,163,255,.13),transparent 42%),linear-gradient(150deg,#0D2030,#091521 68%);border:1px solid rgba(77,163,255,.18)}
.module-hero.success{background:radial-gradient(circle at 100% 0,rgba(45,212,167,.14),transparent 42%),linear-gradient(150deg,#0D2630,#091722 68%);border-color:rgba(45,212,167,.22)}
.module-hero.warning{background:radial-gradient(circle at 100% 0,rgba(243,180,65,.13),transparent 42%),linear-gradient(150deg,#2A2110,#121A20 68%);border-color:rgba(243,180,65,.20)}
.module-label{color:#72B8FF;font-size:10px;font-weight:900;letter-spacing:.12em}
.module-hero.success .module-label{color:#58DFC0}.module-hero.warning .module-label{color:#F0BD60}
.module-title{margin-top:6px;font-size:25px;font-weight:950;letter-spacing:-.03em}
.module-copy{margin-top:5px;color:#8796A8;font-size:12px;line-height:1.45}
.module-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:15px}
.module-metric{padding:11px;border-radius:14px;background:rgba(5,14,22,.42)}
.module-metric span{display:block;color:#738296;font-size:9px}.module-metric b{display:block;margin-top:4px;font-size:15px}
.module-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.module-toolbar h3{margin:0;font-size:15px}
.list-card{padding:15px;margin-bottom:9px;border-radius:18px;background:#0D1824;border:1px solid rgba(151,174,198,.10)}
.list-card-head{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.list-card-title{font-size:16px;font-weight:900}.list-card-sub{margin-top:4px;color:#7F8EA0;font-size:11px;line-height:1.45}
.list-card-value{text-align:right;font-size:17px;font-weight:900}
.list-card-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;margin-top:12px}
.list-card-actions .btn{min-height:38px;padding:7px 10px;font-size:10px}
.segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:5px;margin-bottom:13px;border-radius:15px;background:#08111B;border:1px solid rgba(151,174,198,.08)}
.segmented button{min-height:39px;border:0;border-radius:11px;background:transparent;color:#667588;font-size:10px;font-weight:850}
.segmented button.active{background:#132333;color:#55E0BD}
.route-order-item{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(151,174,198,.08)}
.route-order-item:last-child{border-bottom:0}.route-number{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:rgba(45,212,167,.11);color:#58DFC0;font-size:12px;font-weight:900}
.route-order-actions{display:flex;gap:6px}.route-order-actions button{width:36px;min-height:36px;padding:0;border-radius:11px}
.history-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid rgba(151,174,198,.08)}
.history-row:last-child{border-bottom:0}.history-date{font-size:15px;font-weight:900}.history-status{margin-top:4px;color:#7F8EA0;font-size:10px}.history-amount{text-align:right;font-size:17px;font-weight:900}
.history-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.history-actions .btn{min-height:34px;padding:6px 8px;font-size:9px}
.incident-card{padding:14px;margin-bottom:9px;border-radius:17px;background:#0D1824;border:1px solid rgba(151,174,198,.10)}
.incident-card.critical{border-color:rgba(240,100,100,.22)}.incident-card.warning{border-color:rgba(243,180,65,.20)}.incident-card.info{border-color:rgba(77,163,255,.18)}
.incident-card-head{display:grid;grid-template-columns:1fr auto;gap:12px}.incident-category{color:#708095;font-size:9px;font-weight:850;letter-spacing:.09em}
.incident-title{margin-top:4px;font-size:15px;font-weight:900}.incident-detail{margin-top:7px;color:#8392A4;font-size:11px;line-height:1.45}
.empty-module{padding:28px 18px;text-align:center;border-radius:19px;background:#0D1824;border:1px solid rgba(151,174,198,.09)}
.empty-module-icon{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 12px;border-radius:15px;background:rgba(45,212,167,.11);color:#58DFC0;font-weight:950}
.empty-module h3{margin:0;font-size:17px}.empty-module p{margin:6px 0 0;color:#7F8EA0;font-size:11px}
.import-guide{padding:14px;margin-bottom:11px;border-radius:17px;background:#0D1824;border:1px solid rgba(151,174,198,.10)}
.import-guide b{font-size:13px}.import-guide p{margin:5px 0 0;color:#7F8EA0;font-size:11px;line-height:1.4}
@media(max-width:390px){.module-metrics{grid-template-columns:1fr 1fr}.list-card-head{grid-template-columns:1fr}.list-card-value{text-align:left}.list-card-actions{justify-content:flex-start}}


/* =========================================================
   CML VIRTUAL v2.4 — DESIGN SYSTEM CONSOLIDADO
   Negro mineral, grafito y esmeralda contenida.
   ========================================================= */
:root{
  color-scheme:dark;
  --bg:#06090D;
  --surface:#0E141B;
  --surface-2:#131B24;
  --surface-3:#18232E;
  --border:rgba(186,202,218,.12);
  --border-soft:rgba(186,202,218,.075);
  --text:#F4F7FA;
  --muted:#8996A5;
  --primary:#45D6B0;
  --primary-2:#22B98F;
  --success:#45D6B0;
  --warning:#E8B455;
  --danger:#E56E72;
  --info:#8CA8C3;
  --radius:18px;
  --radius-sm:13px;
  --shadow:0 14px 38px rgba(0,0,0,.26);
  --shadow-sheet:0 -26px 64px rgba(0,0,0,.62);
}

html,body{
  background:
    radial-gradient(circle at 50% -220px,rgba(69,214,176,.075),transparent 430px),
    #06090D;
  color:var(--text);
}

body{
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.42;
  letter-spacing:-.009em;
}

.app{
  background:transparent;
}

.header{
  min-height:70px;
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
  background:rgba(6,9,13,.90);
  border-bottom:1px solid rgba(186,202,218,.08);
  box-shadow:none;
  backdrop-filter:blur(22px) saturate(135%);
}

.brand-mark{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#45D6B0;
  border:0;
  color:#03130E;
  box-shadow:0 9px 25px rgba(69,214,176,.13);
}
.brand-subtitle{
  color:#677586;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.10em;
}
.header h1{
  font-size:18px;
  font-weight:850;
}
.header .date{
  padding:7px 9px;
  border-radius:10px;
  background:rgba(137,150,165,.07);
  color:#A8B3BF;
  font-size:10px;
  line-height:1.2;
}

main{
  padding:18px 14px 36px;
  scroll-padding-bottom:106px;
}

.card,
.list-card,
.client-card-v2,
.client-route-card,
.payment-section,
.settings-group,
.close-block,
.close-transfer-card,
.incident-card,
.empty-module{
  background:#0E141B;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:none;
}

.card{
  padding:16px;
  margin-bottom:12px;
}

.section-title{
  margin:23px 2px 9px;
}
.section-title h2,
.eyebrow,
.payment-section-title,
.settings-group-title,
.close-block-title,
.close-transfer-title{
  color:#98A5B3;
  font-size:10px;
  font-weight:850;
  letter-spacing:.115em;
  text-transform:uppercase;
}

.note,.muted{
  color:var(--muted);
}

.btn{
  min-height:49px;
  padding:12px 15px;
  border:0;
  border-radius:14px;
  background:#45D6B0;
  color:#03130E;
  font-size:13px;
  font-weight:900;
  box-shadow:none;
}
.btn.secondary{
  background:#151E28;
  color:#E8EDF2;
  border:1px solid rgba(186,202,218,.11);
}
.btn.success{
  background:#45D6B0;
  color:#03130E;
}
.btn.danger{
  background:rgba(229,110,114,.16);
  color:#F39A9D;
  border:1px solid rgba(229,110,114,.19);
}
.btn:active{
  transform:scale(.985);
  filter:brightness(.94);
}
.btn:disabled{
  opacity:.38;
}

.input,
input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea{
  min-height:49px;
  padding:12px 13px;
  border-radius:13px;
  background:#090E14;
  border:1px solid rgba(186,202,218,.13);
  color:#F5F7FA;
  box-shadow:none;
}
.input:focus,
input:focus,
select:focus,
textarea:focus{
  border-color:rgba(69,214,176,.75);
  box-shadow:0 0 0 3px rgba(69,214,176,.09);
}
.field{
  margin:14px 0;
}
.field label{
  color:#8E9BAA;
  font-size:11px;
  font-weight:750;
}

/* Cabeceras principales: sin azul y con menos decoración */
.home-hero,
.balance-hero,
.closed-hero,
.profile-hero,
.payment-head,
.close-hero,
.prep-hero,
.settings-hero,
.module-hero,

.module-hero.warning{
  background:
    radial-gradient(circle at 100% 0,rgba(69,214,176,.105),transparent 39%),

  border:1px solid rgba(69,214,176,.18);

.home-hero-label,
.balance-hero-label,
.closed-total,
.profile-balance,
.payment-head-label,

.module-hero.warning .module-label{

.prep-action-icon,
.quick-action-icon,
.menu-icon,
.empty-module-icon,

.quick-action,
.prep-action,
.profile-action{

.quick-action:active,
.prep-action:active,
.profile-action:active{
  background:#131D26;
}

.hero-metrics,
.route-hero-footer,
.balance-breakdown{
  border-top-color:rgba(186,202,218,.09);
}

.home-progress-track,
.progress-track{
  background:#090E14;
}
.home-progress-fill,
.progress-fill{
  background:#45D6B0!important;
  box-shadow:none;
}

.route-ring{
  background:conic-gradient(#45D6B0 var(--progress),#151E27 0);
}
.route-ring::before{
  background:#0B1117;
}

.badge{
  border:0;
  font-size:9px;
  font-weight:850;
  letter-spacing:.055em;
}
.badge.paid{background:rgba(69,214,176,.12);color:#71DFC4}
.badge.partial{background:rgba(232,180,85,.13);color:#EDC373}
.badge.pending{background:rgba(229,110,114,.13);color:#EF9699}
.badge.info{background:rgba(140,168,195,.12);color:#A8BED2}

/* Navegación inferior como dock compacto */
.tabbar{
  min-height:80px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(7,11,16,.96);
  border-top:1px solid rgba(186,202,218,.08);
  box-shadow:0 -14px 38px rgba(0,0,0,.26);
  backdrop-filter:blur(22px);
  gap:5px;
}
.tab{
  min-height:59px;
  border-radius:14px;
  color:#657282;
  font-size:10px;
  font-weight:800;
  letter-spacing:.025em;
}
.tab.active{
  background:#121B24;
  color:#65DCC0;
  box-shadow:inset 0 0 0 1px rgba(69,214,176,.10);
}
.tab.active::after{
  display:none;
}
.tab-icon svg{
  width:21px;
  height:21px;
}

/* Modales y pantallas secundarias */
.sheet-backdrop{
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(5px);
}
.sheet{
  height:min(92dvh,92vh);
  max-height:min(92dvh,92vh);
  padding:16px 15px calc(30px + env(safe-area-inset-bottom));
  background:#0A1016;
  border:1px solid rgba(186,202,218,.11);
  border-radius:24px 24px 0 0;
  box-shadow:var(--shadow-sheet);
}
.sheet-handle{
  width:42px;
  height:4px;
  background:#344250;
  margin-bottom:16px;
}
.sheet-close button{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#151E28;
  border:1px solid rgba(186,202,218,.11);
  box-shadow:none;
}
.sheet>h2,
.sheet .toolbar h2{
  margin:1px 0 4px;
  font-size:23px;
  font-weight:900;
  letter-spacing:-.03em;
}
.sheet>.toolbar:first-of-type{
  padding-right:48px;
}

.toast{
  left:14px;
  right:14px;
  bottom:94px;
  padding:14px 15px;
  border-radius:14px;
  background:#14211F;
  border:1px solid rgba(69,214,176,.15);
  box-shadow:0 16px 38px rgba(0,0,0,.34);
}

/* Menú Más: categorías visuales y filas menos pesadas */
.more-intro{
  margin-bottom:13px;
  padding:2px 1px 5px;
}
.more-intro h2{
  margin:0;
  font-size:25px;
  font-weight:900;
  letter-spacing:-.035em;
}
.more-intro p{
  margin:5px 0 0;
  color:#7D8A99;
  font-size:12px;
}
.more-section{
  margin-top:18px;
}
.more-section-title{
  margin:0 3px 8px;
  color:#778596;
  font-size:10px;
  font-weight:850;
  letter-spacing:.12em;
}
.more-group{
  overflow:hidden;
  padding:0 14px;
  border-radius:18px;
  background:#0E141B;
  border:1px solid var(--border);
}
.menu-item{
  min-height:68px;
  grid-template-columns:41px 1fr 16px;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid rgba(186,202,218,.07);
}
.menu-icon{
  width:39px;
  height:39px;
  border-radius:12px;
  border:0;
}
.menu-content .client-name{
  font-size:14px;
  font-weight:820;
}
.menu-content .note{
  margin-top:2px;
  font-size:10px;
}
.menu-chevron{
  color:#526171;
  font-size:21px;
}

/* Salud de datos compacta */
.health-strip{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:center;
  padding:14px;
  margin-bottom:14px;
  border-radius:17px;
  background:#0E161E;
  border:1px solid rgba(186,202,218,.095);
}
.health-strip-title{
  font-size:14px;
  font-weight:850;
}
.health-strip-copy{
  margin-top:3px;
  color:#7D8A99;
  font-size:10px;
}
.health-score{
  min-width:55px;
  text-align:right;
  color:#67DCC0;
  font-size:17px;
  font-weight:900;
}

/* Tablas/listados técnicos */
.client-row{
  padding:14px 0;
  border-bottom-color:rgba(186,202,218,.07);
}
.stat,
.balance-detail,
.profile-summary-item,
.closed-metric,
.module-metric,
.payment-head-value,
.close-metric{
  background:#111922;
  border:1px solid rgba(186,202,218,.075);
  box-shadow:none;
}
.grid2{
  gap:9px;
}

/* Carga diaria histórica integrada al sistema actual */
.carga-diaria-original{
  background:transparent;
  color:var(--text);
  font-family:inherit;
}
.carga-diaria-original h1{
  color:#E9EEF3;
}
.carga-diaria-original .section{
  background:#0E141B;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:none;
}
.carga-diaria-original .section-title{
  margin:-16px -16px 14px;
  padding:12px 16px;
  border-radius:17px 17px 0 0;
  background:#141E27;
  color:#AAB5C0;
  font-size:11px;
  letter-spacing:.08em;
}
.carga-diaria-original .balance-row input,
.carga-diaria-original .field-group input,
.carga-diaria-original .field-group select{
  background:#090E14;
  border-color:rgba(186,202,218,.13);
}
.carga-diaria-original button{
  background:#45D6B0;
  color:#03130E;
  border-radius:14px;
}
.carga-diaria-original .total-preview{
  background:#0B1218;
  color:#67DCC0;
  border-color:rgba(69,214,176,.11);
}

@media(max-width:390px){
  main{padding-left:12px;padding-right:12px}
  .card{padding:14px}
  .home-hero-amount,
  .balance-hero-net,
  .closed-total-value,
  .profile-balance-value,
  .close-hero-value{font-size:32px}
  .hero-metric b{font-size:12px}
}


/* =========================================================
   CML VIRTUAL v2.5 — TERMINACIÓN DE PRODUCTO
   ========================================================= */
:root{
  --ease:cubic-bezier(.2,.8,.2,1);
}

/* Pantalla de carga */
.splash{
  background:
    radial-gradient(circle at 50% 36%,rgba(69,214,176,.12),transparent 220px),
    #06090D;
  gap:15px;
}
.splash-brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.splash-logo{
  width:78px;
  height:78px;
  display:grid;
  place-items:center;
  border-radius:24px;
  background:#45D6B0;
  color:#03130E;
  font-size:18px;
  font-weight:950;
  letter-spacing:.08em;
  box-shadow:0 20px 54px rgba(69,214,176,.16);
}
.splash-title{
  font-size:24px;
  font-weight:920;
  letter-spacing:-.04em;
}
.splash-subtitle{
  margin-top:3px;
  color:#778596;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.11em;
}
.splash-security{
  display:flex;
  align-items:center;
  gap:7px;
  color:#667586;
  font-size:10px;
}
.splash-security svg{
  width:14px;
  height:14px;
  fill:none;
  stroke:#45D6B0;
  stroke-width:2;
}
.progress{
  width:170px;
  height:4px;
  background:#121A22;
}
.progress>i{
  background:#45D6B0;
  animation:load 1s var(--ease) forwards;
}

/* Movimiento sutil entre vistas */
#view{
  opacity:1;
  transform:none;
}
#view.view-enter{
  animation:viewEnter .22s var(--ease);
}
@keyframes viewEnter{
  from{opacity:.35;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

/* Feedback táctil uniforme */
button,
[onclick]{
  transition:
    transform .13s var(--ease),
    filter .13s var(--ease),
    background-color .16s var(--ease),
    border-color .16s var(--ease),
    opacity .16s var(--ease);
}
button:active,
[onclick]:active{
  transform:scale(.985);
}
button:focus-visible,
[onclick]:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible{
  outline:2px solid rgba(69,214,176,.85);
  outline-offset:2px;
}

/* Encabezado contextual */
.header{
  position:relative;
}
.header::after{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(69,214,176,.12),transparent);
}
.header .date{
  font-variant-numeric:tabular-nums;
}

/* Escala tipográfica y números */
.money,
.home-hero-amount,
.balance-hero-net,
.closed-total-value,
.profile-balance-value,
.close-hero-value,
.route-progress-copy .percent,
.client-card-balance b,
.client-route-amount,
.activity-amount,
.list-card-value,
.history-amount{
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,.client-name,.client-card-name,.client-route-name,.list-card-title{
  text-wrap:balance;
}

/* Estados vacíos */
.empty{
  min-height:58vh;
}
.empty>div{
  width:min(100%,340px);
  padding:28px 22px;
  border-radius:22px;
  background:#0E141B;
  border:1px solid rgba(186,202,218,.09);
}
.empty-icon{
  width:62px;
  height:62px;
  display:grid;
  place-items:center;
  margin:0 auto 14px;
  border-radius:19px;
  background:rgba(69,214,176,.11);
  color:#61DABD;
  font-size:13px;
  font-weight:950;
  letter-spacing:.08em;
  box-shadow:none;
}
.empty h2{
  margin:0;
  font-size:21px;
  letter-spacing:-.025em;
}
.empty p{
  margin:7px 0 17px;
  font-size:12px;
  line-height:1.5;
}

/* Pasos de jornada más livianos */
.steps{
  min-height:0;
  padding:4px;
  border-radius:15px;
  background:#0A1016;
  border:1px solid rgba(186,202,218,.075);
}
.step{
  min-height:52px;
  padding:7px 4px;
  border-radius:11px;
  font-size:9px;
  line-height:1.25;
}
.step.active{
  background:#15221F;
  color:#69DCC1;
  border:1px solid rgba(69,214,176,.11);
}

/* Formularios más limpios */
.field label{
  margin-bottom:6px;
}
textarea{
  resize:vertical;
}
input::placeholder,
textarea::placeholder{
  color:#536171;
  opacity:1;
}
select{
  background-image:none;
}

/* Scroll y contenido largo */
main,.sheet{
  scrollbar-width:thin;
  scrollbar-color:#293743 transparent;
}
main::-webkit-scrollbar,
.sheet::-webkit-scrollbar{
  width:5px;
}
main::-webkit-scrollbar-thumb,
.sheet::-webkit-scrollbar-thumb{
  background:#293743;
  border-radius:99px;
}

/* Toast con estado visual */
.toast{
  display:flex;
  align-items:center;
  gap:10px;
  transform:translateY(12px);
  opacity:0;
  pointer-events:none;
}
.toast::before{
  content:"✓";
  width:25px;
  height:25px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:9px;
  background:rgba(69,214,176,.14);
  color:#68DEC2;
  font-weight:950;
}
.toast.show{
  display:flex;
  animation:toastIn .2s var(--ease) forwards;
}
.toast.error::before{
  content:"!";
  background:rgba(229,110,114,.14);
  color:#F09598;
}
@keyframes toastIn{
  to{transform:none;opacity:1}
}

/* Modales con cabecera despejada */
.sheet-close{
  position:sticky;
  top:0;
  z-index:10;
}
.sheet-close button{
  backdrop-filter:blur(12px);
}
.sheet .sheet-handle + .module-hero,
.sheet .sheet-handle + .payment-head,
.sheet .sheet-handle + .profile-hero,
.sheet .sheet-handle + .close-hero,
.sheet .sheet-handle + .settings-hero{
  margin-top:2px;
}

/* Lista de clientes: lectura más rápida */
.client-card-v2,
.client-route-card,
.list-card{
  overflow:hidden;
}
.client-card-v2::before,
.client-route-card::before,
.list-card::before{
  content:"";
  display:block;
  height:1px;
  margin:-16px -16px 14px;
  background:linear-gradient(90deg,transparent,rgba(186,202,218,.08),transparent);
}
.client-card-tag,
.profile-tag{
  background:#121B24;
  color:#8190A0;
}

/* Salud de datos */
.health-score.good{color:#67DCC0}
.health-score.warning{color:#E9BC69}
.health-score.danger{color:#ED9295}

/* Reducción de movimiento */
@media(prefers-reduced-motion:reduce){
  #view.view-enter,
  .toast.show,
  .progress>i{
    animation:none!important;
  }
  button,[onclick]{
    transition:none!important;
  }
}


/* =========================================================
   CML VIRTUAL v2.6 — OPTIMIZACIÓN MÓVIL FINAL
   ========================================================= */

/* Evitar cortes de importes y textos largos */
.money,
.home-hero-amount,
.balance-hero-net,
.closed-total-value,
.profile-balance-value,
.close-hero-value,
.route-progress-copy .percent,
.client-card-balance b,
.client-route-amount,
.activity-amount,
.list-card-value,
.history-amount,
.stat b,
.balance-detail b,
.module-metric b,
.closed-metric b,
.profile-summary-item b{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.client-name,
.client-card-name,
.client-route-name,
.list-card-title,
.profile-name,
.next-client-name{
  min-width:0;
  overflow-wrap:anywhere;
}

/* Buscadores y filtros más cómodos en móvil */
.clients-hero + .input,
#routeSearch{
  position:sticky;
  top:0;
  z-index:4;
  background:#090E14;
  box-shadow:0 8px 22px rgba(6,9,13,.88);
}

.filter-pills,
.segmented,
.chips{
  position:sticky;
  top:58px;
  z-index:3;
  background:rgba(8,14,20,.96);
  backdrop-filter:blur(16px);
}

.chips{
  padding:6px 0;
}

/* Controles nativos modernizados */
input[type="checkbox"],
input[type="radio"]{
  accent-color:#45D6B0;
}

input[type="checkbox"]{
  width:22px;
  height:22px;
  min-width:22px;
  border-radius:7px;
}

input[type="radio"]{
  width:20px;
  height:20px;
  min-width:20px;
}

/* Select con indicador visual coherente */
select{
  appearance:none;
  -webkit-appearance:none;
  padding-right:40px!important;
  background-image:
    linear-gradient(45deg,transparent 50%,#6F7D8C 50%),
    linear-gradient(135deg,#6F7D8C 50%,transparent 50%);
  background-position:
    calc(100% - 19px) 52%,
    calc(100% - 14px) 52%;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
}

/* Barras de acciones más claras */
.actions{
  gap:8px;
}
.actions .btn{
  flex:1 1 140px;
}
.sheet>.actions:last-child,
.sheet>.btn:last-child{
  margin-bottom:6px;
}

/* Mejor lectura en tarjetas compactas */
.client-card-top,
.client-route-main,
.list-card-head,
.incident-card-head{
  align-items:center;
}
.client-card-balance,
.client-route-amount,
.list-card-value{
  white-space:normal;
}

/* Separación visual de botones peligrosos */
.btn.danger{
  margin-top:6px;
}
.btn.danger + .btn,
.btn + .btn.danger{
  margin-left:0;
}

/* Modales largos: cabecera y cierre más accesibles */
.sheet{
  overscroll-behavior:contain;
  scroll-padding-top:18px;
}
.sheet-close{
  pointer-events:none;
}
.sheet-close button{
  pointer-events:auto;
}
.sheet::after{
  content:"";
  position:sticky;
  bottom:-30px;
  display:block;
  height:28px;
  margin:0 -15px -30px;
  background:linear-gradient(180deg,transparent,#0A1016 82%);
  pointer-events:none;
}

/* Formularios extensos */
.carga-diaria-original .client-row{
  gap:10px;
}
.carga-diaria-original .field-group{
  min-width:0;
}
.carga-diaria-original input,
.carga-diaria-original select{
  width:100%;
  min-width:0;
}

/* Tab inferior optimizado */
.tabbar{
  padding-left:max(8px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right));
}
.tab{
  padding-left:4px;
  padding-right:4px;
}
.tab span:not(.tab-icon){
  white-space:nowrap;
}

/* Estados táctiles sin movimiento brusco en listas */
.client-card-v2:active,
.client-route-card:active,
.list-card:active,
.menu-item:active{
  transform:none;
  background:#111922;
}

/* Cabeceras de módulos más compactas */
.module-hero,
.profile-hero,
.payment-head,
.close-hero,
.settings-hero,
.prep-hero{
  margin-bottom:12px;
}
.module-title,
.profile-name,
.payment-head-name{
  line-height:1.12;
}

/* Soporte para pantallas angostas */
@media(max-width:430px){
  .home-hero,
  .balance-hero,
  .closed-hero,
  .profile-hero,
  .payment-head,
  .close-hero,
  .prep-hero,
  .settings-hero,
  .module-hero{
    padding:17px;
    border-radius:19px;
  }

  .home-hero-amount,
  .balance-hero-net,
  .closed-total-value,
  .profile-balance-value,
  .close-hero-value{
    font-size:30px;
  }

  .hero-metrics{
    grid-template-columns:1fr 1fr;
    gap:8px;
    border-top:0;
  }
  .hero-metric{
    padding:10px;
    border:1px solid rgba(186,202,218,.075);
    border-radius:13px;
    background:#101821;
  }
  .hero-metric:last-child{
    grid-column:1 / -1;
  }

  .quick-actions{
    grid-template-columns:1fr 1fr;
  }
  .quick-action:last-child{
    grid-column:1 / -1;
  }

  .profile-actions{
    grid-template-columns:1fr 1fr;
  }

  .route-ring-row{
    grid-template-columns:88px 1fr;
    gap:14px;
  }
  .route-ring-wrap,
  .route-ring{
    width:86px;
    height:86px;
  }
  .route-ring::before{
    width:62px;
    height:62px;
  }
  .route-ring-text b{
    font-size:20px;
  }

  .client-route-actions{
    grid-template-columns:1fr 1fr;
  }
  .client-route-actions .btn:last-child{
    grid-column:1 / -1;
  }

  .payment-head-values,
  .profile-summary,
  .closed-metrics,
  .close-metrics,
  .balance-details{
    grid-template-columns:1fr 1fr;
  }

  .module-metrics{
    grid-template-columns:1fr 1fr;
  }

  .settings-routes{
    grid-template-columns:1fr;
  }

  .filter-pills{
    grid-template-columns:repeat(3,minmax(82px,1fr));
    overflow-x:auto;
  }

  .segmented{
    overflow-x:auto;
    grid-auto-columns:minmax(100px,1fr);
  }
}

@media(max-width:350px){
  main{
    padding-left:10px;
    padding-right:10px;
  }

  .header{
    padding-left:11px;
    padding-right:11px;
  }

  .brand-mark{
    width:38px;
    height:38px;
  }

  .header h1{
    font-size:16px;
  }

  .header .date{
    display:none;
  }

  .quick-actions,
  .payment-head-values,
  .profile-summary,
  .closed-metrics,
  .close-metrics,
  .balance-details,
  .module-metrics{
    grid-template-columns:1fr;
  }

  .hero-metric:last-child{
    grid-column:auto;
  }

  .profile-actions{
    grid-template-columns:1fr;
  }

  .actions{
    flex-direction:column;
  }

  .actions .btn{
    width:100%;
    flex-basis:auto;
  }
}


/* =========================================================
   CML VIRTUAL v2.7 — MÓDULOS TÉCNICOS Y FINANCIEROS
   ========================================================= */
.tech-hero,
.loan-hero,
.audit-hero,
.security-hero{
  padding:18px;
  margin-bottom:13px;
  border-radius:20px;
  background:
    radial-gradient(circle at 100% 0,rgba(69,214,176,.09),transparent 42%),
    linear-gradient(150deg,#10201E,#0B1318 68%);
  border:1px solid rgba(69,214,176,.15);
}
.tech-hero.warning,
.security-hero.warning{
  background:

function roundCurrency(value){
  const number=Number(value||0);
  return Number.isFinite(number)?Math.round((number+Number.EPSILON)*100)/100:0;
}
function fmt(n){
  if(n===null||n===undefined||n===''||isNaN(n))return '0';

    minimumFractionDigits:0,
    maximumFractionDigits:2

}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('clients')) db.createObjectStore('clients',{keyPath:'id'});
      if(!db.objectStoreNames.contains('days')) db.createObjectStore('days',{keyPath:'date'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('loans')) db.createObjectStore('loans',{keyPath:'id'});
      if(!db.objectStoreNames.contains('audit')) db.createObjectStore('audit',{keyPath:'id'});
      if(!db.objectStoreNames.contains('expenses')) db.createObjectStore('expenses',{keyPath:'id'});
      if(!db.objectStoreNames.contains('reconciliations')) db.createObjectStore('reconciliations',{keyPath:'dayDate'});
      if(!db.objectStoreNames.contains('imports')) db.createObjectStore('imports',{keyPath:'id'});
    };
    req.onsuccess=()=>{
      const db=req.result;
      const requiredStores=['clients','days','settings','loans','audit','expenses','reconciliations','imports'];
      const missing=requiredStores.filter(name=>!db.objectStoreNames.contains(name));
      if(missing.length){
        db.close();
        reject(new Error('La base local quedó desactualizada. Cerrá y volvé a abrir esta versión.'));
        return;
      }
      resolve(db);
    };
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error('La actualización de la base está bloqueada por otra pestaña abierta.'));
  });
}

const EMERGENCY_SNAPSHOT_PREFIX='cml_emergency_snapshot_';
const EMERGENCY_SNAPSHOT_LIMIT=3;

function emergencySnapshotKeys(){
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key?.startsWith(EMERGENCY_SNAPSHOT_PREFIX))keys.push(key);
  }
  return keys.sort((a,b)=>{
    try{
      return Number(JSON.parse(localStorage.getItem(b))?.createdAt||0)-Number(JSON.parse(localStorage.getItem(a))?.createdAt||0);
    }catch{return 0}
  });
}
function readEmergencySnapshots(){
  return emergencySnapshotKeys().map(key=>{
    try{
      const data=JSON.parse(localStorage.getItem(key));
      return {...data,_key:key};
    }catch{
      return null;
    }
  }).filter(Boolean).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
}
function emergencySnapshotSummary(snapshot){
  return {
    createdAt:Number(snapshot?.createdAt||0),
    dayDate:snapshot?.day?.date||null,
    dayStatus:snapshot?.day?.status||null,
    clients:Array.isArray(snapshot?.clients)?snapshot.clients.length:0,
    expenses:Array.isArray(snapshot?.expenses)?snapshot.expenses.length:0,
    reconciliations:Array.isArray(snapshot?.reconciliations)?snapshot.reconciliations.length:0
  };
}
async function buildEmergencySnapshot(reason='automatic'){
  if(!state.db)return null;
  const [clients,days,settings,expenses,reconciliations,loans]=await Promise.all([
    getAll('clients'),getAll('days'),getAll('settings'),
    getAll('expenses'),getAll('reconciliations'),getAll('loans')
  ]);
  const currentDay=days.find(day=>day.date===dateKey())||state.day||null;
  return {
    snapshotVersion:1,
    appVersion:'3.0',
    createdAt:Date.now(),
    reason,
    clients,
    day:currentDay,
    settings,
    expenses,
    reconciliations,
    loans
  };
}
function rotateEmergencySnapshots(){
  emergencySnapshotKeys().slice(EMERGENCY_SNAPSHOT_LIMIT).forEach(key=>{
    try{localStorage.removeItem(key)}catch{}
  });
}
async function createEmergencySnapshot(reason='manual',silent=false){
  try{
    const snapshot=await buildEmergencySnapshot(reason);
    if(!snapshot)return null;
    const key=EMERGENCY_SNAPSHOT_PREFIX+snapshot.createdAt;
    localStorage.setItem(key,JSON.stringify(snapshot));
    rotateEmergencySnapshots();
    state.settings.lastEmergencySnapshotAt=snapshot.createdAt;
    if(state.db){
      const record={key:'lastEmergencySnapshotAt',value:snapshot.createdAt};
      const request=tx('settings','readwrite').put(record);
      await new Promise((resolve,reject)=>{
        request.onsuccess=resolve;
        request.onerror=()=>reject(request.error);
      });
    }
    if(!silent)toast('Copia de emergencia creada');
    return snapshot;
  }catch(error){
    console.error('Emergency snapshot error',error);
    if(!silent)toast('No se pudo crear la copia local');
    return null;
  }
}
function scheduleEmergencySnapshot(reason='change'){

function detectPendingRecovery(){
  const snapshot=newestEmergencySnapshot();
  if(!snapshot)return null;

  const snapshotDay=snapshot.day;
  if(!snapshotDay)return null;
  const dbUpdated=Math.max(
    Number(dbDay?.closedAt||0),
    Number(dbDay?.routeActivatedAt||0),
    Number(dbDay?.createdAt||0),
    ...Object.values(dbDay?.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(dbDay?.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  const snapshotUpdated=Math.max(
    Number(snapshot.createdAt||0),
    Number(snapshotDay.closedAt||0),
    Number(snapshotDay.routeActivatedAt||0),
    Number(snapshotDay.createdAt||0),
    ...Object.values(snapshotDay.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(snapshotDay.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  if(snapshotDay.date===dateKey()&&(!dbDay||snapshotUpdated>dbUpdated+2000)){
    return snapshot;
  }
  return null;
}
async function refreshStorageInfo(){
  const info={supported:false,persisted:null,usage:null,quota:null,percent:null};
  try{
    if(navigator.storage){
      info.supported=true;
      if(navigator.storage.persisted)info.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){
        const estimate=await navigator.storage.estimate();
        info.usage=Number(estimate.usage||0);
        info.quota=Number(estimate.quota||0);
        info.percent=info.quota?Math.round((info.usage/info.quota)*100):0;
      }
    }
  }catch(error){console.warn(error)}
  state.storageInfo=info;
  return info;
}

function validateEmergencySnapshot(snapshot){
  const errors=[];
  if(!snapshot||typeof snapshot!=='object')errors.push('Formato inválido');
  if(!Array.isArray(snapshot?.clients))errors.push('Faltan clientes');
  const ids=new Set();
  (snapshot?.clients||[]).forEach(client=>{
    if(!client?.id)errors.push('Cliente sin ID');
    else if(ids.has(client.id))errors.push(`ID duplicado: ${client.id}`);
    else ids.add(client.id);
    if(!client?.name?.trim())errors.push('Cliente sin nombre');
  });
  if(snapshot?.day&&!snapshot.day.date)errors.push('Jornada sin fecha');
  return errors;
}

function normalizeText(value=''){

function parseDelimitedText(text){
  const raw=String(text||'').replace(/\r/g,'').trim();
  if(!raw)return [];
  const lines=raw.split('\n').filter(line=>line.trim());
  if(!lines.length)return [];
  const delimiter=lines.some(line=>line.includes('\t'))?'\t':lines.some(line=>line.includes(';'))?';':',';
  return lines.map(line=>{
    if(delimiter==='\t')return line.split('\t').map(normalizeText);
    const cells=[];let current='',quoted=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(quoted&&line[i+1]==='"'){current+='"';i++}
        else quoted=!quoted;
      }else if(ch===delimiter&&!quoted){
        cells.push(normalizeText(current));current='';
      }else current+=ch;
    }
    cells.push(normalizeText(current));
    return cells;
  });
}
function detectImportColumns(rows){

function buildImportDraft(rows,source='pegado'){

function parsePinwebAmount(value){
  const raw=String(value??'').trim();
  if(!raw)return 0;
  let cleaned=raw.replace(/\s/g,'').replace(/\$/g,'');
  const hasComma=cleaned.includes(',');
  const hasDot=cleaned.includes('.');
  if(hasComma&&hasDot){
    if(cleaned.lastIndexOf(',')>cleaned.lastIndexOf('.')){
      cleaned=cleaned.replace(/\./g,'').replace(',','.');
    }else{
      cleaned=cleaned.replace(/,/g,'');
    }
  }else if(hasComma){
    const decimals=cleaned.length-cleaned.lastIndexOf(',')-1;
    cleaned=decimals===2?cleaned.replace(/\./g,'').replace(',','.') : cleaned.replace(/,/g,'');
  }else if(hasDot){
    const decimals=cleaned.length-cleaned.lastIndexOf('.')-1;
    if(decimals!==2)cleaned=cleaned.replace(/\./g,'');
  }
  cleaned=cleaned.replace(/[^\d.-]/g,'');
  const number=Number(cleaned);
  return Number.isFinite(number)?Math.round(number):NaN;
}

function buildAccreditationDraft(rows,source='excel_pegado'){
  const columns=detectAccreditationColumns(rows);
  const data=columns.hasHeader?rows.slice(1):rows;
  const seen=new Set(),items=[],errors=[],unknown=[];
  data.forEach((row,index)=>{
    const line=index+(columns.hasHeader?2:1);
    const importedName=normalizeText(row[columns.name]||'');
    const rawAmount=row[columns.amount]||'';
    if(!importedName&&!normalizeText(rawAmount))return;
    if(!importedName){errors.push(`Fila ${line}: falta el nombre del cliente.`);return}
    const key=normalizeClientKey(importedName);
    if(seen.has(key)){errors.push(`Fila ${line}: cliente duplicado en el archivo (${importedName}).`);return}
    seen.add(key);
    const amount=parsePinwebAmount(rawAmount);
    if(!Number.isFinite(amount)||amount<0){errors.push(`Fila ${line}: monto inválido para ${importedName}.`);return}
    const client=findClientForAccreditationImport(importedName);
    if(!client){
      unknown.push({line,name:importedName,amount});
      return;
    }
    items.push({line,clientId:client.id,clientName:client.name,importedName,amount});
  });
  return {source,items,errors,unknown,columns,createdAt:Date.now()};
}

  const routePaid=routePaymentsFor(client.id,day)
    .reduce((sum,payment)=>sum+Number(payment.amount||0),0);
  const visit=visitRecord(client.id,day);
  if(routePaid>0&&remaining<=0)return {key:'paid',label:'COMPLETADO',badge:'paid'};
  if(routePaid>0&&remaining>0)return {key:'partial',label:'PARCIAL',badge:'partial'};
  if(visit?.status==='no_payment')return {key:'visited',label:'VISITADO',badge:'partial'};
  if(visit?.status==='rescheduled')return {key:'rescheduled',label:'REPROGRAMADO',badge:'partial'};

function moveRouteClient(clientId,direction){
  if(!state.day||state.day.status==='closed')return toast('La jornada está cerrada');
  const order=[...(state.day.routeOrder?.length?state.day.routeOrder:state.day.clientIds||[])];
  const index=order.indexOf(clientId);
  if(index<0)return;
  const next=index+direction;
  if(next<0||next>=order.length)return;
  [order[index],order[next]]=[order[next],order[index]];
  state.day.routeOrder=order;

function routeClients(day=state.day){
  const routeIds=new Set(day?.routeOrder||[]);
  let clients=operationalClients(day).filter(client=>routeIds.has(client.id));
  const query=routeSearchValue();
  if(query){
    clients=clients.filter(client=>[
      client.name,client.address,client.routeNote,client.phone
    ].some(value=>normalizeClientKey(value||'').includes(query)));
  }
  if(state.routeFilter==='all')return clients;
  return clients.filter(client=>{
    const status=clientRouteStatus(client,day).key;
    if(state.routeFilter==='pending')return !hasRoutePayment(client.id,day);
    if(state.routeFilter==='visited')return status==='visited'||status==='rescheduled';
    if(state.routeFilter==='paid')return hasRoutePayment(client.id,day);
    return true;
  });
}
function routeVisitStats(day=state.day){
  const routeIds=new Set(day?.routeOrder||[]);
  const clients=operationalClients(day).filter(client=>routeIds.has(client.id));
  let paid=0,partial=0,visited=0,pending=0;
  clients.forEach(client=>{
    const key=clientRouteStatus(client,day).key;
    if(key==='paid')paid++;
    else if(key==='partial')partial++;
    else if(key==='visited'||key==='rescheduled')visited++;
    else pending++;
  });
  return {total:clients.length,paid,partial,visited,pending,managed:paid+partial+visited};
}

function allClientPayments(clientId){
  return state.history.flatMap(day=>(day.payments?.[clientId]||[]).map(payment=>({...payment,dayDate:day.date})));
}
function latestPaymentAfter(clientId,timestamp){
  return allClientPayments(clientId).some(payment=>Number(payment.createdAt||0)>Number(timestamp||0));
}
function followUpItems(){
  const today=dateKey();
  const items=[];
  state.history.forEach(day=>{
    Object.entries(day.visits||{}).forEach(([clientId,visit])=>{
      if(!visit?.followUpDate||visit.followUpResolvedAt)return;
      if(latestPaymentAfter(clientId,visit.updatedAt))return;
      const client=state.clients.find(c=>c.id===clientId);
      if(!client)return;
      const remaining=clientDue(client,day);
      const category=visit.followUpDate<today?'overdue':visit.followUpDate===today?'today':'upcoming';
      items.push({
        dayDate:day.date,
        clientId,
        client,
        visit,
        remaining,
        category,
        key:`${day.date}|${clientId}`
      });
    });
  });
  return items.sort((a,b)=>a.visit.followUpDate.localeCompare(b.visit.followUpDate)||a.client.name.localeCompare(b.client.name,'es'));
}
function visibleFollowUps(){
  const items=followUpItems();
  if(state.followUpFilter==='all')return items;
  if(state.followUpFilter==='due')return items.filter(item=>item.category==='overdue'||item.category==='today');
  return items.filter(item=>item.category===state.followUpFilter);
}
function followUpStats(){
  const items=followUpItems();
  return {
    total:items.length,
    overdue:items.filter(i=>i.category==='overdue').length,
    today:items.filter(i=>i.category==='today').length,
    upcoming:items.filter(i=>i.category==='upcoming').length
  };
}
function setFollowUpFilter(filter){
  state.followUpFilter=filter;
  showFollowUps();
}
