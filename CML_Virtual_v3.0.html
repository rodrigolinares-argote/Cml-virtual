function buildRepairPreview(){
  const changes=[];
  const clients=state.clients.map(cloneData);
  const days=state.history.map(cloneData);
  const expenses=state.expenses.map(cloneData);
  const reconciliations=state.reconciliations.map(cloneData);
  const clientIds=new Set(clients.map(client=>client.id));

  days.forEach(day=>{
    let changed=false;
    if(day.openingCash===undefined||!Number.isFinite(Number(day.openingCash))||Number(day.openingCash)<0){
      day.openingCash=Number(state.settings.capital||0);
      changes.push({type:'day_opening_cash',record:day.date,detail:`Capital inicial establecido en ${money(day.openingCash)}`});changed=true;
    }
    if(typeof day.openingCashConfirmed!=='boolean'){
      day.openingCashConfirmed=day.status!=='preparation';
      changes.push({type:'day_opening_confirmation',record:day.date,detail:'Confirmación del capital normalizada'});changed=true;
    }
    if(!Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)>0){
      day.reopenHistory=[];
      changes.push({type:'reopen_history_initialized',record:day.date,detail:'Historial de reaperturas inicializado'});changed=true;
    }
    if(Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)!==day.reopenHistory.length){
      day.reopenCount=day.reopenHistory.length;
      changes.push({type:'reopen_count_repaired',record:day.date,detail:'Contador de reaperturas sincronizado'});changed=true;
    }
    if(!Array.isArray(day.clientIds)){day.clientIds=[];changes.push({type:'day_client_ids',record:day.date,detail:'Lista de clientes inicializada'});changed=true}
    const validIds=[...new Set(day.clientIds.filter(id=>clientIds.has(id)))];
    if(JSON.stringify(validIds)!==JSON.stringify(day.clientIds)){day.clientIds=validIds;changes.push({type:'day_client_ids_cleaned',record:day.date,detail:'Referencias inexistentes o duplicadas eliminadas'});changed=true}
    const originalOrder=Array.isArray(day.routeOrder)?day.routeOrder:[];
    const repairedOrder=[...new Set(originalOrder.filter(id=>day.clientIds.includes(id)))];
    day.clientIds.forEach(id=>{if(!repairedOrder.includes(id))repairedOrder.push(id)});
    if(JSON.stringify(repairedOrder)!==JSON.stringify(originalOrder)){day.routeOrder=repairedOrder;changes.push({type:'route_order_repaired',record:day.date,detail:'Orden de ruta reconstruido'});changed=true}
    day.accreditations=day.accreditations&&typeof day.accreditations==='object'?day.accreditations:{};
    day.payments=day.payments&&typeof day.payments==='object'?day.payments:{};
    day.visits=day.visits&&typeof day.visits==='object'?day.visits:{};
    Object.entries(day.payments).forEach(([clientId,payments])=>{
      if(!Array.isArray(payments)){day.payments[clientId]=[];changes.push({type:'payments_reset',record:`${day.date}/${clientId}`,detail:'Colección de pagos inválida reemplazada'});changed=true;return}
      payments.forEach((payment,index)=>{
        if(!payment.id){payment.id=`repair_${day.date}_${clientId}_${index}_${Date.now()}`;changes.push({type:'payment_id',record:`${day.date}/${clientId}`,detail:'ID de pago generado'});changed=true}
        payment.amount=Number(payment.amount||0);
        if(!['cash','transfer'].includes(payment.method)){payment.method='cash';changes.push({type:'payment_method',record:`${day.date}/${clientId}`,detail:'Medio inválido normalizado a efectivo'});changed=true}
        if(!Number(payment.createdAt)){payment.createdAt=Number(day.createdAt||Date.now());changes.push({type:'payment_date',record:`${day.date}/${clientId}`,detail:'Fecha del pago reconstruida'});changed=true}
      });
    });
    if(changed)day.repairedAt=Date.now();
  });

  expenses.forEach(expense=>{
    let changed=false;
    if(!['cash','transfer'].includes(expense.method)){expense.method='cash';changes.push({type:'expense_method',record:expense.id,detail:'Gasto normalizado como efectivo'});changed=true}
    if(!Number(expense.createdAt)){expense.createdAt=Date.now();changes.push({type:'expense_date',record:expense.id,detail:'Fecha de creación agregada'});changed=true}
    if(changed)expense.repairedAt=Date.now();
  });

  reconciliations.forEach(rec=>{
    let changed=false;
    const day=days.find(item=>item.date===rec.dayDate);
    if(day){
      const totals=calcDay(day);
      if(rec.openingCash===undefined){rec.openingCash=totals.openingCash;changes.push({type:'reconciliation_opening_cash',record:rec.dayDate,detail:'Capital inicial agregado'});changed=true}
      if(rec.expectedCash===undefined||!Number.isFinite(Number(rec.expectedCash))){rec.expectedCash=totals.expectedCash;changes.push({type:'reconciliation_expected_cash',record:rec.dayDate,detail:'Caja esperada recalculada'});changed=true}
      if(rec.expectedTransfer===undefined||!Number.isFinite(Number(rec.expectedTransfer))){rec.expectedTransfer=totals.expectedTransfer;changes.push({type:'reconciliation_expected_transfer',record:rec.dayDate,detail:'Transferencia esperada recalculada'});changed=true}
      rec.cashDifference=Number(rec.countedCash||0)-Number(rec.expectedCash||0);
      rec.transferDifference=Number(rec.verifiedTransfer||0)-Number(rec.expectedTransfer||0);
    }
    if(changed)rec.repairedAt=Date.now();
  });
  return {createdAt:Date.now(),changes,datasets:{clients,days,expenses,reconciliations}};
}

function integrityReport(){
  const issues=[];
  const warnings=[];
  const info=[];
  const clientIds=new Set(state.clients.map(c=>c.id));
  const normalizedNames=new Map();

  state.clients.forEach(client=>{
    const key=normalizeClientKey(client.name);
    if(!client.id)issues.push({type:'client_missing_id',label:`Cliente sin identificador: ${client.name||'Sin nombre'}`});
    if(!client.name?.trim())issues.push({type:'client_missing_name',label:`Cliente ${client.id||'sin ID'} sin nombre`});
    if(Number(client.balance||0)<0)issues.push({type:'client_negative_balance',label:`Saldo negativo en ${client.name}`});
    if(!Number.isFinite(Number(client.order)))warnings.push({type:'client_invalid_order',label:`Orden inválido en ${client.name}`});
    if(key){
      if(normalizedNames.has(key))issues.push({type:'duplicate_client_name',label:`Nombre duplicado: ${client.name}`});
      else normalizedNames.set(key,client.id);
    }
  });

  const dayDates=new Set();
  state.history.forEach(day=>{
    if(!day.date)issues.push({type:'day_missing_date',label:'Jornada sin fecha'});
    if(dayDates.has(day.date))issues.push({type:'duplicate_day',label:`Jornada duplicada: ${day.date}`});
    dayDates.add(day.date);
    if(!['preparation','active','closed'].includes(day.status))issues.push({type:'invalid_day_status',label:`Estado inválido en jornada ${day.date||'sin fecha'}`});
    if(day.openingCash!==undefined&&(Number(day.openingCash)<0||!Number.isFinite(Number(day.openingCash))))issues.push({type:'invalid_opening_cash',label:`Capital inicial inválido en jornada ${day.date}`});
    if(day.openingCash===undefined)info.push({type:'legacy_opening_cash',label:`Jornada anterior usa capital configurado: ${day.date}`});
    if(day.status==='closed'&&!day.closedAt)issues.push({type:'closed_day_missing_timestamp',label:`Jornada cerrada sin fecha de cierre: ${day.date}`});
    if(day.status==='closed'&&!day.preCloseBalances)warnings.push({type:'legacy_close_without_balance_snapshot',label:`Cierre anterior sin copia de saldos: ${day.date}`});
    if(day.status!=='closed'&&day.reconciliation)warnings.push({type:'active_day_with_reconciliation',label:`Jornada activa conserva conciliación: ${day.date}`});
    if(Number(day.reopenCount||0)!==(Array.isArray(day.reopenHistory)?day.reopenHistory.length:0))warnings.push({type:'reopen_history_mismatch',label:`Historial de reaperturas inconsistente: ${day.date}`});
    if(Number(day.reopenCount||0)>3)issues.push({type:'reopen_limit_exceeded',label:`Límite de reaperturas excedido: ${day.date}`});
    if(day.status!=='closed'&&day.date<dateKey())warnings.push({type:'old_open_day',label:`Jornada anterior sin cerrar: ${day.date}`});
    (day.clientIds||[]).forEach(id=>{
      if(!clientIds.has(id))issues.push({type:'orphan_day_client',label:`Jornada ${day.date}: cliente inexistente ${id}`});
    });
    (day.routeOrder||[]).forEach(id=>{
      if(!(day.clientIds||[]).includes(id))warnings.push({type:'route_order_outside_day',label:`Orden de ruta inconsistente en ${day.date}: ${id}`});
    });
    Object.entries(day.accreditations||{}).forEach(([id,value])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_accreditation',label:`Acreditación huérfana en ${day.date}: ${id}`});
      if(Number(value)<0||!Number.isFinite(Number(value)))issues.push({type:'invalid_accreditation',label:`Acreditación inválida en ${day.date}`});
    });
    Object.entries(day.payments||{}).forEach(([id,payments])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_payment_client',label:`Pago asociado a cliente inexistente en ${day.date}: ${id}`});
      if(!Array.isArray(payments))issues.push({type:'invalid_payment_collection',label:`Pagos inválidos en ${day.date}: ${id}`});
      else {
        const seenPayments=new Set();
        payments.forEach(payment=>{
        if(!payment.id)issues.push({type:'payment_missing_id',label:`Pago sin identificador en ${day.date}: ${id}`});
        if(Number(payment.amount)<=0||!Number.isFinite(Number(payment.amount)))issues.push({type:'invalid_payment',label:`Pago inválido en ${day.date}: ${id}`});
        if(!['cash','transfer'].includes(payment.method))warnings.push({type:'unknown_payment_method',label:`Medio de pago no reconocido en ${day.date}: ${payment.method||'vacío'}`});
        if(day.closedAt&&Number(payment.createdAt||0)>Number(day.closedAt))warnings.push({type:'payment_after_close',label:`Pago posterior al cierre en ${day.date}: ${id}`});
        const duplicateKey=`${Number(payment.amount||0)}|${payment.method}|${Math.floor(Number(payment.createdAt||0)/8000)}`;
        if(seenPayments.has(duplicateKey))warnings.push({type:'possible_duplicate_payment',label:`Posible pago duplicado en ${day.date}: ${id}`});
        seenPayments.add(duplicateKey);
      });
      }
    });
  });

  state.expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!Number.isFinite(Number(expense.amount)))issues.push({type:'invalid_expense',label:`Gasto inválido: ${expense.detail||expense.id}`});
    if(expense.method&&!['cash','transfer'].includes(expense.method))issues.push({type:'invalid_expense_method',label:`Forma de pago inválida en gasto: ${expense.id}`});
    if(!expense.method)info.push({type:'legacy_expense_method',label:`Gasto anterior tratado como efectivo: ${expense.id}`});
    if(expense.dayDate&&!dayDates.has(expense.dayDate))warnings.push({type:'orphan_expense_day',label:`Gasto sin jornada relacionada: ${expense.dayDate}`});
  });

  [...state.history,state.day].filter(Boolean).forEach(day=>{
    if(day.status!=='closed'&&day.status!=='active'&&day.status!=='preparation')return;
    if(day.status!=='preparation'&&!dailyDataReady(day)){
      issues.push({type:'active_day_without_daily_load',label:`Jornada sin carga diaria confirmada: ${day.date}`});
    }
  });
  state.history.filter(day=>day.status==='closed').forEach(day=>{
    if(!day.preCloseBalances||typeof day.preCloseBalances!=='object'){
      warnings.push({type:'missing_preclose_balances',label:`Jornada cerrada sin saldos iniciales históricos: ${day.date}`});
    }
    Object.entries(day.preCloseBalances||{}).forEach(([clientId,value])=>{
      if(!Number.isFinite(Number(value))||Number(value)<0){
        issues.push({type:'invalid_preclose_balance',label:`Saldo inicial histórico inválido: ${day.date} · ${clientId}`});
      }
    });
  });
  state.audit.forEach(entry=>{
    if(!entry.id)issues.push({type:'audit_missing_id',label:'Evento de auditoría sin identificador'});
    if(!entry.action)issues.push({type:'audit_missing_action',label:`Evento de auditoría sin acción: ${entry.id||'sin ID'}`});
    if(!Number(entry.createdAt))warnings.push({type:'audit_missing_date',label:`Evento de auditoría sin fecha: ${entry.id||entry.action||'desconocido'}`});
  });
  state.reconciliations.forEach(rec=>{
    if(rec.dayDate&&!dayDates.has(rec.dayDate))warnings.push({type:'orphan_reconciliation',label:`Conciliación sin jornada: ${rec.dayDate}`});
    if(Number(rec.countedCash)<0||Number(rec.verifiedTransfer)<0)issues.push({type:'invalid_reconciliation_amount',label:`Conciliación con valores negativos: ${rec.dayDate}`});
    if(Number(rec.cashDifference)!==Number(rec.countedCash)-Number(rec.expectedCash))warnings.push({type:'reconciliation_cash_mismatch',label:`Diferencia de efectivo inconsistente: ${rec.dayDate}`});
    if(Number(rec.transferDifference)!==Number(rec.verifiedTransfer)-Number(rec.expectedTransfer))warnings.push({type:'reconciliation_transfer_mismatch',label:`Diferencia de transferencias inconsistente: ${rec.dayDate}`});
  });

  state.loans.forEach(loan=>{
    if(Number(loan.remaining)<0)issues.push({type:'negative_loan_remaining',label:`Préstamo con saldo negativo: ${loan.person||loan.id}`});
    if(Number(loan.amount||0)<0)issues.push({type:'negative_loan_amount',label:`Préstamo con monto negativo: ${loan.person||loan.id}`});
  });

  const lastBackupAt=Number(state.settings.lastBackupAt||0);
  const backupAge=daysSince(lastBackupAt);
  if(!lastBackupAt)warnings.push({type:'never_backed_up',label:'Todavía no se registró ningún backup'});
  else if(backupAge>=7)warnings.push({type:'stale_backup',label:`Último backup hace ${backupAge} días`});
  else info.push({type:'backup_ok',label:`Último backup hace ${backupAge} día(s)`});
  const localSnapshots=readEmergencySnapshots();
  if(!localSnapshots.length)warnings.push({type:'no_emergency_snapshot',label:'No hay copias locales de emergencia'});
  else info.push({type:'emergency_snapshots',label:`${localSnapshots.length} copia(s) local(es) de emergencia`});
  if(state.storageInfo?.persisted===false)warnings.push({type:'storage_not_persistent',label:'El navegador no confirmó almacenamiento persistente'});
  if(state.storageInfo?.persisted===true)info.push({type:'storage_persistent',label:'Almacenamiento persistente confirmado'});

  const closedDays=state.history.filter(d=>d.status==='closed').length;
  info.push({type:'counts',label:`${state.clients.length} clientes · ${state.history.length} jornadas · ${closedDays} cerradas`});

  return {
    issues,
    warnings,
    info,
    score:Math.max(0,100-(issues.length*18)-(warnings.length*2)),
    checkedAt:Date.now()
  };
}

function validateBackupStructure(data){
  const errors=[];
  if(!data||typeof data!=='object')errors.push('El archivo no contiene un objeto válido.');
  if(!Array.isArray(data?.clients))errors.push('Falta la lista de clientes.');
  if(!Array.isArray(data?.days))errors.push('Falta la lista de jornadas.');
  const ids=new Set();
  (data?.clients||[]).forEach((client,index)=>{
    if(!client?.id)errors.push(`Cliente ${index+1} sin identificador.`);
    else if(ids.has(client.id))errors.push(`Identificador de cliente duplicado: ${client.id}.`);
    else ids.add(client.id);
    if(!client?.name?.trim())errors.push(`Cliente ${index+1} sin nombre.`);
    if(Number(client?.balance||0)<0)errors.push(`Saldo negativo en ${client?.name||'cliente '+(index+1)}.`);
  });
  const dates=new Set();
  (data?.days||[]).forEach((day,index)=>{
    if(!day?.date)errors.push(`Jornada ${index+1} sin fecha.`);
    else if(dates.has(day.date))errors.push(`Jornada duplicada: ${day.date}.`);
    else dates.add(day.date);
    if(day?.status&&!['preparation','active','closed'].includes(day.status))errors.push(`Estado inválido en jornada ${day.date||index+1}.`);
  });
  return errors;
}

  return state.history
    .filter(day=>day.status==='closed'&&day.date>=from&&day.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date));

function reportData(){
  const days=daysInReportRange();
  const byClient=new Map();
  let accredited=0,collected=0,cash=0,transfer=0,expenses=0,loanPayments=0,pending=0,managed=0,visitsWithoutPayment=0;
  days.forEach(day=>{
    const totals=calcDay(day);
    accredited+=totals.accredited;
    collected+=totals.paid;
    cash+=totals.cash;
    transfer+=totals.transfer;
    expenses+=totals.expenses;
    loanPayments+=totals.loanPayments;
    pending+=totals.pending;
    const stats=routeVisitStats(day);
    managed+=stats.managed;
    visitsWithoutPayment+=stats.visited;
    operationalClients(day).forEach(client=>{
      const payments=day.payments?.[client.id]||[];
      const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
      const acc=Number(day.accreditations?.[client.id]||0);
      const current=byClient.get(client.id)||{
        clientId:client.id,name:client.name,collected:0,accredited:0,
        visits:0,payments:0,cash:0,transfer:0
      };
      current.collected+=paid;
      current.accredited+=acc;
      current.visits+=1;
      current.payments+=payments.length;
      current.cash+=payments.filter(p=>p.method==='cash').reduce((s,p)=>s+Number(p.amount||0),0);
      current.transfer+=payments.filter(p=>p.method==='transfer').reduce((s,p)=>s+Number(p.amount||0),0);
      byClient.set(client.id,current);
    });
  });
  const clients=[...byClient.values()].sort((a,b)=>b.collected-a.collected||a.name.localeCompare(b.name,'es'));
  const average=days.length?Math.round(collected/days.length):0;
  const effectiveness=(collected+pending)>0?Math.round((collected/(collected+pending))*100):0;
  return {
    days,clients,accredited,collected,cash,transfer,expenses,loanPayments,
    net:collected-expenses-loanPayments,
    pending,average,effectiveness,managed,visitsWithoutPayment
  };
}

function parseMoneyInput(value){
  let text=String(value??'').trim().replace(/\s/g,'').replace(/\$/g,'');
  if(!text)return 0;

  const negative=text.startsWith('-');
  text=text.replace(/-/g,'').replace(/[^\d.,]/g,'');

  const lastComma=text.lastIndexOf(',');
  const lastDot=text.lastIndexOf('.');
  let normalized=text;

  if(lastComma>=0&&lastDot>=0){
    const decimalSeparator=lastComma>lastDot?',':'.';
    const thousandsSeparator=decimalSeparator===','?'.':',';
    normalized=text.split(thousandsSeparator).join('');
    normalized=normalized.replace(decimalSeparator,'.');
  }else if(lastComma>=0){
    const decimals=text.length-lastComma-1;
    normalized=decimals>0&&decimals<=2
      ?text.replace(/\./g,'').replace(',','.')
      :text.replace(/,/g,'');
  }else if(lastDot>=0){
    const decimals=text.length-lastDot-1;
    const dotCount=(text.match(/\./g)||[]).length;
    normalized=dotCount===1&&decimals>0&&decimals<=2
      ?text
      :text.replace(/\./g,'');
  }

  const number=Number((negative?'-':'')+normalized);
  return Number.isFinite(number)?roundCurrency(number):0;
}

  await put('settings',{key:'capital',value:200000});

  await put('settings',{key:'whatsappTemplate',value:'Buen día el total es {monto}'});
  await put('settings',{key:'testDebtCleanupV124',value:true});

  emergencySnapshotKeys().forEach(key=>{

  });

async function ensureCurrentDayOpeningBalances(){
  const day=state.day;
  if(!day||day.status==='closed'||day.openingBalances)return false;
  const allowed=new Set(day.clientIds||state.clients.filter(client=>client.active!==false).map(client=>client.id));
  day.openingBalances=Object.fromEntries(
    state.clients
      .filter(client=>allowed.has(client.id))
      .map(client=>[client.id,Math.max(0,Number(client.balance||0))])
  );
  day.openingBalancesInitializedAt=Date.now();
  day.openingBalancesInitializedBy='v1.45_compatibility';
  await put('days',day);
  state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
  await auditLog('opening_balances_initialized','Saldos iniciales de jornada congelados por compatibilidad',{
    dayDate:day.date,
    clients:Object.keys(day.openingBalances).length
  });
  return true;
}
async function init(){
  document.getElementById('date').textContent=niceDate(new Date());
  state.db=await openDB();
  const cleanStartApplied=await resetAllTestDataV126();
  state.clients=(await getAll('clients')).sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  if(!state.clients.length){
    for(const c of DEFAULT_CLIENTS) await put('clients',c);
    state.clients=[...DEFAULT_CLIENTS];
  }
  state.clients.sort((a,b)=>a.order-b.order);
  state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
  state.loans=(await getAll('loans')).sort((a,b)=>b.createdAt-a.createdAt);
  state.audit=(await getAll('audit')).sort((a,b)=>b.createdAt-a.createdAt);
  state.expenses=(await getAll('expenses')).sort((a,b)=>b.createdAt-a.createdAt);
  state.reconciliations=(await getAll('reconciliations')).sort((a,b)=>b.dayDate.localeCompare(a.dayDate));
  state.imports=(await getAll('imports')).sort((a,b)=>b.createdAt-a.createdAt);
  for(const s of await getAll('settings')) state.settings[s.key]=s.value;
  state.settings.routeSchedules=state.settings.routeSchedules&&typeof state.settings.routeSchedules==='object'
    ?state.settings.routeSchedules
    :{};
  state.settings.bankDiscountDefault=Math.max(0,Number(state.settings.bankDiscountDefault||0));
  const todayDay=state.history.find(day=>day.date===dateKey())||null;
  const openDay=state.history
    .filter(day=>day.status!=='closed')
    .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  state.day=todayDay||openDay||null;
  if(cleanStartApplied&&!state.day){
    await createDayForDate(dateKey(),{source:'clean_start_v126'});
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
    state.day=state.history.find(day=>day.date===dateKey())||null;
  }
  const testDebtCleared=await clearLegacyTestDebt();
  if(testDebtCleared){
    state.clients=(await getAll('clients')).sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  }
  await ensureCurrentDayOpeningBalances();
  await refreshStorageInfo();
  state.pendingRecovery=detectPendingRecovery();
  bindTabs();
  render();
  if(!newestEmergencySnapshot())setTimeout(()=>createEmergencySnapshot('initial',true),1200);
  setTimeout(()=>document.getElementById('splash').remove(),700);
}

function bindTabs(){
  document.querySelectorAll('.tab').forEach(button=>{
    button.onclick=()=>{
      if(document.getElementById('sheetBackdrop')?.classList.contains('show'))closeSheet();
      const nextTab=button.dataset.tab;
      if(!['today','clients','balance','more'].includes(nextTab))return;
      state.tab=nextTab;
      document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab===button));
      render();
    };
  });
  const backdrop=document.getElementById('sheetBackdrop');
  if(backdrop)backdrop.onclick=event=>{if(event.target.id==='sheetBackdrop')closeSheet()};
}

function render(){
  const titles={today:'CML Virtual',clients:'Clientes',balance:'Balance',more:'Más'};
  const title=document.getElementById('title');
  const view=document.getElementById('view');
  title.textContent=titles[state.tab]||'CML Virtual';
  view.classList.remove('view-enter');
  void view.offsetWidth;
  view.classList.add('view-enter');
  try{
    if(state.tab==='today')return renderToday();
    if(state.tab==='clients')return renderClients();
    if(state.tab==='balance')return renderBalance();
    if(state.tab==='more')return renderMore();
    state.tab='today';
    document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='today'));
    return renderToday();
  }catch(error){
    console.error(`Error al renderizar ${state.tab}`,error);
    view.innerHTML=`<div class="card">
      <div class="eyebrow">ERROR DE PANTALLA</div>
      <h2>No se pudo abrir ${escapeHtml(titles[state.tab]||'esta sección')}</h2>
      <p class="note">${escapeHtml(error?.message||String(error))}</p>
      <button class="btn secondary" onclick="recoverNavigation()">VOLVER A HOY</button>
    </div>`;
    auditLog('render_error','Error de renderizado',{tab:state.tab,message:error?.message||String(error)}).catch(console.error);
  }
}
function recoverNavigation(){
  state.tab='today';
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='today'));
  render();
}


function localDateFromKey(value){
  const [year,month,day]=String(value||dateKey()).split('-').map(Number);
  return new Date(year,month-1,day,12,0,0);
}
function weekdayScheduleKey(dayDate=state.day?.date||dateKey()){
  return ['sun','mon','tue','wed','thu','fri','sat'][localDateFromKey(dayDate).getDay()];
}
function weekdayScheduleLabel(key=weekdayScheduleKey()){
  return {sun:'domingo',mon:'lunes',tue:'martes',wed:'miércoles',thu:'jueves',fri:'viernes',sat:'sábado'}[key]||key;
}
function configuredRouteForDate(dayDate=state.day?.date||dateKey()){
  const key=weekdayScheduleKey(dayDate);
  const configured=state.settings.routeSchedules?.[key];
  if(!Array.isArray(configured))return [];
  const validIds=new Set(state.clients.filter(client=>client.active!==false).map(client=>client.id));
  return configured.filter(id=>validIds.has(id));
}
function shouldShowFridayPinReminder(dayDate=state.day?.date||dateKey()){
  return weekdayScheduleKey(dayDate)==='fri'&&state.settings.pinFridayReminderDismissedDate!==dayDate;
}
async function dismissFridayPinReminder(){
  const dayDate=state.day?.date||dateKey();
  state.settings.pinFridayReminderDismissedDate=dayDate;

  await auditLog('pin_friday_reminder_dismissed','Recordatorio de PINWEB descartado',{dayDate});

}

function configureRouteSchedule(key=weekdayScheduleKey()){

async function saveRouteSchedule(key){
  const ids=[...document.querySelectorAll('.route-schedule-client:checked')].map(input=>input.value);
  state.settings.routeSchedules={...(state.settings.routeSchedules||{}),[key]:ids};

    weekday:key,clients:ids.length
  });

async function applyConfiguredRoute(key=weekdayScheduleKey()){
  if(!state.day||state.day.status==='closed')return toast('No hay una jornada editable');
  const ids=(state.settings.routeSchedules?.[key]||[])
    .filter(id=>state.day.clientIds?.includes(id)&&state.clients.some(client=>client.id===id&&client.active!==false));
  if(!ids.length)return toast('La ruta sugerida no tiene clientes configurados');
  state.day.routeOrder=[...ids];
  state.day.routeScheduleApplied={
    weekday:key,
    appliedAt:Date.now(),
    clientIds:[...ids]
  };
  await saveDay();
  await auditLog('route_schedule_applied','Ruta sugerida aplicada',{
    weekday:key,clients:ids.length,dayDate:state.day.date
  });
  render();
  toast(`Ruta de ${weekdayScheduleLabel(key)} aplicada`);
}

async function saveVisitAction(clientId){
  ensureDayCollections(state.day);
  if(state.day.status!=='active')return toast('La ruta no está activa');

  const reason=document.getElementById('visitReason').value;
  const followUpDate=document.getElementById('visitFollowUp').value;
  const note=document.getElementById('visitNote').value.trim();
  if(!reason)return toast('Seleccioná un motivo');
  const previous=state.day.visits[clientId]||null;
  const record={status,reason,followUpDate,note,updatedAt:Date.now(),followUpResolvedAt:null,followUpResolution:''};
  state.day.visits[clientId]=record;
  await saveDay();
  await auditLog('route_visit_saved','Gestión de visita registrada',{clientId,previous,next:record});
  closeSheet();
  render();
  toast('Gestión guardada');

async function saveRescheduledFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const visit=day?.visits?.[clientId];
  const newDate=document.getElementById('followUpNewDate').value;
  const note=document.getElementById('followUpRescheduleNote').value.trim();
  if(!day||!visit)return toast('No se encontró el seguimiento');
  if(!newDate)return toast('Seleccioná una fecha');
  const previousDate=visit.followUpDate;
  visit.followUpDate=newDate;
  visit.note=note;
  visit.updatedAt=Date.now();
  visit.followUpResolvedAt=null;
  visit.followUpResolution='';
  await put('days',day);
  state.history.sort((a,b)=>b.date.localeCompare(a.date));
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_rescheduled','Seguimiento reprogramado',{clientId,dayDate,previousDate,newDate});
  showFollowUps();
  toast('Seguimiento reprogramado');

async function resolveFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const client=state.clients.find(c=>c.id===clientId);
  const visit=day?.visits?.[clientId];
  if(!day||!visit||!client)return toast('No se encontró el seguimiento');
  const resolution=prompt(`¿Cómo se resolvió el seguimiento de ${client.name}?`,'Contactado / resuelto');
  if(resolution===null)return;
  if(!resolution.trim())return toast('Ingresá una resolución');
  visit.followUpResolvedAt=Date.now();
  visit.followUpResolution=resolution.trim();
  visit.updatedAt=Date.now();
  await put('days',day);
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_resolved','Seguimiento resuelto',{clientId,dayDate,resolution:resolution.trim()});
  showFollowUps();
  toast('Seguimiento resuelto');
}

function operationalIncidents(day=state.day){
  if(!day)return [];
  const incidents=[];
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const importReady=accreditationImportReady(day);

  if(!importReady){
    incidents.push({
      id:'missing_import',severity:'critical',category:'preparation',
      title:'Falta confirmar la carga diaria',
      detail:'La jornada no tiene una carga manual o importación confirmada.',
      action:'showDailyLoad()',actionLabel:'CARGAR DATOS'
    });
  }
  if(!day.openingCashConfirmed){
    incidents.push({
      id:'opening_cash_unconfirmed',severity:'warning',category:'preparation',
      title:'Capital inicial sin confirmar',
      detail:`Capital actual: ${money(dayOpeningCash(day))}.`,
      action:"state.tab='today';closeSheet();render()",actionLabel:'REVISAR'
    });
  }
  if(day.status==='active'&&day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint!==dailyLoadFingerprint(day)){
    incidents.push({
      id:'route_snapshot_changed',severity:'critical',category:'closing',
      title:'La base financiera cambió después de generar la ruta',
      detail:'Los saldos, acreditaciones o pagos previos ya no coinciden con la revisión confirmada.',
      action:'showOperationalIncidents()',actionLabel:'REVISAR'
    });
  }

  clients.forEach(client=>{
    if(!client.phone?.trim()){
      incidents.push({
        id:`phone_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin teléfono`,
        detail:'No se podrá abrir WhatsApp ni enviar un comprobante directo.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
    if(!client.address?.trim()){
      incidents.push({
        id:`address_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin dirección`,
        detail:'No se podrá abrir la ubicación desde la ruta.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
  });

  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    const client=state.clients.find(item=>item.id===clientId);
    if(!Array.isArray(payments)){
      incidents.push({
        id:`payments_collection_${clientId}`,severity:'critical',category:'data',clientId,
        title:`Pagos inválidos en ${client?.name||clientId}`,
        detail:'La colección de pagos no tiene un formato válido.',
        action:'showControlCenter()',actionLabel:'CONTROL TÉCNICO'
      });
      return;
    }
    payments.forEach((payment,index)=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        incidents.push({
          id:`payment_${clientId}_${payment.id||index}`,severity:'critical',category:'data',clientId,
          title:`Pago inconsistente en ${client?.name||clientId}`,
          detail:`Monto: ${money(payment.amount)} · Forma: ${payment.method||'sin definir'}.`,
          action:`openPayment('${clientId}')`,actionLabel:'CORREGIR'
        });
      }
    });
  });

  if(totals.cash<0||totals.transfer<0||totals.paid<0||totals.expectedCash<0||totals.expectedTransfer<0){
    incidents.push({
      id:'negative_totals',severity:'critical',category:'data',
      title:'Totales operativos inválidos',
      detail:'Se detectaron valores negativos incompatibles con el cierre.',
      action:'showControlCenter()',actionLabel:'DIAGNOSTICAR'
    });
  }

  const reconciliation=getReconciliation(day.date);
  if(reconciliation){
    const cashDifference=Number(reconciliation.cashDifference||0);
    const transferDifference=Number(reconciliation.transferDifference||0);
    if(cashDifference||transferDifference){
      incidents.push({
        id:'reconciliation_difference',severity:'warning',category:'closing',
        title:'Conciliación con diferencia',
        detail:`Efectivo: ${money(cashDifference)} · Transferencias: ${money(transferDifference)}.`,
        action:'openClosePreview()',actionLabel:'REVISAR'
      });
    }
  }

  const expenses=state.expenses.filter(expense=>expense.dayDate===day.date);
  expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!['cash','transfer'].includes(expense.method||'cash')){
      incidents.push({
        id:`expense_${expense.id}`,severity:'critical',category:'data',
        title:'Gasto operativo inconsistente',
        detail:`${expense.detail||expense.category||'Sin detalle'} · ${money(expense.amount)}.`,
        action:'showExpenses()',actionLabel:'CORREGIR'
      });
    }
  });

  return incidents;
}

function exportOperationalIncidents(){
  if(!state.day)return toast('No hay una jornada activa');
  const rows=filteredOperationalIncidents();
  const lines=[
    'CML VIRTUAL - INCIDENCIAS OPERATIVAS',
    `Jornada: ${state.day.date}`,
    `Generado: ${new Date().toLocaleString('es-AR')}`,
    `Filtro: ${state.incidentFilter}`,
    `Cantidad: ${rows.length}`,
    ''
  ];
  if(!rows.length)lines.push('Sin incidencias para el filtro seleccionado.');
  rows.forEach((item,index)=>{
    lines.push(`${index+1}. [${incidentSeverityLabel(item.severity)}] ${item.title}`);
    lines.push(`   Categoría: ${incidentCategoryLabel(item.category)}`);
    lines.push(`   ${item.detail}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_incidencias_${state.day.date}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('operational_incidents_exported','Incidencias operativas exportadas',{

  });

function closeChecklist(day=state.day){
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const unmanaged=clients.filter(c=>clientRouteStatus(c,day).key==='pending');
  const invalidPayments=[];
  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    (payments||[]).forEach(payment=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        invalidPayments.push({clientId,payment});
      }
    });
  });
  const importReady=accreditationImportReady(day);
  const currentFingerprint=dailyLoadFingerprint(day);
  const routeSnapshotValid=Boolean(day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint===currentFingerprint);
  const incidents=operationalIncidents(day);
  const criticalIncidents=incidents.filter(item=>item.severity==='critical');
  const warningIncidents=incidents.filter(item=>item.severity==='warning');
  return {
    importReady,
    routeSnapshotValid,
    unmanaged,
    invalidPayments,
    incidents,
    criticalIncidents,
    warningIncidents,
    negativeTotals:totals.cash<0||totals.transfer<0||totals.paid<0,
    totals,
    openingCashValid:Number.isFinite(totals.openingCash)&&totals.openingCash>=0,
    criticalCount:criticalIncidents.length,
    warningCount:warningIncidents.length
  };
}

function canReopenDay(day){
  if(!day||day.status!=='closed')return {allowed:false,reason:'La jornada no está cerrada'};
  if(day.date!==dateKey())return {allowed:false,reason:'Solo puede reabrirse la jornada cerrada de hoy'};
  if(state.history.some(item=>item.date>day.date))return {allowed:false,reason:'Existe una jornada posterior'};
  if(Number(day.reopenCount||0)>=3)return {allowed:false,reason:'Se alcanzó el límite de reaperturas'};
  return {allowed:true,reason:''};
}
function reconstructPreCloseBalances(day){
  const result={};
  operationalClients(day).forEach(client=>{
    if(day.preCloseBalances&&Number.isFinite(Number(day.preCloseBalances[client.id]))){
      result[client.id]=Number(day.preCloseBalances[client.id]);
    }else{
      const accreditation=Number(day.accreditations?.[client.id]||0);
      const visitCredit=Number(day.visitCredits?.[client.id]||0);
      const paid=(day.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      result[client.id]=Math.max(0,Number(client.balance||0)-accreditation-visitCredit+paid);
    }
  });
  return result;
}
function openReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);
  if(!permission.allowed)return toast(permission.reason);
  const legacy=!day.preCloseBalances;
  openSheet(`<div class="sheet-handle"></div>
    <div class="toolbar"><div><h2>Reabrir jornada</h2><div class="note">${escapeHtml(day.date)}</div></div><span class="badge pending">ACCIÓN SENSIBLE</span></div>

      <p class="note">Para cerrarla nuevamente será obligatorio realizar una nueva conciliación.</p>
      ${legacy?`<p class="danger-text"><b>La jornada fue cerrada con una versión anterior. Los saldos previos serán reconstruidos matemáticamente y se creará una copia de emergencia.</b></p>`:''}
    </div>

    <button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">CANCELAR</button>`);

async function confirmReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);
  if(!permission.allowed)return toast(permission.reason);
  const reason=document.getElementById('reopenReason')?.value.trim()||'';
  const confirmation=document.getElementById('reopenConfirm')?.value.trim().toUpperCase()||'';
  if(reason.length<10)return toast('Ingresá un motivo claro de al menos 10 caracteres');
  if(confirmation!=='REABRIR')return toast('Escribí REABRIR para confirmar');
  if(!confirm('¿Confirmar la reapertura? Se anulará la conciliación actual.'))return;

  await createEmergencySnapshot('before_day_reopen',true);
  const previousBalances=reconstructPreCloseBalances(day);
  const previousClosure={
    closedAt:day.closedAt||null,
    summary:cloneData(day.summary||null),
    reconciliation:cloneData(day.reconciliation||getReconciliation(day.date)||null),
    reopenedAt:Date.now(),
    reason
  };

  try{
    for(const client of operationalClients(day)){
      if(previousBalances[client.id]===undefined)continue;
      client.balance=Number(previousBalances[client.id]);
      client.updatedAt=Date.now();
      await put('clients',client);
    }
    if(getReconciliation(day.date)){
      await del('reconciliations',day.date);
      state.reconciliations=state.reconciliations.filter(item=>item.dayDate!==day.date);
    }

    day.closureHistory=Array.isArray(day.closureHistory)?day.closureHistory:[];
    day.closureHistory.push(previousClosure);
    day.reopenHistory=Array.isArray(day.reopenHistory)?day.reopenHistory:[];
    day.reopenHistory.push({reopenedAt:Date.now(),reason,legacyBalanceReconstruction:!day.preCloseBalances});
    day.reopenCount=Number(day.reopenCount||0)+1;
    day.lastReopenedAt=Date.now();
    day.lastReopenReason=reason;
    day.status='active';
    day.reconciliationVoidedAt=Date.now();
    day.reconciliationVoidReason=reason;
    delete day.closedAt;
    delete day.summary;
    delete day.reconciliation;
    delete day.closingDraft;
    state.closingDraft=null;
    state.day=day;

    await put('days',day);
    await auditLog('day_reopened','Jornada reabierta',{
      dayDate:day.date,reason,reopenCount:day.reopenCount,
      legacyBalanceReconstruction:!day.preCloseBalances
    });
    await createEmergencySnapshot('day_reopened',true);
    closeSheet();
    render();
    toast('Jornada reabierta. Debe conciliarse nuevamente');
  }catch(error){
    console.error(error);
    toast('No se pudo reabrir la jornada');
  }
}

function addCalendarDays(dateString,days=1){
  const [year,month,day]=String(dateString||dateKey()).split('-').map(Number);
  const date=new Date(year,month-1,day+days,12,0,0);
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')
  ].join('-');
}
function nextOperationalDate(closedDate){
  const following=addCalendarDays(closedDate||dateKey(),1);
  return following<dateKey()?dateKey():following;
}
async function createDayForDate(dayDate,{source='manual'}={}){
  const existing=(await getAll('days')).find(day=>day.date===dayDate);
  if(existing){
    state.day=existing;
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
    state.tab='today';
    render();
    toast(existing.status==='closed'?'Esa jornada ya está cerrada':'Jornada existente abierta');
    return existing;
  }

  const activeClients=state.clients.filter(client=>client.active!==false);
  state.day={
    date:dayDate,
    status:'preparation',
    createdAt:Date.now(),
    openingCash:Number(state.settings.capital||0),
    openingCashConfirmed:false,
    clientIds:activeClients.map(client=>client.id),
    routeOrder:[],
    openingBalances:Object.fromEntries(
      activeClients.map(client=>[client.id,Math.max(0,Number(client.balance||0))])
    ),
    accreditations:Object.fromEntries(activeClients.map(client=>[client.id,0])),
    payments:Object.fromEntries(activeClients.map(client=>[client.id,[]])),
    visits:{},
    note:'',
    dailyLoad:null,
    accreditationImport:null,
    createdFrom:source
  };
  await saveDay();
  await auditLog('day_started','Día operativo iniciado',{dayDate,source});
  await createEmergencySnapshot('new_day_started',true);
  state.tab='today';
  render();
  toast(`Nueva jornada abierta: ${dayDate}`);
  return state.day;
}

function dailyLoadSummary(day=state.day){
  const clients=operationalClients(day);
  let previousBalanceTotal=0,accreditationTotal=0,paymentTotal=0,cashPayments=0,transferPayments=0,clientToCollect=0;
  let hasClientData=false;
  clients.forEach(client=>{
    const previousBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const payments=day?.payments?.[client.id]||[];
    const paid=payments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    if(previousBalance!==0||accreditation!==0||paid!==0)hasClientData=true;
    previousBalanceTotal+=previousBalance;
    accreditationTotal+=accreditation;
    paymentTotal+=paid;
    clientToCollect+=(previousBalance+accreditation-paid);
    payments.forEach(payment=>{
      if(payment.method==='cash')cashPayments+=Number(payment.amount||0);
      if(payment.method==='transfer')transferPayments+=Number(payment.amount||0);
    });
  });
  const capital=Number(day?.dailyLoad?.capital??dayOpeningCash(day)??200000);
  const pinAdvance=Number(day?.dailyLoad?.pinAdvance||0);
  const bagBalance=Number(day?.dailyLoad?.bagBalance||0);
  const loans=Number(day?.dailyLoad?.loans||0);
  const todayBalances=Number(day?.dailyLoad?.todayBalances||0);
  const todaySales=Number(day?.dailyLoad?.todaySales||0);
  const cash=Number(day?.dailyLoad?.cash||0);
  const manualToCollect=Number(day?.dailyLoad?.manualToCollect||0);
  const bankDiscount=Math.max(0,Number(day?.dailyLoad?.bankDiscount||0));
  const toCollect=hasClientData?clientToCollect:manualToCollect;
  const bagTotal=bagBalance+todayBalances-todaySales+cash+toCollect-capital-pinAdvance-loans;
  const netProfit=bagTotal-bankDiscount;
  const debtors=clients.filter(client=>clientDue(client,day)>0).length;
  return {
    capital,pinAdvance,bagBalance,loans,todayBalances,todaySales,cash,manualToCollect,bankDiscount,
    previousBalanceTotal,accreditationTotal,paymentTotal,cashPayments,transferPayments,
    clientToCollect,toCollect,bagTotal,netProfit,hasClientData,debtors,clients:clients.length
  };
}

function actualizarTotalCargaOriginal(){

      const sid=sanitizeCargaId(c.codigo);
      const client=clienteSistemaPorIndice(index);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=roundCurrency(parseFloat(document.getElementById(`acred_${sid}`)?.value)||0);
      const pago=roundCurrency(parseFloat(document.getElementById(`pago_${sid}`)?.value)||0);
      if(saldoAnterior!==0||acred!==0||pago!==0)hayClientes=true;
      totalACobrarClientes+=(saldoAnterior+acred-pago);
    });
    const totalACobrar=document.getElementById('totalACobrar');
    if(totalACobrar)totalACobrar.textContent=`Total a cobrar: $${fmt(totalACobrarClientes)}`;

    const capital=roundCurrency(parseFloat(document.getElementById('capital')?.value)||0);
    const adelantoPin=roundCurrency(parseFloat(document.getElementById('adelantoPin')?.value)||0);
    const saldoBolsaTotal=roundCurrency(parseFloat(document.getElementById('saldoBolsaTotal')?.value)||0);
    const prestamos=roundCurrency(parseFloat(document.getElementById('prestamos')?.value)||0);
    const saldosHoyTotal=roundCurrency(parseFloat(document.getElementById('saldosHoyTotal')?.value)||0);
    const ventasHoyTotal=roundCurrency(parseFloat(document.getElementById('ventasHoyTotal')?.value)||0);
    const efectivoTotal=roundCurrency(parseFloat(document.getElementById('efectivoTotal')?.value)||0);
    const aCobrarManual=document.getElementById('aCobrarManual')?.value;
    const descuentoBancario=Math.max(0,roundCurrency(parseFloat(document.getElementById('descuentoBancario')?.value)||0));
    const aCobrar=hayClientes?totalACobrarClientes:(parseFloat(aCobrarManual)||0);
    const gananciaBruta=roundCurrency(saldoBolsaTotal+saldosHoyTotal-ventasHoyTotal+efectivoTotal+aCobrar-capital-adelantoPin-prestamos);
    const gananciaNeta=roundCurrency(gananciaBruta-descuentoBancario);
    const gananciaBrutaEl=document.getElementById('gananciaBruta');
    const descuentoEl=document.getElementById('descuentoBancarioVista');
    const totalBolsa=document.getElementById('totalBolsa');
    if(gananciaBrutaEl)gananciaBrutaEl.textContent=`$${fmt(gananciaBruta)}`;
    if(descuentoEl)descuentoEl.textContent=`-$${fmt(descuentoBancario)}`;
    if(totalBolsa)totalBolsa.textContent=`$${fmt(gananciaNeta)}`;
  }catch(err){
    console.log('Error en actualizarTotal:',err.message);
  }
}
function validarMontosCargaOriginal(){
  clientesCargaOriginal.forEach(c=>{
    const sid=sanitizeCargaId(c.codigo);
    document.getElementById(`acred_${sid}`)?.classList.remove('campo-alerta');
  });
  const alertas=[];
  clientesCargaOriginal.forEach(c=>{
    if(!c.acredFijo||c.acredFijo===0)return;
    const sid=sanitizeCargaId(c.codigo);
    const el=document.getElementById(`acred_${sid}`);
    if(!el)return;
    const ingresado=parseFloat(el.value)||0;
    if(ingresado===0)return;
    if(ingresado>c.acredFijo*2){
      el.classList.add('campo-alerta');
      alertas.push(`${c.nombre}: ingresaste $${fmt(ingresado)} pero el acumulado previo es $${fmt(c.acredFijo)}`);
    }
  });
  const div=document.getElementById('alertaMontos');
  if(alertas.length>0){
    div.innerHTML='<strong>⚠️ Verificá estos montos antes de copiar:</strong>'+alertas.map(a=>`• ${a}`).join('<br>');
    div.style.display='block';
  }else{
    div.style.display='none';
  }
  return alertas.length;
}
async function guardarCargaOriginalEnSistema(totalACobrar,total){
  const nextAccreditations={};
  const nextPayments={};

  clientesCargaOriginal.forEach((c,index)=>{
    const sid=sanitizeCargaId(c.codigo);
    const systemClient=clienteSistemaPorIndice(index);
    const clientId=systemClient?.id||String(c.codigo);
    const acred=roundCurrency(parseFloat(document.getElementById(`acred_${sid}`)?.value)||0);
    const pago=roundCurrency(parseFloat(document.getElementById(`pago_${sid}`)?.value)||0);
    const forma=document.getElementById(`forma_${sid}`)?.value||'';

    nextAccreditations[clientId]=acred;
    nextPayments[clientId]=pago!==0?[{
      id:preparationPaymentFor(state.day,clientId)?.id||crypto.randomUUID?.()||'pay_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      amount:pago,
      method:forma==='Efectivo'?'cash':forma==='Transferencia'?'transfer':'',
      source:'daily_load',
      createdAt:preparationPaymentFor(state.day,clientId)?.createdAt||Date.now(),
      updatedAt:Date.now()
    }]:[];
  });

  const capital=roundCurrency(parseFloat(document.getElementById('capital')?.value)||0);
  const adelantoPin=roundCurrency(parseFloat(document.getElementById('adelantoPin')?.value)||0);
  const saldoBolsaTotal=roundCurrency(parseFloat(document.getElementById('saldoBolsaTotal')?.value)||0);
  const prestamos=roundCurrency(parseFloat(document.getElementById('prestamos')?.value)||0);
  const saldosHoyTotal=roundCurrency(parseFloat(document.getElementById('saldosHoyTotal')?.value)||0);
  const ventasHoyTotal=roundCurrency(parseFloat(document.getElementById('ventasHoyTotal')?.value)||0);
  const efectivoTotal=roundCurrency(parseFloat(document.getElementById('efectivoTotal')?.value)||0);
  const aCobrarManual=roundCurrency(parseFloat(document.getElementById('aCobrarManual')?.value)||0);
  const bankDiscount=Math.max(0,roundCurrency(parseFloat(document.getElementById('descuentoBancario')?.value)||0));
  const netProfit=roundCurrency(total-bankDiscount);

  state.day.openingCash=capital;
  state.day.openingCashConfirmed=true;
  state.day.accreditations=nextAccreditations;
  state.day.payments=nextPayments;
  state.day.dailyLoad={
    source:'manual',
    confirmedAt:Date.now(),
    capital,
    pinAdvance:adelantoPin,
    bagBalance:saldoBolsaTotal,
    loans:prestamos,
    todayBalances:saldosHoyTotal,
    todaySales:ventasHoyTotal,
    cash:efectivoTotal,
    manualToCollect:aCobrarManual,
    bankDiscount,
    totals:{toCollect:totalACobrar,bagTotal:total,netProfit},
    clients:clientesCargaOriginal.length
  };
  state.day.accreditationImport=null;
  state.day.routeOrder=clientesCargaOriginal.map((c,index)=>{
    const systemClient=clienteSistemaPorIndice(index);
    return systemClient?.id||String(c.codigo);
  });
  delete state.day.preRouteValidation;
  delete state.day.routeSnapshot;
  await saveDay();
}
async function generarResumenCargaOriginal(){
  try{
    validarMontosCargaOriginal();

    const capital=document.getElementById('capital').value;
    const adelantoPin=document.getElementById('adelantoPin').value;
    const saldoBolsaTotal=document.getElementById('saldoBolsaTotal').value;
    const prestamos=document.getElementById('prestamos').value;
    const saldosHoyTotal=document.getElementById('saldosHoyTotal').value;
    const ventasHoyTotal=document.getElementById('ventasHoyTotal').value;
    const efectivoTotal=document.getElementById('efectivoTotal').value;
    const aCobrarManual=document.getElementById('aCobrarManual').value;
    const descuentoBancario=Math.max(0,parseFloat(document.getElementById('descuentoBancario').value)||0);

    let totalACobrar=0;
    let hayDatos=false;
    let textoClientes='';

    clientesCargaOriginal.forEach((c,index)=>{
      const sid=sanitizeCargaId(c.codigo);
      const client=clienteSistemaPorIndice(index);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=parseFloat(document.getElementById(`acred_${sid}`).value)||0;
      const pago=parseFloat(document.getElementById(`pago_${sid}`).value)||0;
      const forma=document.getElementById(`forma_${sid}`).value;
      if(saldoAnterior!==0||acred!==0||pago!==0){
        hayDatos=true;
        const pendiente=saldoAnterior+acred-pago;
        totalACobrar+=pendiente;
        textoClientes+=`${c.nombre}: saldo anterior ${fmt(saldoAnterior)}, acreditación ${fmt(acred)}, pagó ${fmt(pago)} ${forma||''} -> pendiente ${fmt(pendiente)}
`;
      }
    });

    if(!hayDatos){
      textoClientes='(sin datos cargados)\n';
      totalACobrar=parseFloat(aCobrarManual)||0;
    }

    let texto='CLIENTES (acreditaciones / pagó / forma):\n';
    texto+=textoClientes;
    texto+=`\nTotal a cobrar (pendiente): ${fmt(totalACobrar)}\n`;
    texto+='\nBALANCE BOLSA TOTAL\n';
    texto+=`Capital: ${fmt(capital)}\n`;
    texto+=`Adelanto PIN: ${fmt(adelantoPin)}\n`;
    texto+=`Saldo en bolsa: ${fmt(saldoBolsaTotal)}\n`;
    texto+=`Préstamos: ${fmt(prestamos)}\n`;
    texto+=`Saldos de hoy: ${fmt(saldosHoyTotal)}\n`;
    texto+=`Ventas de hoy: ${fmt(ventasHoyTotal)}\n`;
    texto+=`Efectivo: ${fmt(efectivoTotal)}\n`;
    texto+=`A cobrar: ${fmt(totalACobrar)}\n`;

    const total=roundCurrency((parseFloat(saldoBolsaTotal)||0)+(parseFloat(saldosHoyTotal)||0)-(parseFloat(ventasHoyTotal)||0)+(parseFloat(efectivoTotal)||0)+totalACobrar-(parseFloat(capital)||0)-(parseFloat(adelantoPin)||0)-(parseFloat(prestamos)||0));
    const gananciaNeta=roundCurrency(total-descuentoBancario);
    texto+=`Ganancia bruta: ${fmt(total)}\n`;
    texto+=`Descuento bancario: ${fmt(descuentoBancario)}\n`;
    texto+=`Ganancia neta: ${fmt(gananciaNeta)}\n`;

    const resultadoDiv=document.getElementById('resultado');
    resultadoDiv.textContent=texto;
    resultadoDiv.style.color='#c8e6ff';
    resultadoDiv.style.display='block';
    document.getElementById('copyBtn').style.display='block';
    resultadoDiv.scrollIntoView({behavior:'smooth',block:'center'});

    await guardarCargaOriginalEnSistema(totalACobrar,total);

      dayDate:state.day.date,totalACobrar,gananciaBruta:total,descuentoBancario,gananciaNeta
    });

    const allRouteClients=operationalClients(state.day);
    const debtors=allRouteClients.filter(client=>clientDue(client,state.day)>0);
    state.day.routeOrder=allRouteClients.map(client=>client.id);

      createdAt:Date.now(),
      totalToCollect:debtors.reduce((sum,client)=>sum+clientDue(client,state.day),0),

    resultadoDiv.style.color='#ff6b6b';

function dailyLoadValidation(day=state.day){
  const rows=[],errors=[];
  let previous=0,accredited=0,paid=0,cash=0,transfer=0,toCollect=0;
  operationalClients(day).forEach(client=>{
    const openingBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const preparationPayments=(day?.payments?.[client.id]||[]).filter(payment=>payment.source==='daily_load');
    const preparationPaid=preparationPayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    const remaining=openingBalance+accreditation-preparationPaid;
    if(!Number.isFinite(accreditation)||accreditation<0)errors.push(`${client.name}: acreditación inválida`);
    if(!Number.isFinite(preparationPaid)||preparationPaid<0)errors.push(`${client.name}: pago inválido`);
    if(preparationPayments.length>1)errors.push(`${client.name}: más de un pago cargado`);
    preparationPayments.forEach(payment=>{
      if(payment.method==='cash')cash+=Number(payment.amount||0);
      else if(payment.method==='transfer')transfer+=Number(payment.amount||0);
      else errors.push(`${client.name}: forma de pago inválida`);
    });
    previous+=openingBalance; accredited+=accreditation; paid+=preparationPaid; toCollect+=remaining;
    rows.push({
      clientId:client.id,name:client.name,openingBalance,accreditation,
      paid:preparationPaid,method:preparationPayments[0]?.method||'',remaining
    });
  });
  const debtors=rows.filter(row=>row.remaining>0);
  return {rows,errors,warnings:[],debtors,totals:{previous,accredited,paid,cash,transfer,toCollect},valid:errors.length===0};
}
function dailyLoadFingerprint(day=state.day){
  const validation=dailyLoadValidation(day);
  const source=[
    day?.date||'',dayOpeningCash(day),Number(day?.dailyLoad?.pinAdvance||0),Number(day?.dailyLoad?.bagBalance||0),Number(day?.dailyLoad?.bankDiscount||0),
    ...validation.rows.map(row=>[row.clientId,row.openingBalance,row.accreditation,row.paid,row.method,row.remaining].join(':'))
  ].join('|');
  let hash=2166136261;
  for(let index=0;index<source.length;index++){hash^=source.charCodeAt(index);hash=Math.imul(hash,16777619);}
  return (hash>>>0).toString(16).padStart(8,'0');
}

async function activateRoute(validated=false){

  }
  const debtors=operationalClients(state.day).filter(client=>clientDue(client,state.day)>0);
  if(!debtors.length)return toast('No hay clientes con deuda para generar la ruta');
  const total=Object.values(state.day.accreditations||{}).reduce((sum,value)=>sum+Number(value||0),0);
  const toCollect=debtors.reduce((sum,client)=>sum+clientDue(client,state.day),0);

  state.day.routeActivatedAt=Date.now();

    createdAt:Date.now(),fingerprint:currentFingerprint,totalToCollect:toCollect,
    clients:debtors.map(client=>({

      accreditation:Number(state.day.accreditations?.[client.id]||0),
      preparationPaid:Number(preparationPaymentFor(state.day,client.id)?.amount||0),
      remaining:clientDue(client,state.day)
    }))
  };
  await saveDay();
  await auditLog('route_activated','Mensajes y hoja de ruta generados',{
    clients:debtors.length,accredited:total,toCollect,

function calcDay(d){
  ensureDayCollections(d);
  let accredited=0,visitAmounts=0,paid=0,cash=0,transfer=0,currentPending=0;
  const snapshotByClient=new Map(
    (d.routeSnapshot?.clients||[]).map(item=>[item.clientId,Number(item.remaining||0)])
  );
  let plannedInitial=Number(d.routeSnapshot?.totalToCollect||0);
  let plannedRemaining=0;

  operationalClients(d).forEach(client=>{
    const accreditation=Number(d.accreditations?.[client.id]||0);
    const visitAmount=Number(d.visitCredits?.[client.id]||0);
    accredited+=accreditation;
    visitAmounts+=visitAmount;

    const routePayments=routePaymentsFor(client.id,d);
    const routePaid=routePayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    routePayments.forEach(payment=>{
      const amount=Number(payment.amount||0);
      paid+=amount;
      payment.method==='cash'?cash+=amount:transfer+=amount;
    });

    currentPending+=clientDue(client,d);

    const initialForClient=snapshotByClient.has(client.id)
      ?snapshotByClient.get(client.id)
      :Math.max(0,accreditation-(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((sum,payment)=>sum+Number(payment.amount||0),0));
    plannedRemaining+=Math.max(0,initialForClient-routePaid);
  });

  if(!d.routeSnapshot?.totalToCollect){
    plannedInitial=operationalClients(d).reduce((sum,client)=>{
      const accreditation=Number(d.accreditations?.[client.id]||0);
      const paidBefore=(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((subtotal,payment)=>subtotal+Number(payment.amount||0),0);
      return sum+Math.max(0,accreditation-paidBefore);
    },0);
  }

  plannedRemaining=Math.min(plannedInitial,plannedRemaining);
  const plannedCollected=Math.max(0,plannedInitial-plannedRemaining);
  const expense=expenseTotals(d.date);
  const loanPayments=state.loans.reduce((totals,loan)=>{
    (loan.payments||[]).forEach(payment=>{
      if(payment.dayDate!==d.date)return;
      const amount=Number(payment.amount||0);
      totals.total+=amount;
      payment.method==='transfer'?totals.transfer+=amount:totals.cash+=amount;
    });
    return totals;
  },{total:0,cash:0,transfer:0});

  const openingCash=dayOpeningCash(d);
  const expectedCash=openingCash+cash-expense.cash-loanPayments.cash;
  const expectedTransfer=transfer-expense.transfer-loanPayments.transfer;
  const totalFunds=cash+transfer;

  return {
    accredited,visitAmounts,paid,cash,transfer,totalFunds,
    toCollect:plannedInitial,plannedInitial,plannedCollected,plannedRemaining,
    pending:currentPending,currentPending,
    expenses:expense.total,cashExpenses:expense.cash,transferExpenses:expense.transfer,
    loanPayments:loanPayments.total,loanCashPayments:loanPayments.cash,loanTransferPayments:loanPayments.transfer,
    openingCash,expectedCash,expectedTransfer,net:paid-expense.total-loanPayments.total
  };
}

  if(!day)return;
  ensureDayCollections(day);
  const client=state.clients.find(c=>c.id===clientId);
  if(!client)return;
  const payments=day.payments?.[clientId]||[];
  const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
  const total=Number(day.accreditations?.[clientId]||0)+Number(day.visitCredits?.[clientId]||0);
  const previous=day.visits?.[clientId];

  if(total===0&&paid>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago recibido durante la visita',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago recibido durante la visita'
    };
    return;
  }
  if(paid>=total&&total>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago registrado',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago registrado'
    };
    return;
  }
  if(paid>0){
    day.visits[clientId]={
      status:'partial',
      reason:'Pago parcial registrado',
      followUpDate:previous?.followUpDate||'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:null,
      followUpResolution:''
    };
    return;
  }
  if(previous?.status==='paid'||previous?.status==='partial'){
    delete day.visits[clientId];
  }
}
function latestDayPayment(day=state.day){

async function registerPayment(clientId,amount,method,source='manual'){
  if(state.paymentLock)throw new Error('El pago anterior todavía se está guardando');
  state.paymentLock=true;
  try{
    const client=state.clients.find(c=>c.id===clientId);
    if(!client||!state.day||state.day.status!=='active')throw new Error('Jornada o cliente inválido');
    const remaining=clientDue(client);
    if(amount<=0)throw new Error('Monto inválido');
    if(!['cash','transfer'].includes(method))throw new Error('Forma de pago inválida');

    const now=Date.now();
    const existing=(state.day.payments?.[clientId]||[]).find(payment=>
      Number(payment.amount)===Number(amount)&&
      payment.method===method&&
      now-Number(payment.createdAt||0)<8000
    );
    if(existing)throw new Error('Posible cobro duplicado: esperá unos segundos');

    state.day.payments[clientId]=state.day.payments[clientId]||[];
    const payment={id:crypto.randomUUID?.()||String(now),amount,method,createdAt:now,source};
    state.day.payments[clientId].push(payment);
    recalculateClientVisitState(clientId,state.day);
    await saveDay();
    state.lastPaymentAction={type:'created',clientId,paymentId:payment.id,createdAt:now};
    const totalPaidForClient=(state.day.payments?.[clientId]||[])
      .reduce((sum,item)=>sum+Number(item.amount||0),0);
    const totalObligationForClient=
      dayOpeningBalance(client,state.day)+
      Number(state.day.accreditations?.[clientId]||0)+
      Number(state.day.visitCredits?.[clientId]||0);
    const remainingAfterPayment=clientDue(client,state.day);
    const overpayment=Math.max(0,totalPaidForClient-totalObligationForClient);
    state.day.lastBalanceUpdate={
      updatedAt:Date.now(),
      clientId,
      paymentId:payment.id,
      amount,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:operationalClients(state.day).reduce((sum,item)=>sum+clientDue(item,state.day),0)
    };
    await saveDay();
    await auditLog('payment_created','Pago registrado y balance actualizado',{
      clientId,amount,method,source,paymentId:payment.id,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:state.day.lastBalanceUpdate.totalPending
    });
    return payment;
  }finally{
    state.paymentLock=false;
  }
}

async function undoLastPayment(){
  const action=state.lastPaymentAction;
  if(!action)return toast('No hay una operación reciente para deshacer');
  if(Date.now()-Number(action.createdAt||0)>300000){
    state.lastPaymentAction=null;
    return toast('El plazo para deshacer venció');
  }
  if(!state.day||state.day.status!=='active')return toast('La ruta no está activa');
  const found=findDayPayment(action.clientId,action.paymentId);
  if(action.type==='created'){
    if(!found.payment)return toast('El pago ya no existe');
    const removed={...found.payment};
    found.payments.splice(found.index,1);
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_undo','Se deshizo un pago recién registrado',{
      clientId:action.clientId,paymentId:action.paymentId,amount:removed.amount,method:removed.method
    });
  }else if(action.type==='edited'){
    if(!found.payment||!action.previous)return toast('No se puede restaurar el pago');
    const current={...found.payment};
    Object.assign(found.payment,action.previous,{restoredAt:Date.now()});
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_edit_undo','Se deshizo la edición de un pago',{
      clientId:action.clientId,paymentId:action.paymentId,
      previous:{amount:current.amount,method:current.method},
      restored:{amount:action.previous.amount,method:action.previous.method}
    });
  }else{
    return toast('La operación no admite deshacer');
  }
  state.lastPaymentAction=null;
  closeSheet();
  render();
  toast('Operación deshecha');
}

async function closeDay(reconciled=false){
  if(!reconciled)return openClosePreview();
  if(state.day.status==='closed')return toast('El día ya está cerrado');
  const checklist=closeChecklist(state.day);
  if(checklist.criticalCount)return toast('El cierre está bloqueado por inconsistencias');
  const reconciliation=getReconciliation(state.day.date);
  if(!reconciliation)return toast('Primero realizá la conciliación');
  if(!confirm('¿Confirmar el cierre definitivo del día?'))return;
  const t=calcDay(state.day);
  state.day.preCloseBalances={};
  operationalClients(state.day).forEach(client=>{
    state.day.preCloseBalances[client.id]=dayOpeningBalance(client,state.day);
  });
  state.day.status='closed';
  state.day.closedAt=Date.now();
  state.day.summary=t;
  state.day.reconciliation={...reconciliation};
  state.day.adjustments=state.day.adjustments||[];
  for(const c of operationalClients(state.day)){
    const due=
      dayOpeningBalance(c,state.day)+
      Number(state.day.accreditations[c.id]||0)+
      Number(state.day.visitCredits?.[c.id]||0);
    const paid=(state.day.payments[c.id]||[]).reduce((s,p)=>s+Number(p.amount||0),0);
    c.balance=Math.max(0,due-paid);
    c.updatedAt=Date.now();
    await put('clients',c);
  }
  await saveDay();
  const closedDate=state.day.date;
  await auditLog('day_closed','Día cerrado',{summary:t,reconciliation,preCloseBalances:state.day.preCloseBalances,reopenCount:Number(state.day.reopenCount||0)});
  await createEmergencySnapshot('day_closed',true);
  closeSheet();
  await startNextDay(closedDate);
}

function exportDaySummary(dayDate){
  const d=state.history.find(x=>x.date===dayDate)||state.day;
  if(!d)return toast('No se encontró el día');
  const totals=calcDay(d);
  const r=d.reconciliation||getReconciliation(dayDate);
  const lines=[
    'CML VIRTUAL - RESUMEN DIARIO',
    `Fecha: ${dayDate}`,
    '',
    `Acreditado: ${money(totals.accredited)}`,
    `Cobrado: ${money(totals.paid)}`,
    `Efectivo: ${money(totals.cash)}`,
    `Transferencias: ${money(totals.transfer)}`,
    `Gastos: ${money(totals.expenses)}`,
    `Neto: ${money(totals.net)}`,
    `Pendiente: ${money(totals.pending)}`,
    '',
    `Origen de carga: ${d.dailyLoad?.source==='import'?'Importación':'Manual'}`,
    `Carga confirmada: ${d.dailyLoad?.confirmedAt?formatDateTime(d.dailyLoad.confirmedAt):'No'}`,
    `PINWEB importado: ${d.accreditationImport?'Sí':'No'}`,
    `Coincidencias PINWEB: ${d.accreditationImport?.matched||0}`,
    `Total importado PINWEB: ${money(d.accreditationImport?.total||0)}`,
    `Revisión previa a ruta: ${d.preRouteValidation?.confirmedAt?formatDateTime(d.preRouteValidation.confirmedAt):'No'}`,
    `Huella de control: ${d.routeSnapshot?.fingerprint||d.preRouteValidation?.fingerprint||'Sin huella'}`,
    `Orden de ruta: ${operationalClients(d).map(c=>c.name).join(' > ')}`,
    `Cantidad de reaperturas: ${Number(d.reopenCount||0)}`,
    ''
  ];
  if(Array.isArray(d.reopenHistory)&&d.reopenHistory.length){
    lines.push('REAPERTURAS');
    d.reopenHistory.forEach((item,index)=>lines.push(`${index+1}. ${formatDateTime(item.reopenedAt)} | ${item.reason}`));
    lines.push('');
  }
  if(r){
    lines.push('CONCILIACIÓN');
    lines.push(`Cierre con clientes sin gestionar: ${r.unmanagedClients?.length||0}`);
    if(r.unmanagedReason)lines.push(`Motivo: ${r.unmanagedReason}`);
    lines.push(`Efectivo contado: ${money(r.countedCash)}`);
    if(r.cashBreakdown){
      lines.push('Desglose de efectivo:');
      Object.entries(r.cashBreakdown).filter(([,qty])=>Number(qty)>0).sort((a,b)=>Number(b[0])-Number(a[0])).forEach(([value,qty])=>{
        lines.push(`  ${qty} x ${money(Number(value))} = ${money(Number(value)*Number(qty))}`);
      });
    }
    lines.push(`Transferencias verificadas: ${money(r.verifiedTransfer)}`);
    lines.push(`Diferencia total: ${money(r.cashDifference+r.transferDifference)}`);
    if(r.reason)lines.push(`Justificación: ${r.reason}`);
    lines.push('');
  }
  lines.push('CLIENTES');
  operationalClients(d).forEach(c=>{
    const accreditation=Number(d.accreditations?.[c.id]||0);
    const paid=(d.payments?.[c.id]||[]).reduce((sum,p)=>sum+Number(p.amount||0),0);
    const status=clientRouteStatus(c,d);
    const visit=visitRecord(c.id,d);
    const openingBalance=dayOpeningBalance(c,d);
    lines.push(`${c.name} | Saldo inicial: ${money(openingBalance)} | Acreditación: ${money(accreditation)} | Pagado: ${money(paid)} | Pendiente: ${money(clientDue(c,d))} | Estado: ${status.label}${visit?.reason?' | Motivo: '+visit.reason:''}${visit?.followUpDate?' | Seguimiento: '+visit.followUpDate:''}${visit?.followUpResolvedAt?' | Resolución: '+(visit.followUpResolution||'Resuelto'):''}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_Resumen_${dayDate}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('day_summary_exported','Resumen diario exportado',{dayDate});
  toast('Resumen exportado');
}

function clientStatementDefaultRange(){
  const today=new Date();
  const from=new Date(today.getFullYear(),today.getMonth()-2,1);
  return {from:dateKey(from),to:dateKey(today)};
}
function clientStatementRange(){
  const defaults=clientStatementDefaultRange();
  return {
    from:state.statementFrom||defaults.from,
    to:state.statementTo||defaults.to
  };
}
function clientStatementRows(clientId){
  const client=state.clients.find(item=>item.id===clientId);
  if(!client)return [];
  const {from,to}=clientStatementRange();
  const days=[...state.history];
  if(state.day&&!days.some(day=>day.date===state.day.date))days.push(state.day);
  return days
    .filter(day=>day.date>=from&&day.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(day=>{
      const accreditation=Number(day.accreditations?.[clientId]||0);
      const payments=Array.isArray(day.payments?.[clientId])?day.payments[clientId]:[];
      const cash=payments.filter(payment=>payment.method==='cash').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const transfer=payments.filter(payment=>payment.method==='transfer').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const paid=cash+transfer;
      const opening=Number(day.preCloseBalances?.[clientId]);
      const hasOpening=Number.isFinite(opening);
      const closing=hasOpening?Math.max(0,opening+accreditation-paid):null;
      const visit=day.visits?.[clientId]||null;
      const relevant=hasOpening||accreditation||paid||visit;
      return {
        date:day.date,
        status:day.status,
        opening:hasOpening?opening:null,
        accreditation,
        cash,
        transfer,
        paid,
        closing,
        visit,
        relevant
      };
    })
    .filter(row=>row.relevant);
}
function clientStatementSummary(rows){
  const accredited=rows.reduce((sum,row)=>sum+row.accreditation,0);
  const cash=rows.reduce((sum,row)=>sum+row.cash,0);
  const transfer=rows.reduce((sum,row)=>sum+row.transfer,0);
  const paid=cash+transfer;
  const managed=rows.filter(row=>row.visit?.status&&row.visit.status!=='pending').length;
  const firstOpening=rows.find(row=>row.opening!==null)?.opening??null;
  const lastClosing=[...rows].reverse().find(row=>row.closing!==null)?.closing??null;
  return {accredited,cash,transfer,paid,managed,firstOpening,lastClosing};
}
function clientStatementVisitLabel(visit){
  if(!visit)return 'Sin gestión';
  return {
    paid:'Pagado',
    partial:'Pago parcial',
    visited:'Visitado',
    rescheduled:'Reprogramado',
    pending:'Pendiente'
  }[visit.status]||visit.status||'Sin gestión';
}

function setQuickClientStatementRange(clientId,type){
  const today=new Date();
  let from,to=dateKey(today);
  if(type==='month'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth(),1));
  }else if(type==='previous'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth()-1,1));
    to=dateKey(new Date(today.getFullYear(),today.getMonth(),0));
  }else if(type==='90'){
    const start=new Date(today);
    start.setDate(start.getDate()-89);
    from=dateKey(start);
  }else{
    from='2000-01-01';
  }
  state.statementFrom=from;
  state.statementTo=to;
  showClientStatement(clientId);
}

        <div class="snapshot-facts">
          <div class="snapshot-fact"><span>Jornada</span><b>${escapeHtml(summary.dayDate||'Sin jornada')}</b></div>

        </div>
        ${beforeLatestClose?`<p class="danger-text"><b>Esta copia es anterior al último cierre.</b></p>`:''}
        ${errors.length?`<p class="danger-text">${errors.map(escapeHtml).join(' · ')}</p>`:''}
        <div class="list-card-actions">
          <button class="btn small" ${errors.length?'disabled':''} onclick="restoreEmergencySnapshot('${snapshot._key}')">RESTAURAR</button>
          <button class="btn small secondary" onclick="exportEmergencySnapshot('${snapshot._key}')">EXPORTAR</button>

async function saveLoan(){

async function payLoan(id){
  const loan=state.loans.find(item=>item.id===id);
  if(!loan)return toast('No se encontró el préstamo');
  const amount=parseMoneyInput(document.getElementById('loanPayment')?.value);
  const method=document.getElementById('loanPaymentMethod')?.value||'cash';
  if(amount<=0)return toast('Ingresá un monto válido');
  if(amount>Number(loan.remaining||0))return toast(`El máximo pendiente es ${money(loan.remaining)}`);
  if(!['cash','transfer'].includes(method))return toast('Forma de pago inválida');

  const payment={
    id:crypto.randomUUID?.()||String(Date.now()),
    amount:roundCurrency(amount),
    method,
    createdAt:Date.now(),
    dayDate:state.day?.date||''
  };
  loan.remaining=roundCurrency(Number(loan.remaining||0)-payment.amount);
  loan.payments=loan.payments||[];
  loan.payments.push(payment);
  if(loan.remaining<=0){
    loan.remaining=0;
    loan.status='paid';
    loan.paidAt=Date.now();
  }
  await put('loans',loan);
  await auditLog('loan_payment',`Pago de préstamo a ${loan.lender}`,{
    loanId:id,amount:payment.amount,method,dayDate:payment.dayDate,remaining:loan.remaining
  });
  closeSheet();
  render();
  toast(loan.status==='paid'?'Préstamo pagado':'Pago parcial registrado');
}

async function moveClient(id,dir){
  const active=state.clients.filter(c=>c.active!==false).sort((a,b)=>(a.order||999)-(b.order||999));
  const i=active.findIndex(c=>c.id===id),j=i+dir;
  if(i<0||j<0||j>=active.length)return;
  [active[i],active[j]]=[active[j],active[i]];
  for(let k=0;k<active.length;k++){active[k].order=k+1;active[k].updatedAt=Date.now();await put('clients',active[k])}
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  await auditLog('route_reordered','Orden de ruta modificado',{clientId:id,direction:dir});
  showRouteOrder();
}

async function applyClientImport(){
  const draft=state.importDraft;
  if(!draft||!draft.items.length)return toast('No hay datos válidos');
  if(state.day&&state.day.status!=='closed')return toast('Cerrá el día activo antes de modificar saldos');
  const policy=document.getElementById('importPolicy').value;
  if(!confirm(`¿Aplicar ${draft.items.length} registros?`))return;
  let created=0,updated=0,unchanged=0;
  for(const item of draft.items){
    const existing=importMatch(item);
    if(!existing){
      const client={id:crypto.randomUUID?.()||'cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:item.name,balance:item.balance,order:item.order,active:item.active,phone:item.phone||'',address:item.address||'',routeNote:item.routeNote||'',notes:'',createdAt:Date.now(),updatedAt:Date.now()};
      state.clients.push(client);await put('clients',client);created++;continue;
    }
    if(policy==='create'){unchanged++;continue}
    const before=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(policy==='balance')existing.balance=item.balance;
    else{existing.name=item.name;existing.balance=item.balance;existing.order=item.order;existing.active=item.active;if(item.phone)existing.phone=item.phone;if(item.address)existing.address=item.address;if(item.routeNote)existing.routeNote=item.routeNote}
    existing.updatedAt=Date.now();
    const after=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(before!==after){await put('clients',existing);updated++}else unchanged++;
  }
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  const record={id:'im_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),source:draft.source,total:draft.items.length,created,updated,unchanged,errors:draft.errors,policy,createdAt:Date.now()};
  state.imports.unshift(record);await put('imports',record);
  await auditLog('clients_imported','Importación de clientes aplicada',{...record});
  state.importDraft=null;closeSheet();render();toast(`Importación lista: ${created} creados, ${updated} actualizados`);
}

function auditCategoryFor(action=''){
  if(action.startsWith('payment_'))return 'payments';
  if(action.startsWith('route_')||action.startsWith('followup_'))return 'route';
  if(action.startsWith('day_')||action.startsWith('reconciliation_')||action.startsWith('opening_cash_'))return 'closing';
  if(action.includes('import')||action.startsWith('accreditation'))return 'imports';
  if(action.startsWith('client_')||action.startsWith('loan_')||action.startsWith('expense_'))return 'records';
  if(action.includes('backup')||action.includes('restore')||action.includes('snapshot')||action.includes('storage'))return 'security';
  if(action.includes('integrity')||action.includes('repair')||action.includes('self_test')||action.includes('diagnostic')||action==='render_error')return 'system';
  if(action.startsWith('report_')||action.includes('exported'))return 'exports';
  return 'other';
}
